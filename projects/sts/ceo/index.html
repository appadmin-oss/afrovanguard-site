];

function SupportPrompt({ submissionId, form, donated, onDonateClick, highlight, supportRef, donation }) {
  // NOTE: All hooks must be called unconditionally and in the same order on
  // every render — React #300 was firing because pledging was declared after
  // the early-return for `donated`, causing the hook count to drop once a
  // commitment was made.
  const [tier, setTier] = useState(null);
  const [custom, setCustom] = useState("");
  const [pledging, setPledging] = useState(false);
  const customNum = parseInt(custom, 10) || 0;
  const customValid = customNum >= 150000;
  const customChildren = customValid ? Math.floor(customNum / 30000) : 0;

  const selected = tier || (customValid ? { id: "custom", amount: customNum, children: customChildren, name: "Custom Contribution" } : null);

  const buildDonateUrl = () => {
    if (!selected) return "#";
    const params = new URLSearchParams({
      id: submissionId || "",
      tier: selected.name,
      amount: String(selected.amount),
      children: String(selected.children),
    });
    return DONATE_BASE + "?" + params.toString();
  };

  // If already committed, render a slim "thank you" version that highlights
  // exactly what was pledged.
  if (donated) {
    const tierName = donation?.tier || donation?.name || "Your commitment";
    const amount = donation?.amount;
    const children = donation?.children;
    return (
      <section className="support support--donated" ref={supportRef} aria-label="Commitment received">
        <div className="support-eyebrow" style={{color: "var(--success)"}}>NOTED  ·  THANK YOU</div>
        <h2 className="support-h">
          Thank you. <em>That helps.</em>
        </h2>
        {(amount || children) && (
          <div className="support-commitment-summary" aria-label="Your commitment summary">
            <div className="support-commitment-summary__row">
              <span>Tier</span><strong>{tierName}</strong>
            </div>
            {amount ? (
              <div className="support-commitment-summary__row">
                <span>Estimated total</span><strong>₦{Number(amount).toLocaleString()}</strong>
              </div>
            ) : null}
            {children ? (
              <div className="support-commitment-summary__row">
                <span>Lagos children</span><strong>{children} {children === 1 ? "child" : "children"} equipped</strong>
              </div>
            ) : null}
          </div>
        )}
        <p className="support-sub">
          The team will be in touch at <strong>{form.email}</strong> within 48 hours to arrange the contribution by whatever method suits you. You'll also receive photo updates as the Summer Packs are distributed to the Lagos children.
        </p>
        <p className="support-foot">
          A copy of this commitment has been emailed to you. You can change your mind at any point before the team is in touch.
        </p>
      </section>
    );
  }

  const handleProceed = async (e) => {
    e.preventDefault();
    if (!selected || pledging) return;

    setPledging(true);
    try {
      // Log the pledge — team reconciles payment off-platform.
      // We don't block the unlock on the network call succeeding; the local
      // commitment is what matters, and the server logs it best-effort.
      fetch(PLEDGE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({
          id: submissionId || "",
          speaker_name: [form.honorific, form.name].filter(Boolean).join(" ") || "",
          email: form.email || "",
          tier: selected.name,
          amount: selected.amount,
          children: selected.children,
        }),
      }).catch(() => {});
      onDonateClick && onDonateClick({ ...selected, committed: true });
    } finally {
      // small UX delay so the action feels weighty
      setTimeout(() => setPledging(false), 600);
    }
  };

  return (
    <section
      className={cn("support", highlight && "support--highlight")}
      ref={supportRef}
      aria-label="Support the Lagos children"
      id="sts-support"
    >
      <div className="support-eyebrow">A SEPARATE QUESTION  ·  THE 900 CHILDREN</div>
      <h2 className="support-h">
        Your voice will move them. <br />
        Your <em>commitment</em> equips them.
      </h2>
      <p className="support-sub">
        Every Lagos child in the 2026 cohort is given a <strong>Summer Pack</strong> — shirt, bag, notepad, anchor journal, water bottle — at ₦30,000 per Lagos child. The form will work without this section. You can also stop here. But if you'd like to equip a few of the Lagos children you'll be speaking to, choose a level below. No payment is taken here; our team will reach you afterwards to arrange it however you prefer.
      </p>

      <div className="support-stats">
        <div className="support-stat"><span className="n">900</span><span className="l">Lagos children targeted</span></div>
        <div className="support-stat"><span className="n">₦30k</span><span className="l">Per Lagos child</span></div>
        <div className="support-stat"><span className="n">6</span><span className="l">Active centres</span></div>
      </div>

      <div className="support-section-label">Choose a commitment level</div>
      <div className="support-tiers" role="radiogroup" aria-label="Commitment tiers">
        {DONATION_TIERS.map((t) => {
          const on = tier?.id === t.id;
          return (
            <button key={t.id} type="button" role="radio" aria-checked={on}
              className={cn("support-tier", on && "on", t.featured && "featured")}
              data-tier={t.id}
              onClick={() => { setTier(t); setCustom(""); }}
            >
              {t.featured && <div className="support-tier-badge">Most chosen</div>}
              {t.top && <div className="support-tier-badge support-tier-badge--top">Highest impact</div>}
              <div className="support-tier-n">{t.children}</div>
              <div className="support-tier-l">Lagos children equipped</div>
              <div className="support-tier-amount">₦{t.amount.toLocaleString()}</div>
              <div className="support-tier-name">{t.name}</div>
            </button>
          );
        })}
      </div>

      <div className="support-custom">
        <div className="support-custom-head">
          <span>Custom amount</span>
          <span className="support-custom-hint">min ₦150,000 · ₦30,000 / Lagos child</span>
        </div>
        <div className="support-custom-row">
          <span className="support-custom-prefix">₦</span>
          <input
            type="number" min="150000" step="30000" inputMode="numeric"
            value={custom}
            onChange={(e) => { setCustom(e.target.value); setTier(null); }}
            placeholder="150,000"
            aria-label="Custom donation amount in naira"
          />
        </div>
        {customNum > 0 && customNum < 150000 && (
          <div className="support-custom-warn">Minimum is ₦150,000 (5 Lagos children).</div>
        )}
        {customValid && (
          <div className="support-custom-calc">
            <strong>{customChildren} Lagos children</strong> equipped · ₦30,000 × {customChildren} = ₦{(customChildren * 30000).toLocaleString()}
          </div>
        )}
      </div>

      <div className="support-preview" aria-live="polite">
        <div className="support-preview-row"><span>Your commitment</span><strong>{selected ? selected.name : "—"}</strong></div>
        <div className="support-preview-row big"><span>Estimated total</span><strong>{selected ? "₦" + selected.amount.toLocaleString() : "—"}</strong></div>
        <div className="support-preview-row big"><span>Lagos children equipped</span><strong>{selected ? selected.children + (selected.children === 1 ? " child" : " children") : "—"}</strong></div>
      </div>

      <div className="support-cta">
        <button
          type="button"
          className={cn("btn btn-primary btn-final", (!selected || pledging) && "btn-disabled")}
          onClick={handleProceed}
          disabled={!selected || pledging}
          aria-disabled={!selected || pledging}
        >
          {pledging
            ? <>Noted… <span className="btn-spin" aria-hidden="true">◐</span></>
            : selected
              ? <>I'll equip {selected.children} {selected.children === 1 ? "child" : "children"} <span className="btn-arrow" aria-hidden="true">→</span></>
              : <>Choose a level to continue <span className="btn-arrow" aria-hidden="true">→</span></>}
        </button>
      </div>
      <p className="support-foot">
        No payment is taken here. The team will reach you within 48 hours to arrange the contribution by your preferred method (bank transfer, card, cheque). You can change your mind at any point before then.
      </p>
    </section>
  );
}

// ─── Confirmation ────────────────────────────────────────────────────
function Confirmation({ form, computed, onReset, submissionId }) {
  const [stage, setStage] = useState(0);
  const initialDonation = (() => { try { return loadDonationState(); } catch { return { donated: false }; } })();
  const [donated, setDonated] = useState(initialDonation.donated);
  const [donation, setDonation] = useState(initialDonation.donated ? initialDonation : null);
  const [highlight, setHighlight] = useState(false);
  const supportRef = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => setStage(1), 1600);
    return () => clearTimeout(t);
  }, []);

  // The legacy ?donated=1 URL path is still respected (e.g. if a team
  // member shares a pre-unlocked link with a partner). Otherwise the
  // unlock fires from the in-page commitment click below.
  useEffect(() => {
    try {
      const p = new URLSearchParams(window.location.search);
      if (p.get("donated") === "1") {
        const ds = { donated: true, ts: Date.now(), amount: parseInt(p.get("amount"), 10) || null, tier: p.get("tier") || null, verified: true };
        setDonated(true);
        setDonation(ds);
        saveDonationState(ds);
        showToast("Your full Speaker Kit is unlocked. Thank you.", "success", 5000);
        const url = new URL(window.location.href);
        url.searchParams.delete("donated"); url.searchParams.delete("amount");
        window.history.replaceState({}, "", url.toString());
      }
    } catch {}
  }, []);

  const scrollToSupport = () => {
    if (supportRef.current) {
      supportRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
      setHighlight(true);
      setTimeout(() => setHighlight(false), 1800);
    }
  };

  const handleDonateClick = (selected) => {
    // The speaker has clicked Commit. Save it; the team will follow up
    // off-platform to arrange the actual contribution.
    const ds = { donated: true, ts: Date.now(), amount: selected.amount, tier: selected.name, children: selected.children, verified: false, committed: true };
    saveDonationState(ds);
    setDonated(true);
    setDonation(ds);
    showToast("Noted, with thanks. The team will be in touch.", "success", 4500);
  };

  return (
    <div className="confirm">
      <div className="confirm-bg" aria-hidden="true">
        <img src="assets/bg.png" alt="" loading="lazy" decoding="async" />
      </div>
      <div className="confirm-inner">
        <div className={cn("confirm-reveal", stage >= 1 && "compact")}>
          <figure className="confirm-trophy" aria-label="Children of the 2026 cohort — your audience">
            <img src="assets/og-image.png" alt="Children of Street-To-Stardom holding hand-written signs of values they're learning, alongside the STS logo" loading="eager" decoding="async" />
            <figcaption className="confirm-trophy-caption">
              <span className="who">The room you've stepped into</span>
              {submissionId && <span className="ref">Ref · {submissionId}</span>}
            </figcaption>
          </figure>
          <div className="confirm-eyebrow">REQUEST RECEIVED · PENDING CONFIRMATION · EMPOWERED 360°</div>
          <h1 className="confirm-h">{TONE.confirmH}</h1>
          <p className="confirm-sub">
            {[form.honorific, form.name.split(" ")[0]].filter(Boolean).join(" ") || "Friend"}, your request has been received. The centre and date below are <strong>provisional</strong> — our team will review them and email your confirmation within 48 hours.
            {submissionId && <small style={{display:"block", marginTop:8, fontFamily:"var(--font-mono)", fontSize:11, color:"rgba(255,255,255,0.5)", letterSpacing:"0.06em"}}>Reference · {submissionId}</small>}
          </p>
          <dl className="confirm-meta">
            <div><dt>Centre <small className="confirm-meta-tag">provisional</small></dt><dd>{computed.centre?.name}</dd></div>
            <div><dt>Date <small className="confirm-meta-tag">provisional</small></dt><dd>{computed.day?.dow}, {computed.day?.date}</dd></div>
            <div><dt>Theme</dt><dd>{computed.day?.theme}</dd></div>
          </dl>
          <div className="confirm-next-steps" aria-label="What happens next">
            <div className="confirm-next-steps__head">What happens next</div>
            <ol className="confirm-next-steps__list">
              <li>
                <span className="confirm-next-steps__num">1</span>
                <div><strong>Request received</strong><span>Logged just now{submissionId ? ` under reference ${submissionId}` : ""}.</span></div>
              </li>
              <li>
                <span className="confirm-next-steps__num">2</span>
                <div><strong>Team reviews, within 48 hours</strong><span>We check centre capacity and the wider 2026 schedule for any clash with your chosen date.</span></div>
              </li>
              <li>
                <span className="confirm-next-steps__num">3</span>
                <div><strong>Confirmation email sent</strong><span>To {form.email || "your email"} — with your finalised centre, date and calendar invite, or the nearest alternative if one was needed.</span></div>
              </li>
            </ol>
          </div>
        </div>

        <div className={cn("confirm-stage-2", stage >= 1 && "visible")}>
          <DonationBanner donated={donated} donation={donation} onScrollToSupport={scrollToSupport} />

          <div className="confirm-grid">
            <div className="confirm-card-wrap">
              <LegacyCard form={form} computed={computed} confirmed={false} large />
              <AISessionBrief form={form} computed={computed} />
            </div>
            <div className="deliverables-wrap">
              <DeliverablesGrid
                form={form} computed={computed} submissionId={submissionId}
                donated={donated}
                donation={donation}
                onLockedClick={scrollToSupport}
              />
              <div className="deliverable" style={{marginTop: 12}}>
                <AIShareCopy form={form} computed={computed} donated={donated} onLockedClick={scrollToSupport} />
              </div>
            </div>
          </div>

          <div className="confirm-support-wrap">
            <SupportPrompt
              submissionId={submissionId} form={form}
              donated={donated}
              donation={donation}
              onDonateClick={handleDonateClick}
              highlight={highlight}
              supportRef={supportRef}
            />
          </div>

          <div className="confirm-actions">
            <button className="btn btn-ghost-light" onClick={onReset}>
              <span className="btn-arrow back" aria-hidden="true">→</span> Submit another initiation
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App root ────────────────────────────────────────────────────────
const STORAGE_KEY = "sts-ceo-form-v5";
const PHOTO_KEY = "sts-ceo-form-v5:photo";
const DONATE_KEY = "sts-ceo-form-v5:donated";
const EMPTY = { honorific: "", name: "", role: "", org: "", email: "", whatsapp: "", notes: "", centre: "", date: "", photoDataUrl: "" };

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const base = raw ? { ...EMPTY, ...JSON.parse(raw) } : EMPTY;
    // Photo stored separately because base64 dataURLs are large.
    try { base.photoDataUrl = localStorage.getItem(PHOTO_KEY) || ""; } catch {}
    return base;
  } catch { return EMPTY; }
}

function loadDonationState() {
  try {
    const raw = localStorage.getItem(DONATE_KEY);
    return raw ? JSON.parse(raw) : { donated: false, ts: null, amount: null };
  } catch { return { donated: false, ts: null, amount: null }; }
}
function saveDonationState(s) {
  try { localStorage.setItem(DONATE_KEY, JSON.stringify(s)); } catch {}
}

function App() {
  const [scene, setScene] = useState("hero");
  const [step, setStep] = useState(0);
  const [errors, setErrors] = useState({});
  const [form, setForm] = useState(loadSaved);
  const [mobilePreview, setMobilePreview] = useState(false);
  const [aiMatch, setAiMatch] = useState(null);
  const [howItWorks, setHowItWorks] = useState(false);
  const [reservations, setReservations] = useState([]);
  const [milestones, setMilestones] = useState([]);
  const [submitting, setSubmitting] = useState(false);
  const [submissionId, setSubmissionId] = useState(null);
  const [apiUnreachable, setApiUnreachable] = useState(false);

  const hasSavedProgress = useMemo(
    () => !!(form.name?.trim() || form.email?.trim() || form.centre || form.date),
    [form]
  );

  // API path health check — confirms api/ping.php is reachable at the
  // resolved API_BASE. If it 404s, the page URL doesn't match where
  // the PHP files live and the form would just silently fail on submit.
  // Surfacing this early gives the user something actionable.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const r = await fetch(API_BASE + "/ping.php", { credentials: "same-origin" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        if (!cancelled && j && j.ok) {
          console.info("[STS] API reachable at " + API_BASE + " · PHP " + j.php);
        }
      } catch (e) {
        if (!cancelled) {
          console.error("[STS] API unreachable at " + API_BASE + "/ping.php · " + e.message);
          setApiUnreachable(true);
        }
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Fetch reservations on mount
  useEffect(() => {
    fetchReservations().then(setReservations).catch(() => {});
    fetchMilestones().then((m) => { if (m && m.length) setMilestones(m); }).catch(() => {});
  }, []);

  // Auto-save (photo stored separately to avoid blowing localStorage quota)
  useEffect(() => {
    try {
      const { photoDataUrl, ...rest } = form;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rest));
      if (photoDataUrl) localStorage.setItem(PHOTO_KEY, photoDataUrl);
      else localStorage.removeItem(PHOTO_KEY);
    } catch (e) {
      // Quota exceeded — most likely the photo dataURL is too large.
      // Drop it from persistent storage; it stays in-memory for this session.
      try { localStorage.removeItem(PHOTO_KEY); } catch {}
    }
  }, [form]);

  const computed = useMemo(() => {
    const allDays = WEEKS.flatMap((w) => w.days);
    const centre = CENTRES.find((c) => c.id === form.centre);
    const day = allDays.find((d) => d.id === form.date);
    return { centre, day };
  }, [form.centre, form.date]);

  // Fetch AI centre match when entering step 2
  useEffect(() => {
    if (step !== 1 || aiMatch) return;
    const profileReady = form.name.trim().split(/\s+/).length >= 2 && form.role.trim() && form.org.trim();
    if (profileReady) {
      AI.centreMatch({ name: form.name, role: form.role, org: form.org }).then((d) => { if (d) setAiMatch(d); }).catch(() => {});
    }
  }, [step, aiMatch, form.name, form.role, form.org]);

  // Prevent selecting an already-reserved date
  const reservedDateIds = useMemo(() => new Set(reservations.map((r) => r.dateId)), [reservations]);

  const validate = (s) => {
    const e = {};
    if (s === 0) {
      if (!form.name.trim() || form.name.trim().split(/\s+/).length < 2) e.name = true;
      if (!form.role.trim()) e.role = true;
      if (!form.org.trim()) e.org = true;
      if (!isEmail(form.email)) e.email = true;
    }
    if (s === 1 && !form.centre) e.centre = true;
    if (s === 2) {
      if (!form.date || reservedDateIds.has(form.date)) e.date = true;
    }
    return e;
  };

  const canAdvance = useMemo(() => Object.keys(validate(step)).length === 0, [step, form, reservedDateIds]);

  const scrollToComposer = () => {
    requestAnimationFrame(() => {
      const stage = document.getElementById("composer");
      if (stage) stage.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  };

  const goNext = () => {
    const e = validate(step);
    setErrors(e);
    if (Object.keys(e).length === 0) {
      setStep((x) => Math.min(x + 1, 3));
      scrollToComposer();
    } else {
      showToast("Please complete the highlighted fields.", "error", 3200);
    }
  };

  const goBack = () => {
    setErrors({});
    setStep((x) => Math.max(0, x - 1));
    scrollToComposer();
  };

  const goSubmit = async () => {
    if (submitting) return;
    const allErrs = { ...validate(0), ...validate(1), ...validate(2) };
    if (Object.keys(allErrs).length > 0) {
      setErrors(allErrs);
      showToast("Some details are missing. Please review.", "error");
      return;
    }
    setSubmitting(true);
    const centreObj = CENTRES.find((c) => c.id === form.centre);
    const dayObj = WEEKS.flatMap((w) => w.days).find((d) => d.id === form.date);
    const res = await submitForm({
      honorific: form.honorific, name: form.name, role: form.role, org: form.org,
      email: form.email, whatsapp: form.whatsapp, notes: form.notes,
      centre: form.centre, date: form.date,
      centre_name: centreObj?.name || "",
      centre_focus: centreObj?.focus || "",
      date_display: dayObj ? `${dayObj.dow}, ${dayObj.date}` : "",
      theme: dayObj?.theme || "",
      series_theme: TONE.seriesTheme,
      has_photo: !!form.photoDataUrl,
    });
    setSubmitting(false);
    if (res.ok) {
      setSubmissionId(res.data?.id || null);
      setScene("confirm");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      showToast(res.error || "Submission failed. Please try again.", "error", 6000);
    }
  };

  const goReset = () => {
    setScene("hero"); setStep(0); setForm(EMPTY);
    setAiMatch(null); setSubmissionId(null);
    AI.clearCache();
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    try { localStorage.removeItem(PHOTO_KEY); } catch {}
    try { localStorage.removeItem(DONATE_KEY); } catch {}
    setTimeout(() => window.scrollTo({ top: 0, behavior: "smooth" }), 50);
  };

  const onBegin = () => {
    setScene("form");
    setTimeout(scrollToComposer, 50);
  };

  if (scene === "confirm") {
    return (
      <div className="page page-confirm">
        <Confirmation form={form} computed={computed} onReset={goReset} submissionId={submissionId} />
        <SiteFooter onBegin={goReset} />
        <BackToTop />
        <ToastContainer />
      </div>
    );
  }

  return (
    <div className="page">
      <a href="#main" className="skip-link">Skip to main content</a>
      {apiUnreachable && (
        <div className="api-warning" role="alert">
          <span className="api-warning-icon" aria-hidden="true">⚠</span>
          <div className="api-warning-body">
            <strong>Backend unreachable.</strong> The form won't be able to submit until the PHP files are deployed correctly.
            Expected at <code>{API_BASE}/</code>. If you're the site owner, check the <code>api/</code> folder is uploaded
            and that <code>{API_BASE}/ping.php</code> returns JSON.
          </div>
          <button
            type="button"
            className="api-warning-dismiss"
            onClick={() => setApiUnreachable(false)}
            aria-label="Dismiss warning"
          >×</button>
        </div>
      )}
      <TopBar stepIx={step} showStepper={scene === "form"} onJumpToForm={scene === "hero" ? onBegin : null} />

      {scene === "hero" && <Hero onBegin={onBegin} hasSavedProgress={hasSavedProgress} onHowItWorks={() => setHowItWorks(true)} reservations={reservations} />}
      {scene === "hero" && <CountdownBand milestones={milestones} />}

      <main id="main" className="stage">
        <div className="wrap">
          {scene === "form" && <Prelude reservations={reservations} />}
          {scene === "form" && (
            <div id="composer" className="composer">
              <section className="composer-left">
                <Stepper step={step} onJump={(i) => setStep(i)} />
                <div className="scene-wrap">
                  {step === 0 && (
                    <StepIdentity
                      form={form} setForm={setForm} errors={errors}
                      aiNoteSuggest={<AINoteSuggest form={form} onSelect={(note) => setForm({ ...form, notes: note })} />}
                    />
                  )}
                  {step === 1 && (
                    <StepCentre
                      form={form} setForm={setForm} errors={errors}
                      aiMatch={aiMatch}
                      aiPanel={<AICentreInsight form={form} onSelectCentre={(id) => setForm({ ...form, centre: id })} />}
                    />
                  )}
                  {step === 2 && <StepDate form={form} setForm={setForm} errors={errors} reservations={reservations} />}
                  {step === 3 && <StepReview form={form} computed={computed} />}
                </div>

                <div className="actions">
                  <button className="btn btn-ghost" onClick={goBack} disabled={step === 0} style={{ visibility: step === 0 ? "hidden" : "visible" }}>
                    <span className="btn-arrow back" aria-hidden="true">→</span> Back
                  </button>
                  {step < 3 && (
                    <button className="btn btn-primary" onClick={goNext} disabled={!canAdvance}>
                      Continue to {STEPS[step + 1].title.toLowerCase()} <span className="btn-arrow" aria-hidden="true">→</span>
                    </button>
                  )}
                  {step === 3 && (
                    <button className="btn btn-primary btn-final" onClick={goSubmit} disabled={submitting} aria-busy={submitting}>
                      {submitting
                        ? <>Sending your request <span className="btn-loader" aria-hidden="true"></span></>
                        : <>Request my seat in the archive <span className="btn-arrow" aria-hidden="true">→</span></>}
                    </button>
                  )}
                </div>

                <div className="composer-foot">
                  <span>{STEPS[step].scene} · {STEPS[step].title}</span>
                  <span className="autosave"><span className="autosave-dot"></span>Saved to this device</span>
                </div>
              </section>

              <aside className="composer-right" aria-label="Your live invitation">
                <div className="sticky-rail">
                  <LegacyCard form={form} computed={computed} confirmed={false} />
                  <PeersPanel reservations={reservations} />
                </div>
              </aside>
            </div>
          )}
        </div>
      </main>

      <SiteFooter onBegin={onBegin} />
      <BackToTop />
      <HowItWorksModal open={howItWorks} onClose={() => setHowItWorks(false)} onBegin={onBegin} />
      <ToastContainer />
      <div className="live-region" role="status" aria-live="polite">{submitting && "Submitting your initiation…"}</div>

      {scene === "form" && (
        <div className="mob-bar" role="region" aria-label="Form actions">
          <button className="mob-preview-btn" onClick={() => setMobilePreview(true)} aria-label="Preview your invitation">
            <span className="mob-preview-init" aria-hidden="true">{form.name ? initialsFrom([form.honorific, form.name].filter(Boolean).join(" ")) : "—"}</span>
            <span className="mob-preview-meta">
              <strong>{[form.honorific, form.name].filter(Boolean).join(" ") || "Your invitation"}</strong>
              <small>{computed.centre?.name || "Centre pending"} · {computed.day?.date || "Date pending"}</small>
            </span>
            <span className="mob-preview-eye" aria-hidden="true">↗</span>
          </button>
          <div className="mob-actions">
            {step > 0 && <button className="mob-back" onClick={goBack} aria-label="Back">←</button>}
            {step < 3 && <button className="btn btn-primary mob-continue" onClick={goNext} disabled={!canAdvance}>Continue <span className="btn-arrow" aria-hidden="true">→</span></button>}
            {step === 3 && (
              <button className="btn btn-primary mob-continue" onClick={goSubmit} disabled={submitting} aria-busy={submitting}>
                {submitting ? <>Sending <span className="btn-loader" aria-hidden="true"></span></> : <>Request <span className="btn-arrow" aria-hidden="true">→</span></>}
              </button>
            )}
          </div>
        </div>
      )}

      <div className={cn("mob-sheet", mobilePreview && "open")} onClick={(e) => e.target.classList.contains("mob-sheet") && setMobilePreview(false)} role="dialog" aria-modal="true" aria-hidden={!mobilePreview} aria-label="Your invitation preview">
        <div className="mob-sheet-inner">
          <div className="mob-sheet-handle" aria-hidden="true"></div>
          <div className="mob-sheet-head">
            <strong>Your live invitation</strong>
            <button className="mob-sheet-close" onClick={() => setMobilePreview(false)} aria-label="Close">✕</button>
          </div>
          <LegacyCard form={form} computed={computed} confirmed={false} />
          <PeersPanel reservations={reservations} />
        </div>
      </div>
    </div>
  );
}

// Top-level error boundary. A render-time exception in any subtree (a
// canvas helper throwing on undefined, a missing data field, an obscure
// browser quirk) would otherwise unmount the entire React tree and
// produce a blank white page with no recovery. Catching it here gives
// the user a clear path forward and prints the cause to the console so
// we can fix it in production.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null, info: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) {
    console.error("[STS ErrorBoundary]", err, info);
    this.setState({ info });
    // Best-effort: log to the backend for diagnosis
    try {
      fetch(API_BASE + "/error-log.php", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: String(err && err.message || err),
          stack: String(err && err.stack || ""),
          info: String(info && info.componentStack || ""),
          url: window.location.href,
          ua: navigator.userAgent,
          ts: new Date().toISOString(),
        }),
      }).catch(() => {});
    } catch {}
  }
  render() {
    if (this.state.err) {
      return (
        <div style={{
          minHeight: "100dvh", padding: "48px 24px", display: "flex",
          alignItems: "center", justifyContent: "center", background: "var(--bg)",
          color: "var(--ink)", fontFamily: "Inter, system-ui, sans-serif",
        }}>
          <div style={{ maxWidth: 520 }}>
            <div style={{
              fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase",
              color: "var(--crimson)", fontWeight: 700, marginBottom: 14,
            }}>Something went wrong</div>
            <h1 style={{
              fontFamily: "Montserrat, sans-serif", fontWeight: 600,
              fontSize: 32, letterSpacing: "-0.02em", lineHeight: 1.15,
              margin: "0 0 16px",
            }}>The page hit an unexpected error.</h1>
            <p style={{ color: "var(--muted)", fontSize: 15, lineHeight: 1.6, margin: "0 0 24px" }}>
              Your details should still be safe in your browser. Try reloading — if it persists, contact the team.
            </p>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <button
                type="button"
                onClick={() => window.location.reload()}
                style={{
                  background: "var(--ink)", color: "var(--bg)", border: 0,
                  padding: "12px 22px", borderRadius: 999, fontSize: 14,
                  fontWeight: 600, cursor: "pointer",
                }}
              >Reload the page</button>
              <a
                href="mailto:cacentre@afrovanguard.org.ng"
                style={{
                  background: "transparent", color: "var(--ink)",
                  border: "1.5px solid var(--hairline-strong)",
                  padding: "10px 22px", borderRadius: 999, fontSize: 14,
                  fontWeight: 600, textDecoration: "none",
                }}
              >Contact the team</a>
            </div>
            <details style={{ marginTop: 28, fontSize: 12, color: "var(--muted)" }}>
              <summary style={{ cursor: "pointer" }}>Technical details</summary>
              <pre style={{
                marginTop: 10, padding: 12, background: "var(--bg-sunken)",
                borderRadius: 8, overflowX: "auto", fontSize: 11,
                whiteSpace: "pre-wrap", wordBreak: "break-word",
              }}>{String(this.state.err && this.state.err.message || this.state.err)}</pre>
            </details>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
