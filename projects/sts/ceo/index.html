const STS_LOGO_DATA_URL = "data:image/svg+xml;base64," + STS_LOGO_SVG_B64;
let _stsLogoImage = null;
function ensureSTSLogo() {
  if (_stsLogoImage) return _stsLogoImage;
  _stsLogoImage = new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = STS_LOGO_DATA_URL;
  });
  return _stsLogoImage;
}

// jsPDF accepts PNG data URLs; SVG is unsupported. We rasterize the SVG
// to a PNG on demand at the requested size and cache by size key. The
// result is a base64 PNG data URL embedded directly into the PDF — same
// approach as the canvas card, ensuring the deliverable carries the
// canonical logo without depending on any external file.
const _stsLogoPngCache = new Map();
async function ensureSTSLogoPng(size = 256) {
  const key = String(size);
  if (_stsLogoPngCache.has(key)) return _stsLogoPngCache.get(key);
  const promise = (async () => {
    const img = await ensureSTSLogo();
    const c = document.createElement("canvas");
    c.width = size; c.height = size;
    const ctx = c.getContext("2d");
    // Transparent background — let the PDF's own colour show through
    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
    return c.toDataURL("image/png");
  })();
  _stsLogoPngCache.set(key, promise);
  return promise;
}

// Paint the STS logo onto a canvas at (x,y) with the given size.
// async — caller should await this so the image is decoded before
// subsequent draw calls layer on top.
async function cnvDrawSTSChip(ctx, x, y, size, opts) {
  const o = opts || {};
  try {
    const img = await ensureSTSLogo();
    if (o.shadow !== false) {
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.25)";
      ctx.shadowBlur = size * 0.18;
      ctx.shadowOffsetY = size * 0.04;
      ctx.drawImage(img, x, y, size, size);
      ctx.restore();
    } else {
      ctx.drawImage(img, x, y, size, size);
    }
  } catch {
    // Fallback rendering — paints a chip even if image decode failed
    const r = size * 0.16;
    cnvRoundRect(ctx, x, y, size, size, r);
    ctx.fillStyle = o.bg || "#1791C8"; ctx.fill();
    const tw = size * 0.16;
    ctx.fillStyle = o.accent || "#E60040";
    cnvRoundRect(ctx, x + (size - tw) / 2, y + size * 0.14, tw, size * 0.72, tw * 0.18);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "800 " + Math.round(size * 0.42) + "px Montserrat, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("S", x + size * 0.28, y + size * 0.50);
    ctx.fillText("S", x + size * 0.72, y + size * 0.50);
    ctx.font = "800 " + Math.round(size * 0.36) + "px Montserrat, Helvetica, Arial, sans-serif";
    ctx.fillText("T", x + size * 0.50, y + size * 0.50);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }
}

// ── Edition number — turns each card into a one-of-one collectible
function cnvEditionFromRef(ref) {
  // Produces a short alphanumeric edition code from the submission reference
  if (!ref) return "—";
  const hash = String(ref).split("").reduce((a, c) => ((a << 5) - a + c.charCodeAt(0)) | 0, 0);
  const abs = Math.abs(hash);
  return "№ " + (abs % 9000 + 1000).toString();
}

function cnvFormatDateLong(s) {
  // "Aug 1, 2026" → "01 · AUG · 2026"
  if (!s) return "—";
  const m = String(s).match(/(\w+)\s+(\d+),\s+(\d+)/);
  if (!m) return s.toUpperCase();
  const mon = m[1].slice(0, 3).toUpperCase();
  const day = String(m[2]).padStart(2, "0");
  return day + " · " + mon + " · " + m[3];
}

// ── "I Will Be There" Card — 1200x1500 editorial poster ────────────
// An A4-feel cinematic share-card. Layered grid: full-bleed photograph,
// dual scrim (top neutral + bottom blue-ink), 12-column grid with a
// magazine-style headline lock-up, edition number, framed portrait
// medallion when the user uploads a photo, properly designed footer.
async function generateIWillBeThereCard(form, computed, opts) {
  const W = 1200, H = 1500;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");

  await ensureFontLoaded([
    "500 16px Montserrat", "600 18px Montserrat", "700 26px Montserrat",
    "600 56px Montserrat", "800 200px Montserrat", "900 142px Montserrat",
    "400 108px \"Playfair Display\"", "italic 700 152px \"Playfair Display\"",
    "600 20px \"Playfair Display\"",
  ]);

  const M = 72;            // page margin
  const COL = (W - M * 2); // single-column width

  // ── 1. Full-bleed photograph (user's if uploaded, else STS asset) ──
  // When the user has uploaded a photo, we lay the STS bg.png cinematic
  // image over it at low opacity in screen-blend, so the brand veil is
  // present in either case — the speaker's portrait never reads as
  // "raw upload"; it always reads as "designed STS poster".
  const hasUserPhoto = !!form.photoDataUrl;
  let photoLoaded = true;
  try {
    const src = form.photoDataUrl || "assets/i-will-be-there.png";
    const img = await loadImg(src);
    const ratio = Math.max(W / img.width, H / img.height);
    const dw = img.width * ratio, dh = img.height * ratio;
    ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  } catch {
    photoLoaded = false;
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0E1740"); bg.addColorStop(1, "#06060B");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  }

  // Cinematic overlay — only when user uploaded a photo. Layers the STS
  // brand bg.png at low opacity to give the poster the same "Wider &
  // Greater Impact" feel regardless of source photograph.
  if (hasUserPhoto) {
    try {
      const bgImg = await loadImg("assets/bg.png");
      const ratio = Math.max(W / bgImg.width, H / bgImg.height);
      const dw = bgImg.width * ratio, dh = bgImg.height * ratio;
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.globalCompositeOperation = "screen";
      ctx.drawImage(bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.restore();
    } catch {}
  }

  // ── 2. Editorial scrim — soft top (face legibility) + bold bottom (type) ──
  const scrim = ctx.createLinearGradient(0, 0, 0, H);
  if (hasUserPhoto) {
    scrim.addColorStop(0.00, "rgba(6,6,11,0.55)");
    scrim.addColorStop(0.18, "rgba(6,6,11,0.10)");
    scrim.addColorStop(0.45, "rgba(6,6,11,0.05)");
    scrim.addColorStop(0.62, "rgba(6,6,11,0.55)");
    scrim.addColorStop(0.85, "rgba(4,32,181,0.88)");
    scrim.addColorStop(1.00, "rgba(6,6,11,0.98)");
  } else {
    scrim.addColorStop(0.00, "rgba(6,6,11,0.55)");
    scrim.addColorStop(0.30, "rgba(6,6,11,0.25)");
    scrim.addColorStop(0.55, "rgba(6,6,11,0.55)");
    scrim.addColorStop(0.78, "rgba(4,32,181,0.86)");
    scrim.addColorStop(1.00, "rgba(6,6,11,0.98)");
  }
  ctx.fillStyle = scrim; ctx.fillRect(0, 0, W, H);

  // Subtle film grain across the whole canvas — gives it tactile weight,
  // tuned low so the card reads as clean rather than noisy.
  try { cnvFilmGrain(ctx, 0, 0, W, H, 6); } catch {}

  // ── 3. Top register — eyebrow rule + masthead ─────────────────────
  // Hairline crimson rule
  ctx.fillStyle = "#E60040";
  ctx.fillRect(M, 64, 32, 3);
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.fillRect(M + 36, 65, COL - 36, 1);

  ctx.textBaseline = "top";

  // Masthead
  ctx.fillStyle = "rgba(255,255,255,0.96)";
  ctx.font = "700 24px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("STREET-TO-STARDOM", M, 84);
  ctx.fillStyle = "rgba(255,255,255,0.58)";
  ctx.font = "500 12px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("2026  ·  EMPOWERED 360°", M, 118);

  // Edition tag right-aligned
  ctx.textAlign = "right";
  ctx.font = "600 11px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.42)";
  ctx.fillText("SPEAKER ARCHIVE  ·  LIMITED EDITION", W - M, 86);
  ctx.fillStyle = "rgba(255,255,255,0.82)";
  ctx.font = "600 20px \"Playfair Display\", Georgia, serif";
  ctx.fillText(cnvEditionFromRef((opts && opts.submissionId) || ""), W - M, 108);
  ctx.textAlign = "left";

  // ── 4. Big editorial mark — "I will be there." anchored bottom-half ─
  // A single editorial lock-up. We replaced the prior polychromatic
  // gradient with a clean single accent for a more professional read.
  const markY = Math.round(H * 0.42);
  // small kicker
  ctx.fillStyle = "rgba(255,255,255,0.58)";
  ctx.font = "600 12px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("PERSONAL COMMITMENT  ·  AUGUST 2026", M, markY);
  // hairline accent
  ctx.fillStyle = "#E60040";
  ctx.fillRect(M, markY + 22, 24, 2);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(M + 28, markY + 23, 120, 1);

  // headline line 1 — Playfair for a credential / editorial feel
  ctx.fillStyle = "rgba(255,255,255,0.96)";
  ctx.font = "400 108px \"Playfair Display\", Georgia, serif";
  cnvShadowedText(ctx, "I will be", M - 4, markY + 50, { shadowBlur: 14 });

  // headline line 2 — italic Playfair in a single warm bone tone
  const wordY = markY + 50 + 96;
  ctx.fillStyle = "#FFE4B5";
  ctx.font = "italic 700 152px \"Playfair Display\", Georgia, serif";
  cnvShadowedText(ctx, "there.", M - 6, wordY, { shadowBlur: 18 });

  // ── 5. Optional portrait medallion (top-right) ─────────────────────
  if (hasUserPhoto) {
    try {
      const portrait = await loadImg(form.photoDataUrl);
      const MED = 168;
      const cx = W - M - MED / 2;
      const cy = 220 + MED / 2;

      // Soft glow halo behind
      const halo = ctx.createRadialGradient(cx, cy, MED * 0.4, cx, cy, MED * 0.95);
      halo.addColorStop(0, "rgba(167, 187, 255, 0.55)");
      halo.addColorStop(1, "rgba(167, 187, 255, 0)");
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(cx, cy, MED * 0.95, 0, Math.PI * 2); ctx.fill();

      cnvDrawCenteredCircleImage(ctx, portrait, cx, cy, MED);

      // Inner crisp ring
      ctx.strokeStyle = "rgba(255,255,255,0.92)";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, MED / 2, 0, Math.PI * 2); ctx.stroke();
      // Outer crimson trace
      ctx.strokeStyle = "rgba(230, 0, 64, 0.85)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, MED / 2 + 8, 0, Math.PI * 2); ctx.stroke();
    } catch {}
  }

  // ── 6. Speaker block ──────────────────────────────────────────────
  // Hairline rule above name
  ctx.fillStyle = "rgba(255,255,255,0.22)";
  ctx.fillRect(M, wordY + 200, COL, 1);

  const displayName = [form.honorific, form.name].filter(Boolean).join(" ");
  ctx.fillStyle = "rgba(255,255,255,0.62)";
  ctx.font = "600 12px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("2026 SPEAKER · PENDING CONFIRMATION", M, wordY + 218);

  ctx.fillStyle = "#fff";
  ctx.font = "700 56px Montserrat, Helvetica, Arial, sans-serif";
  cnvShadowedText(ctx, displayName || "—", M, wordY + 240, { shadowBlur: 10 });

  ctx.fillStyle = "rgba(255,255,255,0.78)";
  ctx.font = "500 22px Montserrat, Helvetica, Arial, sans-serif";
  const role = (form.role || "") + (form.org ? "  ·  " + form.org : "");
  const roleLines = wrapText(ctx, role, COL);
  roleLines.slice(0, 2).forEach((line, i) => ctx.fillText(line, M, wordY + 312 + i * 28));

  // ── 7. Three-column session block ─────────────────────────────────
  const blockY = H - 280;
  // Top hairline rule with crimson tick
  ctx.fillStyle = "#E60040";
  ctx.fillRect(M, blockY - 4, 18, 2);
  ctx.fillStyle = "rgba(255,255,255,0.30)";
  ctx.fillRect(M + 22, blockY - 3, COL - 22, 1);

  const cols = [
    { l: "CENTRE", v: computed.centre?.name || "—" },
    { l: "DATE",   v: cnvFormatDateLong(computed.day?.date || "") },
    { l: "THEME",  v: computed.day?.theme || "—" },
  ];
  const colW = COL / 3;
  cols.forEach((col, i) => {
    const x = M + i * colW;
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.font = "600 12px Montserrat, Helvetica, Arial, sans-serif";
    ctx.fillText(col.l, x, blockY + 16);
    ctx.fillStyle = "#fff";
    ctx.font = "700 22px Montserrat, Helvetica, Arial, sans-serif";
    const lines = wrapText(ctx, col.v, colW - 16);
    lines.slice(0, 2).forEach((line, j) => ctx.fillText(line, x, blockY + 40 + j * 26));
  });

  // ── 8. Footer — brand chip + cite + URL ───────────────────────────
  const footY = H - 96;
  // STS chip (proper rendering)
  await cnvDrawSTSChip(ctx, M, footY, 56);

  // Footer text right of chip
  ctx.fillStyle = "rgba(255,255,255,0.62)";
  ctx.font = "600 11px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("AN AFROVANGUARD INITIATIVE", M + 76, footY + 8);
  ctx.fillStyle = "#fff";
  ctx.font = "700 14px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("afrovanguard.org.ng", M + 76, footY + 28);

  // Right side: small typographic credit
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.font = "500 10px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("STS_2026_ED_" + cnvEditionFromRef((opts && opts.submissionId) || "").replace(/[^0-9]/g, ""), W - M, footY + 10);
  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.font = "500 11px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("afrovanguard.org.ng", W - M, footY + 28);
  ctx.textAlign = "left";

  return new Promise((res) => c.toBlob(res, "image/png", 0.94));
}

// ── Impact Badge — 1080×1080 social-ready PR-grade asset ───────────
// Built for Twitter/X, LinkedIn, WhatsApp Status. Strong centred lock-up
// with the speaker as the protagonist. Uses the same brand grammar as
// the I Will Be There card: photographic backdrop, dual scrim, masthead,
// rule with crimson tick, edition number, proper STS chip.
// ── Sector / role classifier ────────────────────────────────────────
// Infers the speaker's broad sector from their role + organisation +
// the centre they've chosen, and returns a "theme" used to tint the
// Impact Badge with an accent palette that fits the speaker — quietly,
// not as a brand stamp. Keeps the badge feeling personal rather than
// templated. The classifier is intentionally simple (rule-based);
// runs offline; no external service.
function classifySpeakerContext(form, computed) {
  const t = ((form.role || "") + " " + (form.org || "") + " " + (computed?.centre?.focus || "")).toLowerCase();
  // Order matters — earlier matches win
  const rules = [
    { id: "tech",       match: /(tech|engineer|software|ceo of \w+lab|ai|robotics|product|computer|digital)/, accent: "#5172FF", glow: "rgba(81,114,255,0.55)",  kicker: "TECH & FUTURE LEADERSHIP" },
    { id: "civic",      match: /(government|minister|commission|policy|civic|legislator|legal|attorney|judge|representative|senator|parliament|public service)/, accent: "#33C9DC", glow: "rgba(51,201,220,0.55)", kicker: "CIVIC LEADERSHIP" },
    { id: "enterprise", match: /(entrepre|founder|venture|capital|invest|business|finance|bank|cfo|coo|trade|enterprise|commerce)/, accent: "#FFB58A", glow: "rgba(255,181,138,0.55)", kicker: "ENTERPRISE & BUILD" },
    { id: "arts",       match: /(artist|art\b|writer|musician|filmmaker|director|creative|design|story|theatre|poet)/, accent: "#FF8094", glow: "rgba(255,128,148,0.55)", kicker: "ARTS & VOICE" },
    { id: "stewardship",match: /(environment|climate|water|sustain|conservation|agriculture|green|stewardship|nonprofit|ngo)/, accent: "#7CCB7E", glow: "rgba(124,203,126,0.55)", kicker: "STEWARDSHIP" },
    { id: "mastery",    match: /(athlete|coach|trainer|education|teacher|professor|academic|psychologist|discipline|mastery|sport)/, accent: "#E6C26B", glow: "rgba(230,194,107,0.55)", kicker: "MASTERY & DISCIPLINE" },
  ];
  for (const r of rules) {
    if (r.match.test(t)) return r;
  }
  return { id: "leader", match: null, accent: "#A8BBFF", glow: "rgba(167,187,255,0.55)", kicker: "WILL ADDRESS THE NEXT 900" };
}

// Adaptive title sizing — long names should not overflow the canvas
// or wrap to three lines. Returns the largest font size at which the
// name fits within (W - 2M) on at most two lines.
function fitTitleFontSize(ctx, text, maxWidth, family, weight, ceiling = 76, floor = 40) {
  for (let s = ceiling; s >= floor; s -= 2) {
    ctx.font = weight + " " + s + "px " + family;
    const lines = wrapText(ctx, text, maxWidth);
    if (lines.length <= 2 && Math.max(...lines.map((l) => ctx.measureText(l).width)) <= maxWidth) {
      return { size: s, lines };
    }
  }
  ctx.font = weight + " " + floor + "px " + family;
  return { size: floor, lines: wrapText(ctx, text, maxWidth) };
}

async function generateImpactBadge(form, computed, opts) {
  const donation = opts && opts.donation ? opts.donation : null;
  // ─────────────────────────────────────────────────────────────────
  // Speaker Credential Badge — 1080×1080
  // Designed as an actual professional credential, not a magazine
  // cover. Structure:
  //
  //   ┌─ outer hairline border (sector accent) ──────────────┐
  //   │  ┌─ inner hairline (warm bone) ───────────────────┐  │
  //   │  │  STS chip · OFFICIAL CREDENTIAL · № edition     │  │
  //   │  │  ───────────────────────────────────────────    │  │
  //   │  │                                                 │  │
  //   │  │           ⟨ laurel ⟩  ⟨ photo ⟩  ⟨ laurel ⟩      │  │
  //   │  │                                                 │  │
  //   │  │             ★ SECTOR · KICKER ★                  │  │
  //   │  │                                                 │  │
  //   │  │           DR. ADAOBI OKONKWO                    │  │
  //   │  │           ─────────────────────                 │  │
  //   │  │           FOUNDER · LAGOS CLIMATE LAB           │  │
  //   │  │                                                 │  │
  //   │  │  ─────────────────────────────────────          │  │
  //   │  │  ISSUED BY                  IN ATTESTATION OF   │  │
  //   │  │  Street-To-Stardom          Ikotun Hub · Lagos  │  │
  //   │  │  2026 Series  ·  Aug 2026   Theme: Retention    │  │
  //   │  └─────────────────────────────────────────────────┘  │
  //   └────────────────────────────────────────────────────────┘
  // ─────────────────────────────────────────────────────────────────
  const W = 1080;
  const c = document.createElement("canvas"); c.width = W; c.height = W;
  const ctx = c.getContext("2d");

  await ensureFontLoaded([
    "500 12px Montserrat", "600 14px Montserrat", "700 16px Montserrat",
    "600 18px Montserrat", "700 26px Montserrat",
    "400 60px \"Playfair Display\"", "700 60px \"Playfair Display\"",
  ]);

  const sector = classifySpeakerContext(form, computed);
  const M = 64;
  const COL = W - M * 2;

  // ── 1. Deep, slightly textured background (paper-feel) ─────────
  // Ink base
  ctx.fillStyle = "#0A0A0F";
  ctx.fillRect(0, 0, W, W);
  // Radial spotlight to give the surface a centre-of-attention
  const spot = ctx.createRadialGradient(W/2, W/2, 0, W/2, W/2, W * 0.75);
  spot.addColorStop(0, "rgba(255,255,255,0.04)");
  spot.addColorStop(0.5, "rgba(255,255,255,0.01)");
  spot.addColorStop(1, "rgba(0,0,0,0.35)");
  ctx.fillStyle = spot; ctx.fillRect(0, 0, W, W);
  // Subtle film grain — paper noise (kept low so the badge reads as clean
  // ceremonial rather than textural)
  try { cnvFilmGrain(ctx, 0, 0, W, W, 4); } catch {}

  // ── 2. Borders — outer sector-accent + inner bone hairline ─────
  // Outer rule (24px from edge)
  ctx.strokeStyle = sector.accent;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(24, 24, W - 48, W - 48);
  ctx.globalAlpha = 1;
  // Inner rule — warm bone-white (48px from edge), the actual badge edge
  ctx.strokeStyle = "rgba(232,222,200,0.30)";
  ctx.lineWidth = 0.75;
  ctx.strokeRect(48, 48, W - 96, W - 96);

  // Corner ornaments — small + sign at each corner (like a stamp)
  function cornerOrnament(x, y) {
    ctx.strokeStyle = "rgba(232,222,200,0.55)";
    ctx.lineWidth = 1.2;
    const r = 8;
    ctx.beginPath();
    ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
    ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
    ctx.stroke();
  }
  cornerOrnament(48, 48); cornerOrnament(W - 48, 48);
  cornerOrnament(48, W - 48); cornerOrnament(W - 48, W - 48);

  // ── 3. Top register — logo · OFFICIAL CREDENTIAL · № ───────────
  ctx.textBaseline = "top";
  const topY = 78;

  // Logo chip (left)
  try { await cnvDrawSTSChip(ctx, M + 14, topY, 44); } catch {}

  // "OFFICIAL CREDENTIAL" caps — centred
  ctx.fillStyle = "rgba(232,222,200,0.85)";
  ctx.font = "700 13px Montserrat, Helvetica, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("OFFICIAL SPEAKER CREDENTIAL", W / 2, topY + 6);
  ctx.fillStyle = "rgba(232,222,200,0.45)";
  ctx.font = "500 10px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("ISSUED IN PRIVATE TO THE ADDRESSEE", W / 2, topY + 26);

  // Edition (right)
  ctx.fillStyle = "rgba(232,222,200,0.45)";
  ctx.font = "600 10px Montserrat, Helvetica, Arial, sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("EDITION", W - M - 14, topY + 6);
  ctx.fillStyle = "rgba(232,222,200,0.92)";
  ctx.font = "700 18px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText(cnvEditionFromRef((opts && opts.submissionId) || ""), W - M - 14, topY + 22);

  // Horizontal hairline under top register
  ctx.strokeStyle = "rgba(232,222,200,0.16)";
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(M + 14, topY + 56); ctx.lineTo(W - M - 14, topY + 56); ctx.stroke();

  // ── 4. Centre medallion — portrait inside a circular field ─────
  // Position: upper-centre, ~38% from top of canvas
  const cx = W / 2;
  const cy = 350;
  const MED = 260;

  // Field background — deep ink disc with a soft glow rim
  const halo = ctx.createRadialGradient(cx, cy, MED * 0.45, cx, cy, MED * 0.85);
  halo.addColorStop(0, sector.glow);
  halo.addColorStop(1, sector.glow.replace(/[\d.]+\)$/, "0)"));
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, MED * 0.85, 0, Math.PI * 2); ctx.fill();

  // Photo inside the disc — user photo if available, else a stylised
  // monogram inside a tone-on-tone field.
  if (form.photoDataUrl) {
    try {
      const portrait = await loadImg(form.photoDataUrl);
      cnvDrawCenteredCircleImage(ctx, portrait, cx, cy, MED);
    } catch {
      drawMonogramMedallion(ctx, cx, cy, MED, form, sector);
    }
  } else {
    drawMonogramMedallion(ctx, cx, cy, MED, form, sector);
  }

  // Bone-white inner ring
  ctx.strokeStyle = "rgba(232,222,200,0.92)";
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cx, cy, MED / 2, 0, Math.PI * 2); ctx.stroke();

  // Sector-accent outer ring
  ctx.strokeStyle = sector.accent;
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, MED / 2 + 10, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;

  // Decorative laurel branches on either side
  drawLaurel(ctx, cx - MED/2 - 36, cy, 64, -1, "rgba(232,222,200,0.70)");
  drawLaurel(ctx, cx + MED/2 + 36, cy, 64, +1, "rgba(232,222,200,0.70)");

  // ── 5. Sector kicker with ornamental stars ────────────────────
  const kickerY = cy + MED / 2 + 60;
  ctx.fillStyle = sector.accent;
  ctx.globalAlpha = 0.95;
  ctx.font = "600 12px Montserrat, Helvetica, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("\u2726  " + sector.kicker + "  \u2726", W / 2, kickerY);
  ctx.globalAlpha = 1;

  // ── 6. Speaker name — Playfair Display caps for credential feel ─
  const displayName = ([form.honorific, form.name].filter(Boolean).join(" ") || "Future Speaker").toUpperCase();
  // Adaptive size — try Playfair first; if it's not loaded canvas falls
  // back to Georgia, which still feels credential-ish.
  const nameFamily = "\"Playfair Display\", Georgia, serif";
  let nameSize = 48;
  for (let s = 60; s >= 30; s -= 2) {
    ctx.font = "700 " + s + "px " + nameFamily;
    const lines = wrapText(ctx, displayName, COL - 60);
    if (lines.length <= 2) { nameSize = s; break; }
  }
  ctx.font = "700 " + nameSize + "px " + nameFamily;
  const nameLines = wrapText(ctx, displayName, COL - 60);
  const nameY = kickerY + 32;
  ctx.fillStyle = "rgba(255,255,255,0.98)";
  ctx.letterSpacing = "1px"; // ignored by canvas in most browsers but doesn't hurt
  nameLines.slice(0, 2).forEach((line, i) => {
    cnvShadowedText(ctx, line, W / 2, nameY + i * (nameSize + 4), { shadowBlur: 8 });
  });

  // Hairline divider under the name
  const nameBlockH = Math.min(nameLines.length, 2) * (nameSize + 4);
  ctx.strokeStyle = sector.accent;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 80, nameY + nameBlockH + 8);
  ctx.lineTo(W / 2 + 80, nameY + nameBlockH + 8);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Role line — letter-spaced Montserrat caps
  ctx.fillStyle = "rgba(232,222,200,0.75)";
  ctx.font = "500 13px Montserrat, Helvetica, Arial, sans-serif";
  const role = ((form.role || "") + (form.org ? "  ·  " + form.org : "")).toUpperCase();
  // Letter-spacing emulation via word-by-word for caps
  drawLetterSpacedCaps(ctx, role.slice(0, 70), W / 2, nameY + nameBlockH + 30, 1.5);

  // ── 7. Bottom register — issued by / in attestation of ────────
  // Hairline separator above the bottom block
  ctx.strokeStyle = "rgba(232,222,200,0.14)";
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(M + 14, W - 156); ctx.lineTo(W - M - 14, W - 156); ctx.stroke();

  // Two-column attestation
  const blkY = W - 132;
  // LEFT — ISSUED BY
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(232,222,200,0.50)";
  ctx.font = "600 10px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("ISSUED BY", M + 14, blkY);
  ctx.fillStyle = "rgba(255,255,255,0.94)";
  ctx.font = "700 14px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("Street-To-Stardom", M + 14, blkY + 18);
  ctx.fillStyle = "rgba(232,222,200,0.55)";
  ctx.font = "500 11px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("2026 Series  ·  Empowered 360°", M + 14, blkY + 38);
  ctx.fillText("An Afrovanguard initiative", M + 14, blkY + 54);

  // RIGHT — IN ATTESTATION OF
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(232,222,200,0.50)";
  ctx.font = "600 10px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText("IN ATTESTATION OF", W - M - 14, blkY);
  ctx.fillStyle = "rgba(255,255,255,0.94)";
  ctx.font = "700 14px Montserrat, Helvetica, Arial, sans-serif";
  const venue = (computed.centre?.name || "—");
  ctx.fillText(venue, W - M - 14, blkY + 18);
  ctx.fillStyle = "rgba(232,222,200,0.55)";
  ctx.font = "500 11px Montserrat, Helvetica, Arial, sans-serif";
  ctx.fillText(cnvFormatDateLong(computed.day?.date || ""), W - M - 14, blkY + 38);
  const theme = computed.day?.theme || "—";
  ctx.fillText("Theme  ·  " + (theme.length > 22 ? theme.slice(0, 22) + "…" : theme), W - M - 14, blkY + 54);

  // ── Optional: Donation commitment ribbon ────────────────────────
  // When the speaker has also pledged to equip Lagos children, paint a
  // narrow gold ribbon above the bottom verification line so the badge
  // reads as both credential and patronage in one mark.
  if (donation && (donation.amount || donation.children)) {
    const ribbonY = W - 100;
    const ribbonH = 22;
    const ribGrad = ctx.createLinearGradient(M + 14, ribbonY, W - M - 14, ribbonY);
    ribGrad.addColorStop(0,   "rgba(196, 142, 18, 0.95)");
    ribGrad.addColorStop(0.5, "rgba(255, 200, 87, 0.96)");
    ribGrad.addColorStop(1,   "rgba(196, 142, 18, 0.95)");
    ctx.fillStyle = ribGrad;
    // soft rounded ribbon
    const rx = M + 14, rw = W - (M + 14) * 2, rr = 4;
    ctx.beginPath();
    ctx.moveTo(rx + rr, ribbonY);
    ctx.arcTo(rx + rw, ribbonY, rx + rw, ribbonY + ribbonH, rr);
    ctx.arcTo(rx + rw, ribbonY + ribbonH, rx, ribbonY + ribbonH, rr);
    ctx.arcTo(rx, ribbonY + ribbonH, rx, ribbonY, rr);
    ctx.arcTo(rx, ribbonY, rx + rw, ribbonY, rr);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(40, 22, 0, 0.96)";
    ctx.font = "700 11px Montserrat, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    const ribLabel = donation.children
      ? "★  COMMITTED SPONSOR  ·  " + donation.children + " " + (donation.children === 1 ? "LAGOS CHILD EQUIPPED" : "LAGOS CHILDREN EQUIPPED") + "  ★"
      : "★  COMMITTED SPONSOR  ·  STS 2026 PATRON  ★";
    ctx.fillText(ribLabel, W / 2, ribbonY + 15);
  }

  // ── 8. Tiny verification line at the bottom ────────────────────
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(232,222,200,0.35)";
  ctx.font = "500 9.5px Montserrat, Helvetica, Arial, sans-serif";
  const ref = (opts && opts.submissionId) ? String(opts.submissionId).slice(-12).toUpperCase() : "—";
  ctx.fillText("\u2756  AUTHENTICATED  ·  REF " + ref + "  ·  afrovanguard.org.ng  \u2756", W / 2, W - 64);

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  return new Promise((res) => c.toBlob(res, "image/png", 0.94));
}

// ── Helper: draw a stylised laurel branch (curved arc with leaflets) ──
// dir = -1 (curving left around medallion) or +1 (curving right)
function drawLaurel(ctx, x, y, height, dir, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 1.2;
  ctx.lineCap = "round";

  const leaves = 6;
  const spread = height / leaves;
  for (let i = 0; i < leaves; i++) {
    const t = i / (leaves - 1);
    const ly = y - height/2 + i * spread;
    const reach = (1 - Math.abs(t - 0.5) * 1.4) * 14 * dir;
    // Stem segment
    ctx.beginPath();
    ctx.moveTo(x, ly);
    ctx.lineTo(x + reach * 0.4, ly);
    ctx.stroke();
    // Leaf — small ellipse
    ctx.beginPath();
    ctx.ellipse(x + reach, ly, 6, 2.2, dir * Math.PI / 6, 0, Math.PI * 2);
    ctx.fill();
  }
  // Top tip
  ctx.beginPath();
  ctx.ellipse(x, y - height / 2 - 4, 4, 1.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ── Helper: monogram medallion (used when no photo) ──
function drawMonogramMedallion(ctx, cx, cy, MED, form, sector) {
  // Tone-on-tone field
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, MED / 2);
  const accentRGB = hexToRgb(sector.accent) || { r: 81, g: 114, b: 255 };
  g.addColorStop(0, `rgba(${accentRGB.r},${accentRGB.g},${accentRGB.b},0.22)`);
  g.addColorStop(0.7, "rgba(20,20,28,0.95)");
  g.addColorStop(1, "rgba(10,10,15,1)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, MED / 2, 0, Math.PI * 2); ctx.fill();

  // Monogram (initials)
  const name = (form.name || form.honorific || "").trim();
  const parts = name.split(/\s+/).filter(Boolean);
  const initials = parts.length >= 2
    ? (parts[0][0] + parts[parts.length - 1][0])
    : (parts[0] ? parts[0].slice(0, 2) : "FS");
  ctx.fillStyle = "rgba(255,255,255,0.88)";
  ctx.font = "700 96px \"Playfair Display\", Georgia, serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(initials.toUpperCase(), cx, cy);
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "left";
}

// ── Helper: hex to rgb {r,g,b} ──
function hexToRgb(hex) {
  if (!hex) return null;
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
  if (!m) return null;
  return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
}

// ── Helper: draw letter-spaced caps (canvas has no letter-spacing) ──
function drawLetterSpacedCaps(ctx, text, cx, cy, spacing) {
  const chars = text.split("");
  const widths = chars.map((c) => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let x = cx - total / 2;
  chars.forEach((ch, i) => {
    ctx.textAlign = "left";
    ctx.fillText(ch, x, cy);
    x += widths[i] + spacing;
  });
  ctx.textAlign = "center"; // restore
}

// ── Text wrap helper ────────────────────────────────────────────────
function wrapText(ctx, text, maxWidth) {
  const words = (text || "").split(/\s+/);
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line); line = w;
    } else { line = test; }
  }
  if (line) lines.push(line);
  return lines.length ? lines : [""];
}

// ── ICS calendar file ───────────────────────────────────────────────
function generateICS(form, computed) {
  if (!computed.day) return null;

  // Lagos / West Africa Time = UTC+1 year-round (no DST).
  // We emit local times with TZID so all calendar clients show 9:00–10:30 local.
  const isoDate = computed.day.iso; // "2026-08-15"
  const yyyymmdd = isoDate.replace(/-/g, "");
  const dtStart  = yyyymmdd + "T090000";
  const dtEnd    = yyyymmdd + "T103000";
  const dtStamp  = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const refSuffix = (form.email || "speaker").toLowerCase().replace(/[^a-z0-9]+/g, "");
  const uid = "sts-2026-" + isoDate + "-" + refSuffix + "@afrovanguard.org.ng";

  const centre = computed.centre || {};
  const day = computed.day || {};
  const fullName = [form.honorific, form.name].filter(Boolean).join(" ") || "Speaker";
  const summary = "STS 2026 (Provisional) · " + (day.theme || "Speaker session") + " · " + (centre.name || "");
  const location = [centre.name, centre.address, "Lagos, Nigeria"].filter(Boolean).join(", ");

  // RFC 5545 description — escape commas, semicolons, newlines.
  const descRaw = [
    "Street-To-Stardom 2026 Leadership Series · Empowered 360°",
    "",
    "PROVISIONAL — this date is held pending the team's review of centre",
    "capacity and the wider 2026 schedule. You'll receive a confirmation",
    "email within 48 hours; this invite updates automatically if anything",
    "shifts.",
    "",
    "Speaker (pending confirmation): " + fullName,
    "Role: " + (form.role || "—") + (form.org ? "  ·  " + form.org : ""),
    "",
    "Centre: " + (centre.name || "—"),
    "Focus: " + (centre.focus || "—"),
    "Theme: " + (day.theme || "—"),
    "Cohort: " + (centre.children || "—") + " Lagos children",
    "",
    "Run of show:",
    "  08:30 — Arrival, team reception at gate",
    "  09:00 — Address to the cohort (45–60 min)",
    "  10:00 — Mentorship circle, small-group Q&A (30 min)",
    "  10:30 — Group photograph, close",
    "",
    "Team contact: cacentre@afrovanguard.org.ng",
    "",
    "An Afrovanguard initiative · afrovanguard.org.ng",
  ].join("\n");
  const esc = (s) => String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const desc = esc(descRaw);

  // 75-column line folding (RFC 5545 §3.1)
  const fold = (line) => {
    const out = [];
    let s = line;
    while (s.length > 73) {
      out.push(s.slice(0, 73));
      s = " " + s.slice(73);
    }
    out.push(s);
    return out.join("\r\n");
  };

  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Street-To-Stardom//STS 2026 Empowered 360//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    // VTIMEZONE for Africa/Lagos (no DST → single STANDARD block)
    "BEGIN:VTIMEZONE",
    "TZID:Africa/Lagos",
    "BEGIN:STANDARD",
    "DTSTART:19700101T000000",
    "TZOFFSETFROM:+0100",
    "TZOFFSETTO:+0100",
    "TZNAME:WAT",
    "END:STANDARD",
    "END:VTIMEZONE",
    "BEGIN:VEVENT",
    "UID:" + uid,
    "DTSTAMP:" + dtStamp,
    "DTSTART;TZID=Africa/Lagos:" + dtStart,
    "DTEND;TZID=Africa/Lagos:" + dtEnd,
    fold("SUMMARY:" + esc(summary)),
    fold("LOCATION:" + esc(location)),
    fold("DESCRIPTION:" + desc),
    "STATUS:TENTATIVE",
    "TRANSP:OPAQUE",
    "SEQUENCE:0",
    "CATEGORIES:Speaking,Education,Nonprofit",
    "PRIORITY:1",
    "CLASS:PRIVATE",
    fold("ORGANIZER;CN=Street-To-Stardom Team:mailto:cacentre@afrovanguard.org.ng"),
    fold("ATTENDEE;CN=" + esc(fullName) + ";ROLE=REQ-PARTICIPANT;PARTSTAT=ACCEPTED;RSVP=FALSE:mailto:" + (form.email || "speaker@unknown")),
    // 24h email reminder
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    "DESCRIPTION:Tomorrow: your STS 2026 session at " + esc(centre.name || ""),
    "TRIGGER:-PT24H",
    "END:VALARM",
    // 1h pop-up reminder
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    "DESCRIPTION:Leaving now? STS 2026 session in 1 hour.",
    "TRIGGER:-PT1H",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR",
  ];

  return new Blob([lines.join("\r\n") + "\r\n"], { type: "text/calendar;charset=utf-8" });
}

// ── Signature renderer ──────────────────────────────────────────────
// Rasterises a short string in a cursive font ("Great Vibes" if it
// loaded from Google Fonts, otherwise a system cursive fallback) onto
// a transparent canvas at high resolution, returning a PNG data URL
// suitable for jsPDF.addImage. Used so the partnership letter signs off
// with a hand-feeling "LCASP" mark above the typed team line, instead
// of just a sans-serif name on its own.
async function renderSignaturePNG(text, opts) {
  opts = opts || {};
  const color = opts.color || "#0A0A0F";
  const fontSize = opts.fontSize || 96;
  const family = "\"Great Vibes\", \"Brush Script MT\", \"Lucida Handwriting\", cursive";

  // Best-effort font load — Great Vibes ships from the existing
  // Google Fonts link tag; document.fonts.load forces it to be ready
  // before we measure or paint.
  try {
    if (document && document.fonts && document.fonts.load) {
      await document.fonts.load(fontSize + "px \"Great Vibes\"");
    }
  } catch (e) { /* fall back to system cursive */ }

  // Measure first on a throwaway context to size the canvas tightly
  const m = document.createElement("canvas").getContext("2d");
  m.font = fontSize + "px " + family;
  const tm = m.measureText(text);
  const ascent  = (tm.actualBoundingBoxAscent  || fontSize * 0.85);
  const descent = (tm.actualBoundingBoxDescent || fontSize * 0.35);
  const w = Math.ceil(tm.width) + 32;
  const h = Math.ceil(ascent + descent) + 24;

  // Render at 2× for crisp embedding into the PDF.
  const scale = 2;
  const c = document.createElement("canvas");
  c.width = w * scale; c.height = h * scale;
  const ctx = c.getContext("2d");
  ctx.scale(scale, scale);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = color;
  ctx.font = fontSize + "px " + family;
  ctx.textBaseline = "alphabetic";
  ctx.fillText(text, 16, ascent + 8);

  return { dataUrl: c.toDataURL("image/png"), width: w, height: h };
}

// ── PDF (lazy-loads jsPDF on first use) ─────────────────────────────
let _jspdfPromise = null;
function loadJsPDF() {
  if (_jspdfPromise) return _jspdfPromise;
  _jspdfPromise = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js";
    s.onload = () => res(window.jspdf.jsPDF);
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return _jspdfPromise;
}

async function generatePartnershipPDF(form, computed, submissionId, opts = {}) {
  const donation = opts && opts.donation ? opts.donation : null;
  const jsPDF = await loadJsPDF();
  const pdf = new jsPDF({ unit: "pt", format: "a4", compress: true });
  const W = pdf.internal.pageSize.getWidth();
  const H = pdf.internal.pageSize.getHeight();

  // Pre-render the STS logo as a base64 PNG so jsPDF can embed it.
  // jsPDF doesn't accept SVG; we rasterize once at 256px (sharp at all
  // chip sizes used below) and reuse the same data URL three times.
  let logoPng = null;
  try { logoPng = await ensureSTSLogoPng(256); } catch (e) { console.warn("[STS PDF] logo rasterize failed", e); }

  // jsPDF built-in fonts only — helvetica for sans, times for serif.
  // We use them as a "Newsweek style" pairing: helvetica for chrome
  // (labels, header, footer) and times for the letter body, which is
  // appropriate for a formal partnership document.

  const C = {
    ink:    [10, 10, 15],
    soft:   [60, 60, 70],
    muted:  [107, 107, 112],
    rule:   [220, 220, 224],
    blue:   [7, 50, 247],
    deep:   [4, 32, 181],
    tint:   [238, 241, 255],
    crimson:[200, 16, 46],
    chip:   [23, 145, 200],
  };
  const setC = (rgb) => pdf.setTextColor(rgb[0], rgb[1], rgb[2]);
  const setF = (rgb) => pdf.setFillColor(rgb[0], rgb[1], rgb[2]);
  const setD = (rgb) => pdf.setDrawColor(rgb[0], rgb[1], rgb[2]);

  const M = 56;           // page margin
  const COL = W - M * 2;
  const fullName = [form.honorific, form.name].filter(Boolean).join(" ");
  const refShort = submissionId ? String(submissionId).slice(-10).toUpperCase() : "—";
  const issued = new Date();
  const dateLong = issued.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

  // ═════════════════════════════════════════════════════════════════
  // PAGE 1 — Letterhead + body + session block + signature
  // ═════════════════════════════════════════════════════════════════

  // Top deep-blue band (1px) + crimson tick (right)
  setF(C.deep); pdf.rect(0, 0, W, 6, "F");
  setF(C.crimson); pdf.rect(W - 64, 0, 64, 6, "F");

  // Letterhead grid (3 columns)
  const headY = 56;
  // STS chip — embedded base64 PNG (with geometric fallback)
  const chipX = M, chipY = headY, chipS = 44;
  if (logoPng) {
    try { pdf.addImage(logoPng, "PNG", chipX, chipY, chipS, chipS); }
    catch (e) { logoPng = null; }
  }
  if (!logoPng) {
    setF(C.chip); pdf.roundedRect(chipX, chipY, chipS, chipS, 6, 6, "F");
    setF(C.crimson); pdf.rect(chipX + chipS/2 - 4, chipY + 6, 8, chipS - 12, "F");
    pdf.setTextColor(255,255,255);
    pdf.setFont("helvetica", "bold"); pdf.setFontSize(15);
    pdf.text("S", chipX + 11, chipY + 30);
    pdf.text("T", chipX + chipS/2 - 4, chipY + 30);
    pdf.text("S", chipX + chipS - 18, chipY + 30);
  }

  // Centre column — masthead
  setC(C.ink);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(13);
  pdf.text("STREET-TO-STARDOM", chipX + chipS + 16, chipY + 18);
  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8);
  pdf.text("AN AFROVANGUARD INITIATIVE  ·  ALIMOSHO, LAGOS", chipX + chipS + 16, chipY + 30);
  setC(C.crimson);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(8);
  pdf.text("2026 SERIES  ·  EMPOWERED 360°", chipX + chipS + 16, chipY + 42);

  // Right column — reference block
  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8);
  const refLine = "REF · " + refShort;
  pdf.text(refLine, W - M - pdf.getTextWidth(refLine), headY + 18);
  const issLine = "ISSUED · " + dateLong.toUpperCase();
  pdf.text(issLine, W - M - pdf.getTextWidth(issLine), headY + 30);
  const pgLine = "PAGE 1 OF 3";
  pdf.text(pgLine, W - M - pdf.getTextWidth(pgLine), headY + 42);

  // Letterhead bottom rule with crimson tick
  setF(C.crimson); pdf.rect(M, headY + chipS + 16, 14, 1.5, "F");
  setD(C.rule); pdf.setLineWidth(0.5);
  pdf.line(M + 18, headY + chipS + 16.5, W - M, headY + chipS + 16.5);

  // Document type label
  let y = headY + chipS + 36;
  setC(C.blue);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(9);
  pdf.text("PROVISIONAL PARTNERSHIP LETTER  ·  PENDING TEAM CONFIRMATION", M, y);

  // Big title
  y += 26;
  setC(C.ink);
  pdf.setFont("times", "normal"); pdf.setFontSize(28);
  pdf.text("A reserved seat in the", M, y);
  y += 32;
  pdf.text("2026 Future Leaders Archive.", M, y);

  // Subtitle — make provisional status explicit (compact)
  y += 22;
  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9.5);
  pdf.text("Issued in private to the addressee. A record of your reserved participation in the 2026", M, y);
  y += 12;
  pdf.text("Street-To-Stardom Leadership Series — Empowered 360°. Not the final confirmation.", M, y);

  // Provisional notice band — small, calm, explicit
  y += 16;
  setF([255, 247, 232]);
  pdf.rect(M, y, COL, 28, "F");
  setF([218, 142, 32]);
  pdf.rect(M, y, 3, 28, "F");
  setC([130, 80, 0]);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(8.5);
  pdf.text("PROVISIONAL  ·  AWAITING TEAM CONFIRMATION", M + 14, y + 12);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8);
  pdf.text("This is a record of intent. The binding partnership letter is issued by the 2026 Series Team after we speak.", M + 14, y + 22);
  y += 28;

  // Salutation
  y += 22;
  setC(C.ink);
  pdf.setFont("times", "normal"); pdf.setFontSize(13);
  pdf.text("Dear " + fullName + ",", M, y);

  // Body
  y += 22;
  pdf.setFontSize(11.5);
  const body = [
    "Thank you for accepting our private invitation to address the 2026 Street-To-Stardom Leadership Series. Your willingness to share one hour of your voice with the next generation of Alimosho is a gift we treat with great care.",
    "This letter records your reserved seat in the 2026 Future Leaders Archive — a permanent record of the leaders who chose, in a single decision, to stand alongside 900 Lagos children across six community centres. The session details below are held in your name pending a brief call from our team to finalise logistics. Treat this document as a provisional partnership memorandum, not the final confirmation.",
  ];
  body.forEach((p) => {
    const lines = pdf.splitTextToSize(p, COL);
    pdf.text(lines, M, y);
    y += lines.length * 16 + 10;
  });

  // ── Session details box ─────────────────────────────────────────
  y += 8;
  const boxH = 152;
  setF(C.tint); pdf.rect(M, y, COL, boxH, "F");
  setF(C.blue); pdf.rect(M, y, 3, boxH, "F");
  setF(C.crimson); pdf.rect(M, y, 3, 24, "F");

  setC(C.blue);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(8.5);
  pdf.text("YOUR SESSION", M + 16, y + 18);
  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8);
  pdf.text("RESERVED  ·  NOT TRANSFERABLE", M + 16, y + 30);

  // Two-column data grid
  setC(C.ink);
  const halfX = M + COL / 2;
  const rows = [
    ["CENTRE",   computed.centre?.name || "—",                     "DATE",     (computed.day?.dow ? computed.day.dow + ", " : "") + (computed.day?.date || "—")],
    ["FOCUS",    computed.centre?.focus || "—",                    "THEME",    computed.day?.theme || "—"],
    ["COHORT",   String(computed.centre?.children || "—") + " children", "FORMAT", "9:00–10:00 AM  ·  + 30 min circle"],
  ];
  rows.forEach((r, i) => {
    const ry = y + 50 + i * 30;
    setC(C.muted);
    pdf.setFont("helvetica", "bold"); pdf.setFontSize(7.5);
    pdf.text(r[0], M + 16, ry);
    pdf.text(r[2], halfX + 16, ry);
    setC(C.ink);
    pdf.setFont("times", "normal"); pdf.setFontSize(11);
    const c1 = pdf.splitTextToSize(r[1], COL / 2 - 32);
    const c2 = pdf.splitTextToSize(r[3], COL / 2 - 32);
    pdf.text(c1[0] || "—", M + 16, ry + 13);
    pdf.text(c2[0] || "—", halfX + 16, ry + 13);
  });

  y += boxH + 18;

  // ── Optional: Donation commitment one-liner ──

  if (donation && (donation.amount || donation.children)) {
    setF([13, 106, 60]); pdf.rect(M, y, 3, 14, "F");
    setC([13, 106, 60]);
    pdf.setFont("helvetica", "bold"); pdf.setFontSize(8);
    pdf.text("DONATION COMMITMENT", M + 10, y + 10);
    setC(C.ink);
    pdf.setFont("times", "normal"); pdf.setFontSize(10.5);
    const tierLabel = donation.tier || donation.name || "Committed sponsor";
    const amountStr = donation.amount ? "₦" + Number(donation.amount).toLocaleString() : "—";
    const childStr = donation.children ? "  ·  " + donation.children + (donation.children === 1 ? " Lagos child" : " Lagos children") : "";
    pdf.text(tierLabel + "  ·  " + amountStr + childStr + "  (pending team confirmation)", M + 138, y + 10);
    y += 22;

  // Closing paragraph

  const closing = pdf.splitTextToSize(closingText, COL);

    if (sig && sig.dataUrl) {

  pdf.text("afrovanguard.org.ng", W - M - pdf.getTextWidth("afrovanguard.org.ng"), H - 32);

  // ═════════════════════════════════════════════════════════════════
  // PAGE 2 — Speaker Credential Card (tear-off feel) + briefing
  // ═════════════════════════════════════════════════════════════════
  pdf.addPage();

  // ── Credential Card (top half) — perforated feel ───────────────

  const ccX = cardX + 24, ccY = cardY + 24, ccS = 44;

  pdf.setFont("helvetica", "normal"); pdf.setFontSize(7.5);

  pdf.text("afrovanguard.org.ng", W - M - pdf.getTextWidth("afrovanguard.org.ng"), H - 24);

  // ═════════════════════════════════════════════════════════════════
  // PAGE 3 — Letter of Confirmation (follow-up, dated, signature line)

    pdf.text("S", p3ChipX + 9, p3ChipY + 24);
    pdf.text("T", p3ChipX + p3ChipS/2 - 3, p3ChipY + 24);
    pdf.text("S", p3ChipX + p3ChipS - 14, p3ChipY + 24);

  setC(C.ink);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(11);

  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8);
  pdf.text("Empowered 360°  ·  An Afrovanguard initiative", p3ChipX + p3ChipS + 14, p3HeadY + 26);

  // Right column — reference + date issued
  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8);
  const p3refLine = "REF · " + refShort;
  pdf.text(p3refLine, W - M - pdf.getTextWidth(p3refLine), p3HeadY + 14);
  const p3issLine = "ISSUED · " + dateLong.toUpperCase();
  pdf.text(p3issLine, W - M - pdf.getTextWidth(p3issLine), p3HeadY + 26);

  // Crimson tick + hairline divider
  let p3y = p3HeadY + p3ChipS + 14;
  setF(C.crimson); pdf.rect(M, p3y, 14, 1.5, "F");
  setD(C.rule); pdf.setLineWidth(0.5);
  pdf.line(M + 18, p3y + 0.5, W - M, p3y + 0.5);

  // Document type
  p3y += 24;
  setC(C.blue);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(9);
  pdf.text("LETTER OF CONFIRMATION", M, p3y);

  // Big title
  p3y += 22;
  setC(C.ink);
  pdf.setFont("times", "normal"); pdf.setFontSize(24);
  pdf.text("Confirming the booking.", M, p3y);

  // Subtitle / dateline
  p3y += 24;
  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9.5);
  pdf.text("Dated " + dateLong + " · For the record of " + fullName, M, p3y);

  // Body
  p3y += 30;
  setC(C.ink);
  pdf.setFont("times", "normal"); pdf.setFontSize(11.5);
  pdf.text("To whom it may concern,", M, p3y);
  p3y += 20;
  const confBody = [
    "This document confirms that " + fullName + " of " + (form.org || "—") + " has accepted our private invitation to address the 2026 Street-To-Stardom Leadership Series — Empowered 360°.",
    "Their session is reserved on " + (computed.day?.dow ? computed.day.dow + ", " : "") + (computed.day?.date || "—") + " at " + (computed.centre?.name || "—") + ", Alimosho, Lagos. The session runs from 9:00 to 10:00 AM with an additional 30-minute mentorship circle. The cohort theme is \"" + (computed.day?.theme || "—") + "\".",
    "This commitment is not transferable. We are grateful. This letter may be forwarded to an executive assistant, communications office, or sponsoring institution as the speaker sees fit.",
  ];
  confBody.forEach((p) => {
    const lines = pdf.splitTextToSize(p, COL);
    pdf.text(lines, M, p3y);
    p3y += lines.length * 16 + 12;
  });

  // Confirmation grid (compact one-line per row)
  p3y += 6;
  const cgRows = [
    ["SPEAKER",  fullName],
    ["ROLE",     (form.role || "—") + (form.org ? "  ·  " + form.org : "")],
    ["CENTRE",   computed.centre?.name || "—"],
    ["DATE",     (computed.day?.dow ? computed.day.dow + ", " : "") + (computed.day?.date || "—")],
    ["THEME",    computed.day?.theme || "—"],
    ["REFERENCE", refShort],
  ];
  setD(C.rule); pdf.setLineWidth(0.4);
  pdf.line(M, p3y, W - M, p3y);
  cgRows.forEach((r, i) => {
    const ry = p3y + 16 + i * 22;
    setC(C.muted);
    pdf.setFont("helvetica", "bold"); pdf.setFontSize(8);
    pdf.text(r[0], M, ry);
    setC(C.ink);
    pdf.setFont("times", "normal"); pdf.setFontSize(11);
    const val = pdf.splitTextToSize(String(r[1]), COL - 130);
    pdf.text(val[0] || "—", M + 110, ry);
    setD(C.rule); pdf.setLineWidth(0.3);
    pdf.line(M, ry + 6, W - M, ry + 6);
  });
  p3y += 16 + cgRows.length * 22 + 18;

  // Signature blocks — two side-by-side: speaker + team
  setD([180, 180, 184]); pdf.setLineWidth(0.6);
  const sigW = (COL - 32) / 2;

  // Pre-render the team's hand-feeling signature once for both pages.
  let p3Sig = null;
  try { p3Sig = await renderSignaturePNG("LCASP", { fontSize: 84, color: "#0A0A0F" }); } catch (e) { /* fallback below */ }

  // Speaker block
  pdf.line(M, p3y, M + sigW, p3y);
  setC(C.ink);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(10);
  pdf.text(fullName, M, p3y + 14);
  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5);
  pdf.text(form.role || "—", M, p3y + 26);
  pdf.setFontSize(8);
  pdf.text("Speaker · Date: ___________", M, p3y + 40);

  // Team block — signed with the LCASP mark above the line.
  const tx = M + sigW + 32;
  if (p3Sig && p3Sig.dataUrl) {
    const sigH = 36;
    const sigW2 = sigH * (p3Sig.width / p3Sig.height);
    try { pdf.addImage(p3Sig.dataUrl, "PNG", tx, p3y - 30, sigW2, sigH); }
    catch (e) {
      pdf.setFont("times", "italic"); pdf.setFontSize(18);
      setC(C.ink); pdf.text("LCASP", tx, p3y - 6);
    }
  } else {
    pdf.setFont("times", "italic"); pdf.setFontSize(18);
    setC(C.ink); pdf.text("LCASP", tx, p3y - 6);
  }
  pdf.line(tx, p3y, tx + sigW, p3y);
  setC(C.ink);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(10);
  pdf.text("The 2026 Series Team", tx, p3y + 14);
  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5);
  pdf.text("Street-To-Stardom · Alimosho, Lagos", tx, p3y + 26);
  pdf.setFontSize(8);
  pdf.text("Issued: " + dateLong, tx, p3y + 40);

  // Bottom footer + page number
  setD(C.rule); pdf.setLineWidth(0.5);
  pdf.line(M, H - 48, W - M, H - 48);
  setC(C.muted);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(7.5);
  pdf.text("CONFIDENTIAL TO THE ADDRESSEE  ·  © " + issued.getFullYear() + " AFROVANGUARD  ·  PAGE 3 OF 3", M, H - 32);
  pdf.text("afrovanguard.org.ng", W - M - pdf.getTextWidth("afrovanguard.org.ng"), H - 32);
  setC(C.blue);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(7.5);
  pdf.text("PROVISIONAL CONFIRMATION  ·  REF " + refShort, M, H - 20);

  return pdf.output("blob");
}

// ─── Deliverables panel ───────────────────────────────────────────────
function DeliverablesGrid({ form, computed, submissionId, donated, donation, onLockedClick }) {
  const [busy, setBusy] = useState(null);

  const safeName = (form.name || "speaker").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

  const handle = async (key, locked) => {
    if (busy) return;
    if (locked) {
      onLockedClick && onLockedClick(key);
      return;
    }
    setBusy(key);
    try {
      if (key === "card") {
        const blob = await generateIWillBeThereCard(form, computed, { submissionId });
        if (blob) downloadBlob(blob, `sts-i-will-be-there-${safeName}.png`);
      } else if (key === "badge") {
        const blob = await generateImpactBadge(form, computed, { submissionId, donation });
        if (blob) downloadBlob(blob, `sts-impact-badge-${safeName}.png`);
      } else if (key === "ics") {
        const blob = generateICS(form, computed);
        if (blob) downloadBlob(blob, `sts-2026-${safeName}.ics`);
      } else if (key === "pdf") {
        const blob = await generatePartnershipPDF(form, computed, submissionId, { donation });
        if (blob) downloadBlob(blob, `sts-2026-partnership-${safeName}.pdf`);
      }
      showToast(({ card: "Card downloaded.", badge: "Badge downloaded.", ics: "Calendar added.", pdf: "Letter downloaded." })[key], "success", 2400);
    } catch (err) {
      console.error(err);
      showToast("Couldn't generate that file. Please try again.", "error");
    } finally {
      setBusy(null);
    }
  };

  // card + ics are always unlocked.
  // badge + pdf are the institutional / polished assets — they unlock once
  // the speaker has chosen a commitment tier and clicked through.
  const items = [
    { key: "card",  ix: "01 · Card",     title: '"I Will Be There" Card',  desc: "Professional graphic — name, centre, date, theme. Social-ready PNG.", lockable: false },
    { key: "ics",   ix: "02 · Calendar", title: "Add to Calendar",        desc: "Marked provisional until the team confirms — Apple, Google, Outlook.", lockable: false },
    { key: "badge", ix: "03 · Badge",    title: "Digital Impact Badge",    desc: "Square shareable for LinkedIn, WhatsApp, Instagram.", lockable: true },
    { key: "pdf",   ix: "04 · Letter",   title: "Partnership Letter",     desc: "Provisional letterheaded PDF — letter, credential card & confirmation, three pages.", lockable: true },
  ];

  return (
    <div className="deliverables">
      {items.map((it) => {
        const locked = it.lockable && !donated;
        return (
          <button
            type="button" key={it.key}
            className={cn("deliverable", locked && "locked")}
            disabled={busy === it.key}
            onClick={() => handle(it.key, locked)}
            aria-label={locked ? `${it.title} — released when you commit` : `${it.title} — download`}
          >
            {locked && (
              <span className="deliverable-lock" aria-hidden="true" title="Released to speakers who also equip a few children — see the support section">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                  <rect x="2.5" y="6" width="9" height="6.5" rx="1.2" stroke="currentColor" strokeWidth="1.3"/>
                  <path d="M4.5 6V4.4a2.5 2.5 0 0 1 5 0V6" stroke="currentColor" strokeWidth="1.3" fill="none"/>
                </svg>
              </span>
            )}
            <div className="deliverable-ix">{it.ix}</div>
            <div className="deliverable-t">{it.title}</div>
            <div className="deliverable-d">{it.desc}</div>
            <div className="deliverable-cta">
              {locked
                ? <>See the options <span className="btn-arrow" aria-hidden="true">↓</span></>
                : (busy === it.key ? "Generating…" : "Download ↓")}
            </div>
          </button>
        );
      })}
    </div>
  );
}

  );

const DONATION_TIERS = [
  { id: "seed",     amount: 150000,  children: 5,  name: "Seed Sponsor" },
  { id: "impact",   amount: 300000,  children: 10, name: "Impact Sponsor", featured: true },
  { id: "legacy",   amount: 600000,  children: 20, name: "Legacy Sponsor" },
