  0%   { box-shadow: 0 0 0 0 rgba(200,16,46,0.0); }
  20%  { box-shadow: 0 0 0 8px rgba(200,16,46,0.35); }
  100% { box-shadow: 0 0 0 0 rgba(200,16,46,0); }
}
.support--donated {
  padding: 32px 28px;
  border-left: 4px solid var(--success);
}
.support--donated .support-h em {
  color: var(--success);
  background-image: linear-gradient(var(--success), var(--success));
  background-size: 100% 5%;
  background-repeat: no-repeat;
  background-position: 0 92%;
}
/* Commitment summary — surfaces tier / amount / children inside the
   donated-state Support section so the speaker sees their pledge stated
   back to them clearly. Calm green ledger feel; reuses success tone. */
.support-commitment-summary {
  margin: 18px 0 22px;
  padding: 16px 18px;
  border: 1px solid rgba(13,106,60,0.22);
  background: rgba(13,106,60,0.06);
  border-left: 3px solid var(--success);
  border-radius: var(--r-md);
  display: flex; flex-direction: column; gap: 8px;
}
.support-commitment-summary__row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 14px; font-size: 14px;
}
.support-commitment-summary__row span {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.support-commitment-summary__row strong {
  font-family: var(--font-display); font-weight: 500;
  font-size: 17px; letter-spacing: -0.01em; color: var(--ink);
}
@media (max-width: 480px) {
  .support-commitment-summary { padding: 14px; }
  .support-commitment-summary__row { flex-direction: column; align-items: flex-start; gap: 2px; }
  .support-commitment-summary__row strong { font-size: 15px; }
}

.confirm-actions {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 48px; padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.10);
  gap: 16px; flex-wrap: wrap;
}

/* Mobile tuning for the donation banner */
@media (max-width: 720px) {
  .donation-banner { flex-direction: column; align-items: flex-start; padding: 18px 18px 20px; }
  .donation-banner__cta { width: 100%; justify-content: center; }
  .donation-banner__pulse { display: none; }
}

/* ── How It Works modal ──────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(10,10,15,0.7);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  /* Respect iOS safe-area when modal sits over notch / home-bar */
  padding-top: max(24px, env(safe-area-inset-top));
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-med) ease;
}
.modal-backdrop.open { opacity: 1; pointer-events: auto; }
.modal-panel {
  background: var(--surface); color: var(--ink);
  border-radius: var(--r-xl);
  max-width: 660px; width: 100%;
  /* Use dvh on browsers that support it so the panel resizes when the
     mobile URL bar collapses — fixes the "modal taller than viewport"
     bug on iOS Safari and Chrome Android. */
  max-height: calc(100vh - 48px);
  max-height: calc(100dvh - 48px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 36px 40px;
  box-shadow: var(--shadow-deep);
  transform: scale(0.96) translateY(10px);
  transition: transform 320ms var(--ease-out);
}
.modal-backdrop.open .modal-panel { transform: scale(1) translateY(0); }
.modal-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  margin-bottom: 24px;
}
.modal-eyebrow {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);
}
.modal-title {
  font-family: var(--font-display); font-weight: 600;
  font-size: 28px; letter-spacing: -0.02em; line-height: 1.15;
  margin: 8px 0 0;
}
.modal-title em {
  font-style: normal; font-weight: 600;
  color: var(--ink);
  background-image: linear-gradient(var(--blue), var(--blue));
  background-repeat: no-repeat;
  background-position: 0 92%;
  background-size: 100% 5px;
  padding-bottom: 2px;
}
.modal-close {
  background: var(--bg-sunken);
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 14px;
  flex-shrink: 0;
  transition: background var(--t-fast) ease;
}
.modal-close:hover { background: var(--hairline-strong); }
.modal-steps { display: flex; flex-direction: column; gap: 18px; }
.modal-step {
  display: flex; gap: 18px; align-items: flex-start;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--hairline);
}
.modal-step:last-child { border-bottom: 0; padding-bottom: 0; }
.modal-step-num {
  flex-shrink: 0;
  width: 36px; height: 36px;
  background: var(--accent-tint); color: var(--accent-deep);
  border-radius: 10px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 500; font-size: 16px;
}
.modal-step-title {
  font-family: var(--font-display); font-weight: 500;
  font-size: 17px; letter-spacing: -0.01em; margin: 0 0 6px;
}
.modal-step-desc { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0; }
.modal-foot {
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px; flex-wrap: wrap;
  margin-top: 28px; padding-top: 22px;
  border-top: 1px solid var(--hairline);
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase;
}
.modal-foot-cta {
  background: var(--ink); color: var(--bg);
  padding: 12px 20px;
  border-radius: var(--r-pill);
  font-family: var(--font-body); font-weight: 500; font-size: 14px;
  text-transform: none; letter-spacing: -0.005em;
  display: inline-flex; align-items: center; gap: 8px;
  transition: background var(--t-fast) ease, transform 100ms ease;
}
.modal-foot-cta:hover { background: var(--accent); }
.modal-foot-cta:active { transform: scale(0.98); }

/* ── Support / Donation Prompt ───────────────────────────── */
.support {
  margin-top: 64px;
  padding: 48px;
  background: var(--surface);
  border-radius: var(--r-xl);
  color: var(--ink);
}
.support-eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 12px;
}
.support-h {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(28px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -0.02em;
  margin: 0 0 16px; text-wrap: balance;
}
.support-h em {
  font-style: normal; font-weight: 600;
  color: var(--ink);
  background-image: linear-gradient(var(--blue), var(--blue));
  background-repeat: no-repeat;
  background-position: 0 92%;
  background-size: 100% 6px;
  padding-bottom: 3px;
}
.support-sub {
  font-size: 15px; line-height: 1.6; color: var(--muted);
  max-width: 640px; margin: 0 0 32px;
}
.support-sub strong { color: var(--ink); font-weight: 600; }
.support-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin-bottom: 32px;
}
.support-stat {
  background: var(--bg-sunken);
  border-radius: var(--r-md);
  padding: 16px 18px;
  text-align: center;
}
.support-stat .n {
  display: block;
  font-family: var(--font-display); font-weight: 500;
  font-size: 26px; letter-spacing: -0.015em; color: var(--ink);
  line-height: 1; margin-bottom: 4px;
}
.support-stat .l {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.support-section-label {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  margin: 0 0 14px;
}
.support-tiers {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
  margin-bottom: 24px;
}
.support-tier-badge--top { background: var(--ink); }
:root[data-theme="dark"] .support-tier-badge--top { background: var(--accent); }
.support-tier {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-md);
  padding: 22px 16px 18px;
  text-align: center;
  cursor: pointer;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease, transform var(--t-fast) ease;
}
.support-tier:hover { border-color: var(--ink); transform: translateY(-1px); }
.support-tier.on { border-color: var(--accent); background: var(--accent-tint); }
.support-tier.featured { border-color: var(--accent); border-width: 2px; padding-top: 28px; }
.support-tier-badge {
  position: absolute; top: -1px; right: 14px;
  background: var(--accent); color: #fff;
  padding: 3px 10px;
  border-radius: 0 0 6px 6px;
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.06em; font-weight: 500;
}
.support-tier-n {
  font-family: var(--font-display); font-weight: 500;
  font-size: 32px; letter-spacing: -0.018em;
  line-height: 1; margin-bottom: 4px; color: var(--ink);
}
.support-tier-l {
  font-size: 11px; color: var(--muted);
  margin-bottom: 14px;
}
.support-tier-amount {
  font-family: var(--font-display); font-weight: 500;
  font-size: 16px; color: var(--ink); margin-bottom: 4px;
}
.support-tier-name {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
.support-custom {
  background: var(--bg-sunken);
  border-radius: var(--r-md);
  padding: 20px 22px;
  margin-bottom: 24px;
}
.support-custom-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px;
  font-size: 14px; font-weight: 500;
}
.support-custom-hint {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.06em; color: var(--muted); font-weight: 400;
}
.support-custom-row {
  display: flex; align-items: center; gap: 10px;
}
.support-custom-prefix {
  font-family: var(--font-display); font-size: 22px; font-weight: 500;
  color: var(--muted);
}
.support-custom-row input {
  flex: 1;
  font-family: var(--font-display); font-weight: 500;
  font-size: 22px; letter-spacing: -0.012em;
  height: 48px; padding: 0 14px;
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-md);
  color: var(--ink);
  outline: none;
  transition: border-color var(--t-fast) ease;
}
.support-custom-row input:focus { border-color: var(--accent); }
.support-custom-warn { margin-top: 8px; font-size: 12px; color: var(--error); }
.support-custom-calc {
  margin-top: 10px; font-size: 13px; color: var(--muted);
}
.support-custom-calc strong { color: var(--ink); }
.support-preview {
  background: var(--bg-sunken);
  border-radius: var(--r-md);
  padding: 20px 22px;
  margin-bottom: 24px;
}
.support-preview-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 14px;
}
.support-preview-row:last-child { border-bottom: 0; padding-bottom: 0; }
.support-preview-row:first-child { padding-top: 0; }
.support-preview-row span { color: var(--muted); font-size: 13px; }
.support-preview-row strong { color: var(--ink); font-weight: 500; }
.support-preview-row.big strong {
  font-family: var(--font-display); font-size: 20px; font-weight: 500;
  letter-spacing: -0.012em;
}
.support-cta {
  display: flex; gap: 10px;
  flex-wrap: wrap;
}
.support-cta .btn { flex: 1; justify-content: center; }
.support-cta .btn:nth-child(2) { flex: 0 0 auto; }
.btn-disabled { opacity: 0.4; pointer-events: none; cursor: not-allowed; }

.btn-spin {
  display: inline-block;
  animation: spin 800ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Inline spinner for in-button loading states — a thin ring with one
   transparent edge rotating. Inherits currentColor so it works on
   primary / secondary / ghost buttons. */
.btn-loader {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  vertical-align: -2px;
  animation: spin 700ms linear infinite;
}

/* Universal focus ring for interactive elements — keyboard users get
   a visible accent, mouse users don't see anything (focus-visible). */
button:focus-visible, a:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  border-radius: 4px;
}

.support-warn {
  margin: 12px 0 0;
  padding: 10px 14px;
  background: var(--crimson-tint);
  border-left: 3px solid var(--crimson);
  border-radius: var(--r-sm);
  color: var(--crimson-deep);
  font-size: 13px; line-height: 1.5;
}

.support-paymethods {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 8px;
  margin: 14px 0 0;
  font-size: 11px;
  color: var(--muted);
}
.support-paymethods-label {
  font-family: var(--font-mono);
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-right: 4px;
}
.support-paymethods-chip {
  padding: 4px 10px;
  background: var(--bg-sunken);
  border: 1px solid var(--hairline);
  border-radius: var(--r-pill);
  font-weight: 600;
  color: var(--ink-soft);
}

.support-foot {
  margin: 14px 0 0;
  text-align: center;
  font-size: 12px; color: var(--muted);
}

/* Confirmation: make support panel sit at full width below the grid */
.confirm-support-wrap {
  max-width: 920px;
  margin: 56px auto 0;
}
.confirm .support {
  background: rgba(255,255,255,0.96);
  color: var(--ink);
}

/* Deliverables are now <button>s — keep them looking like cards */
button.deliverable {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r-md);
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 6px;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease, transform var(--t-fast) ease;
  color: inherit;
  width: 100%;
}
button.deliverable:hover:not(:disabled) {
  border-color: rgba(255,255,255,0.30);
  background: rgba(255,255,255,0.09);
  transform: translateY(-1px);
}
button.deliverable:disabled { opacity: 0.7; cursor: progress; }

/* Mobile: stack tiers and stats */
@media (max-width: 900px) {
  .support { padding: 32px 22px; margin-top: 36px; }
  .support-tiers { grid-template-columns: 1fr 1fr; }
  .support-stats { grid-template-columns: 1fr 1fr 1fr; }
}
@media (max-width: 480px) {
  .support-tiers { grid-template-columns: 1fr; }
  .support-cta { flex-direction: column; }
  .support-cta .btn { width: 100%; }
}

/* ── PARENT ROW + FOOTER (from source codebase) ──────────── */
.parent-row {
  background: var(--surface);
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
}
.parent-row-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px var(--section-pad-x);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}
.parent-row-lead {
  display: flex; align-items: center; gap: 14px;
  font-size: 13px; color: var(--muted);
}
.parent-row-lead .av-mark {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--hairline-strong);
  border-radius: 4px;
  font-family: var(--font-display-2);
  font-weight: 700; font-size: 12px;
  letter-spacing: 0.06em; color: var(--ink);
  text-transform: uppercase;
}
.parent-row-cta {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--ink);
  transition: color var(--t-fast) ease;
}
.parent-row-cta:hover { color: var(--blue); }

.footer-site {
  padding: 80px var(--section-pad-x) 32px;
  background: var(--bg);
}
.footer-site-inner { max-width: 1440px; margin: 0 auto; }
.footer-cols {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1.2fr;
  gap: 48px;
  padding-bottom: 56px;
  border-bottom: 1px solid var(--hairline);
}
.footer-col h4 {
  font-family: var(--font-display-2); font-size: 12px;
  font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink);
  margin: 0 0 16px;
}
.footer-col ul { display: flex; flex-direction: column; gap: 10px; }
.footer-col a { color: var(--muted); font-size: 14px; transition: color var(--t-fast) ease; }
.footer-col a:hover { color: var(--blue); }
.footer-brand-block { display: flex; flex-direction: column; gap: 16px; }
.footer-brand-block .brand { gap: 12px; }
.footer-brand-block .brand-mark { width: 32px; height: 32px; font-size: 15px; border-radius: 7px; }
.footer-brand-block .brand-name { font-size: 16px; }
.footer-description {
  color: var(--muted); font-size: 13px;
  line-height: 1.55; max-width: 300px;
  margin: 0;
}
.footer-social-row {
  margin-top: 20px;
  display: flex; gap: 14px;
}
.footer-social-row a {
  font-size: 13px; color: var(--muted);
  transition: color var(--t-fast) ease;
}
.footer-social-row a:hover { color: var(--blue); }
.footer-newsletter-form {
  display: flex; gap: 8px;
  margin-top: 14px;
}
.footer-newsletter-form input {
  flex: 1; min-width: 0;
  height: 40px; padding: 0 14px;
  border: 1px solid var(--hairline);
  background: var(--surface);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color var(--t-fast) ease;
}
.footer-newsletter-form input:focus { border-color: var(--blue); }
.footer-newsletter-form button {
  height: 40px; padding: 0 16px;
  border-radius: 8px;
  background: var(--ink); color: var(--bg);
  font-weight: 600; font-size: 13px;
  transition: background var(--t-fast) ease, opacity var(--t-fast) ease;
}
.footer-newsletter-form button:hover:not(:disabled) { background: var(--blue); }
.footer-newsletter-form button:disabled { opacity: 0.5; cursor: not-allowed; }
.footer-newsletter-foot {
  margin-top: 10px;
  font-size: 11px; color: var(--muted);
}
.footer-newsletter-foot.ok  { color: var(--success); }
.footer-newsletter-foot.err { color: var(--error); }
.footer-bottom {
  padding-top: 24px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--muted);
  gap: 16px; flex-wrap: wrap;
}
.footer-bottom-links {
  display: flex; gap: 24px; flex-wrap: wrap;
}
.footer-bottom-links a { color: var(--muted); transition: color var(--t-fast) ease; }
.footer-bottom-links a:hover { color: var(--ink); }

/* ── Back to top ─────────────────────────────────────────── */
.back-to-top {
  position: fixed; right: 24px; bottom: 24px; z-index: 90;
  width: 44px; height: 44px;
  background: var(--ink); color: var(--bg);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 16px;
  box-shadow: var(--shadow-soft);
  opacity: 0; transform: translateY(20px) scale(0.85);
  transition: opacity var(--t-med) ease, transform var(--t-med) var(--ease-out), background var(--t-fast) ease;
  pointer-events: none;
}
.back-to-top.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.back-to-top:hover { background: var(--accent); }
.back-to-top:active { transform: scale(0.92); }

/* ── Toast notifications ─────────────────────────────────── */
.toast-container {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 250;
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.toast {
  background: var(--ink); color: var(--bg);
  padding: 14px 18px;
  border-radius: var(--r-md);
  font-size: 14px;
  box-shadow: var(--shadow-deep);
  max-width: 380px;
  display: flex; align-items: center; gap: 10px;
  pointer-events: auto;
  animation: toastIn 320ms var(--ease-out);
}
.toast.error { background: var(--crimson); }
.toast.success { background: var(--success); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Mobile bottom bar + preview sheet ───────────────────── */
.mob-bar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
  background: rgba(255,255,255,0.96);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  border-top: 1px solid var(--hairline);
  padding: 10px 16px max(10px, env(safe-area-inset-bottom));
  align-items: center; gap: 10px;
}
.mob-preview-btn {
  flex: 1;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px 8px 8px;
  background: var(--bg-sunken);
  border-radius: var(--r-md);
  text-align: left;
  min-width: 0;
  transition: background var(--t-fast) ease;
}
.mob-preview-btn:active { background: var(--hairline); }

  if (!parts.length) return "—";

  for (const h of HONORIFICS) {

function titleCase(s) { return (s || "").replace(/\b([\p{L}])([\p{L}''\-]*)/gu, (_, a, b) => a.toUpperCase() + b.toLowerCase()); }

  if (!v) return "";

  return ["+" + m[1], m[2], m[3], m[4]].filter(Boolean).join(" ");

// ─── Backend client (PHP → AppsScript → Sheets) ──────────────────────
//
// The relative path "./api" resolves differently depending on the page's
// URL: at /ceo/  →  /ceo/api  (correct), but at /ceo  →  /api  (wrong).
// We derive an absolute path from window.location.pathname, anchored to
// the directory containing the page, so every endpoint resolves correctly
// no matter how the URL is rewritten or how the server normalizes it.
//
// Override via <meta name="sts-api-base" content="…"> in <head> if your
// PHP backend lives somewhere different from the HTML (e.g. /api on a
// different sub-domain). Otherwise auto-detection just works.
const API_BASE = (() => {
  // 1) Explicit override
  const meta = document.querySelector('meta[name="sts-api-base"]');
  if (meta && meta.content) return meta.content.replace(/\/+$/, '');
  // 2) Derive from this script's location if we can find it
  try {
    const scripts = Array.from(document.querySelectorAll('script[type="text/babel"], script[src*="/index"]'));
    for (const s of scripts) {
      if (s.src) {
        const u = new URL(s.src, window.location.href);
        const dir = u.pathname.replace(/\/[^/]*$/, '/');
        return new URL(dir + 'api', u.origin).toString().replace(/\/+$/, '');
      }
    }
  } catch {}
  // 3) Derive from window.location: strip trailing filename, then append "api"
  const path = window.location.pathname;
  const dir = /\.[a-z0-9]+$/i.test(path) ? path.replace(/\/[^/]*$/, '/') : (path.endsWith('/') ? path : path + '/');
  return new URL(dir + 'api', window.location.origin).toString().replace(/\/+$/, '');
})();

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    credentials: "same-origin",
  });
  if (!res.ok) {
    const txt = await res.text().catch(() => "");
    let parsed = null; try { parsed = JSON.parse(txt); } catch {}
    // Build a useful error message — surface the actual URL that 404'd
    // so deploy-config issues are immediately diagnosable.
    const msg = (parsed && parsed.error) || ("HTTP " + res.status + " from " + url);
    const e = new Error(msg); e.status = res.status; e.url = url;
    throw e;
  }
  return res.json();
}

async function getJSON(url) {
  const res = await fetch(url, { credentials: "same-origin" });
  if (!res.ok) {
    const e = new Error("HTTP " + res.status + " from " + url);
    e.status = res.status; e.url = url;
    throw e;
  }
  return res.json();
}

// AI engine with in-flight promise dedupe + result cache
const AI = (() => {
  const cache = new Map();
  function call(action, data) {
    const key = action + ":" + JSON.stringify(data);
    if (cache.has(key)) return cache.get(key);
    const p = (async () => {
      try {
        const json = await postJSON(API_BASE + "/ai.php", { action, data });
        if (!json.ok) throw new Error(json.error || "AI error");
        let parsed = json.data;
        if (typeof parsed === "string") { try { parsed = JSON.parse(parsed); } catch {} }
        return parsed;
      } catch (err) {
        console.warn("[AI] " + action, err.message);
        cache.delete(key);
        return null;
      }
    })();
    cache.set(key, p);
    return p;
  }
  return {
    centreMatch:  (d) => call("centre_match",  d),
    sessionBrief: (d) => call("session_brief", d),
    shareCopy:    (d) => call("share_copy",    d),
    noteSuggest:  (d) => call("note_suggest",  d),
    clearCache:   () => cache.clear(),
  };
})();

// ─── Toast notifications ─────────────────────────────────────────────
let _toastCounter = 0;
const _toastListeners = new Set();
function showToast(message, type = "info", duration = 4000) {
  const id = ++_toastCounter;
  _toastListeners.forEach((fn) => fn({ type: "add", id, message, kind: type }));
  setTimeout(() => _toastListeners.forEach((fn) => fn({ type: "remove", id })), duration);
}
function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    const handler = (ev) => {
      if (ev.type === "add") setToasts((t) => [...t, { id: ev.id, message: ev.message, kind: ev.kind }]);
      else if (ev.type === "remove") setToasts((t) => t.filter((x) => x.id !== ev.id));
    };
    _toastListeners.add(handler);
    return () => _toastListeners.delete(handler);
  }, []);
  return (
    <div className="toast-container" aria-live="polite" aria-atomic="true">
      {toasts.map((t) => (
        <div key={t.id} className={cn("toast", t.kind)} role="status">{t.message}</div>
      ))}
    </div>
  );
}

// ─── CountUp ─────────────────────────────────────────────────────────
function CountUp({ to, duration = 1100, suffix = "" }) {
  const [v, setV] = useState(0);
  useEffect(() => {
    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (prefersReduced) { setV(to); return; }
    let raf, start;
    const ease = (p) => 1 - Math.pow(1 - p, 3);
    const tick = (t) => {
      if (!start) start = t;
      const p = Math.min((t - start) / duration, 1);
      setV(Math.floor(ease(p) * to));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [to, duration]);
  return <>{v.toLocaleString()}{suffix}</>;
}

// ─── Theme toggle (system / light / dark) ────────────────────────────
function ThemeToggle() {
  const [mode, setMode] = useState(() => {
    try { return localStorage.getItem("sts.theme") || "system"; }
    catch { return "system"; }
  });

  const applyMode = useCallback((m) => {
    try { localStorage.setItem("sts.theme", m); } catch {}
    const resolved = m === "system"
      ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      : m;
    document.documentElement.setAttribute("data-theme", resolved);
    document.documentElement.setAttribute("data-theme-mode", m);
    setMode(m);
  }, []);

  useEffect(() => {
    // React to system theme changes while in 'system' mode
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = (e) => {
      if (document.documentElement.getAttribute("data-theme-mode") === "system") {
        document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
      }
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", onChange);
      else if (mq.removeListener) mq.removeListener(onChange);
    };
  }, []);

  return (
    <div className="theme-toggle" role="radiogroup" aria-label="Theme">
      <button
        type="button"
        role="radio"
        aria-checked={mode === "system"}
        aria-label="Theme: System"
        title="Theme: System"
        className={mode === "system" ? "on" : ""}
        onClick={() => applyMode("system")}
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="1.5" y="2.5" width="11" height="7.5" rx="1" stroke="currentColor" strokeWidth="1.3" />
          <path d="M5 12h4M7 10v2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" />
        </svg>
      </button>
      <button
        type="button"
        role="radio"
        aria-checked={mode === "light"}
        aria-label="Theme: Light"
        title="Theme: Light"
        className={mode === "light" ? "on" : ""}
        onClick={() => applyMode("light")}
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="2.6" stroke="currentColor" strokeWidth="1.3" />
          <path d="M7 1.5v1.4M7 11.1v1.4M1.5 7h1.4M11.1 7h1.4M2.8 2.8l1 1M10.2 10.2l1 1M2.8 11.2l1-1M10.2 3.8l1-1" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" />
        </svg>
      </button>
      <button
        type="button"
        role="radio"
        aria-checked={mode === "dark"}
        aria-label="Theme: Dark"
        title="Theme: Dark"
        className={mode === "dark" ? "on" : ""}
        onClick={() => applyMode("dark")}
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M11.5 8.4A4.6 4.6 0 0 1 5.6 2.5 4.6 4.6 0 1 0 11.5 8.4Z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" />
        </svg>
      </button>
    </div>
  );
}

// ─── Photo upload (optional, used in the "I Will Be There" card) ─────
function PhotoUpload({ photoDataUrl, onChange }) {
  const [busy, setBusy] = useState(false);
  const [busyMsg, setBusyMsg] = useState("");
  const [progress, setProgress] = useState(0);
  const [err, setErr] = useState(null);
  const [originalDataUrl, setOriginalDataUrl] = useState("");
  const [bgRemoved, setBgRemoved] = useState(false);
  const inputRef = useRef(null);

  const handleFile = async (file) => {
    if (!file) return;
    setBusy(true); setErr(null); setBusyMsg("Resizing…");
    try {
      const dataUrl = await fileToResizedDataUrl(file, 1400);
      setOriginalDataUrl(dataUrl);
      setBgRemoved(false);
      onChange(dataUrl);
    } catch (e) {
      setErr(e.message || "Could not process that image.");
    } finally {
      setBusy(false); setBusyMsg("");
      if (inputRef.current) inputRef.current.value = "";
    }
  };

  // Smart background remover — lazy-loads the model only when first used.
  // Runs entirely in the browser (WASM) — no upload to any external service.
  // Shows real download/segmentation progress and supports cancellation.
  const removeBg = async () => {
    if (!originalDataUrl && !photoDataUrl) return;
    setBusy(true); setErr(null); setBusyMsg("Loading model (one-time, ~30 MB)…");
    setProgress(0);

    try {
      const removeBackground = await loadBgRemoval();
      const sourceUrl = bgRemoved && originalDataUrl ? originalDataUrl : (originalDataUrl || photoDataUrl);
      const sourceBlob = await (await fetch(sourceUrl)).blob();

      const resultBlob = await removeBackground(sourceBlob, {
        progress: (key, current, total) => {
          // The library emits keys like "fetch:model" while loading and
          // "compute:inference" while processing. Map to a single 0-100.
          const pct = total ? Math.round((current / total) * 100) : 0;
          if (key && key.startsWith("fetch")) {
            setBusyMsg("Loading model… " + pct + "%");
            setProgress(Math.min(70, Math.round(pct * 0.7)));
          } else if (key && key.startsWith("compute")) {
            setBusyMsg("Removing background… " + pct + "%");
            setProgress(70 + Math.round(pct * 0.3));
          }
        },
        debug: false,
        output: { format: "image/png" },
      });

      const dataUrl = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(String(fr.result));
        fr.onerror = () => rej(new Error("Could not read processed image."));
        fr.readAsDataURL(resultBlob);
      });
      if (!originalDataUrl) setOriginalDataUrl(photoDataUrl);
      onChange(dataUrl);
      setBgRemoved(true);
      setProgress(100);
    } catch (e) {
      console.warn("[bg-removal]", e);
      setErr("Background removal isn't available right now (" + (e && e.message || "unknown") + "). Your photo is still saved.");
    } finally {
      setTimeout(() => { setBusy(false); setBusyMsg(""); setProgress(0); }, 400);
    }
  };

  // AI-generated portrait — uses Pollinations to create a polished
  // editorial portrait variant from the speaker's role/sector. Useful
  // when the user has no usable headshot but wants something on the
  // deliverable. Free, no API key, generates in ~5–15s.
  const generatePortrait = async () => {
    setBusy(true); setErr(null); setBusyMsg("Generating portrait…"); setProgress(20);
    try {
      // Build a tasteful prompt from the form context (passed via the
      // parent). We deliberately keep it generic — editorial business
      // portrait, neutral background — to avoid producing anything
      // that misrepresents the actual speaker.
      const ctx = window.__stsContextForPortrait || {};
      const role = ctx.role || "leader";
      const sectorKey = ctx.sector || "professional";
      const prompt =
        "editorial black-and-white portrait of a distinguished " + sectorKey + " professional, " +
        role + ", confident expression, soft studio lighting, " +
        "neutral charcoal background, magazine-quality, high detail, " +
        "sharp focus, dignified, no logos, no text";
      setProgress(50);
      const dataUrl = await pollinationsPortrait(prompt, { width: 1024, height: 1024 });
      setProgress(95);
      if (!originalDataUrl) setOriginalDataUrl(photoDataUrl || "");
      onChange(dataUrl);
      setBgRemoved(false);
      setProgress(100);
    } catch (e) {
      console.warn("[pollinations]", e);
      setErr("Could not generate a portrait (" + (e && e.message || "unknown") + ").");
    } finally {
      setTimeout(() => { setBusy(false); setBusyMsg(""); setProgress(0); }, 400);
    }
  };

  const restoreOriginal = () => {
    if (!originalDataUrl) return;
    onChange(originalDataUrl);
    setBgRemoved(false);
  };

  const removeAll = () => {
    onChange(""); setOriginalDataUrl(""); setBgRemoved(false); setErr(null);
  };

  return (
    <div className="field full">
      <label>
        <span>
          A portrait or working photograph
          <span className="opt"> · optional</span>
        </span>
        {photoDataUrl && <span className="ok-check" aria-label="photo set">✓</span>}
      </label>
      <div className={cn("photo-upload", photoDataUrl && "has-photo", busy && "busy")}>
        {photoDataUrl ? (
          <>
            <div className={cn("photo-upload-preview", bgRemoved && "transparent")}>
              <img src={photoDataUrl} alt="Your uploaded portrait" />
            </div>
            <div className="photo-upload-actions">
              <button
                type="button"
                className="photo-upload-btn"
                onClick={() => inputRef.current?.click()}
                disabled={busy}
              >Replace</button>
              {!bgRemoved ? (
                <button
                  type="button"
                  className="photo-upload-btn photo-upload-btn-primary"
                  onClick={removeBg}
                  disabled={busy}
                  title="Removes the photo background so the portrait sits cleanly on the card"
                >
                  {busy ? (busyMsg || "Working…") : "✨ Smart isolate"}
                </button>
              ) : (
                <button
                  type="button"
                  className="photo-upload-btn"
                  onClick={restoreOriginal}
                  disabled={busy}
                  title="Restore the original background"
                >Restore background</button>
              )}
              <button
                type="button"
                className="photo-upload-btn photo-upload-btn-danger"
                onClick={removeAll}
                disabled={busy}
              >Remove</button>
            </div>
            {busy && busyMsg && (
              <div className="photo-upload-progress" aria-live="polite">
                <div>{busyMsg}</div>
                <div className="photo-upload-progress-bar" role="progressbar" aria-valuenow={progress} aria-valuemin="0" aria-valuemax="100">
                  <div className="photo-upload-progress-bar-fill" style={{ width: progress + "%" }} />
                </div>
              </div>
            )}
          </>
        ) : (
          <>
          <button
            type="button"
            className="photo-upload-drop"
            onClick={() => inputRef.current?.click()}
            onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add("dragover"); }}
            onDragLeave={(e) => e.currentTarget.classList.remove("dragover")}
            onDrop={(e) => {
              e.preventDefault();
              e.currentTarget.classList.remove("dragover");
              handleFile(e.dataTransfer.files[0]);
            }}
            disabled={busy}
            aria-label="Upload a photo"
          >
            <span className="photo-upload-icon" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <rect x="3" y="6" width="22" height="17" rx="2" stroke="currentColor" strokeWidth="1.6"/>
                <circle cx="14" cy="14" r="4" stroke="currentColor" strokeWidth="1.6"/>
                <circle cx="20.5" cy="10" r="1" fill="currentColor"/>
              </svg>
            </span>
            <span className="photo-upload-text">
              {busy ? (busyMsg || "Preparing your photo…") : "Drop or click to upload"}
            </span>
            <span className="photo-upload-hint">
              JPG, PNG or WEBP · auto-resized to 1400px · optional smart isolate
            </span>
          </button>
          {busy && busyMsg && (
            <div className="photo-upload-progress" aria-live="polite">
              <div>{busyMsg}</div>
              <div className="photo-upload-progress-bar">
                <div className="photo-upload-progress-bar-fill" style={{ width: progress + "%" }} />
              </div>
            </div>
          )}
          </>
        )}
        <input
          ref={inputRef}
          type="file"
          accept="image/jpeg,image/png,image/webp"
          onChange={(e) => handleFile(e.target.files?.[0])}
          style={{ display: "none" }}
        />
      </div>
      {err && <div className="err-text" role="alert">{err}</div>}
      <div className="field-hint">
        Used on your "I will be there" card. We never publish it without your consent.
      </div>
    </div>
  );
}

// ─── Legacy Card (right rail) ────────────────────────────────────────
function LegacyCard({ form, computed, confirmed, large }) {
  const ref = useRef(null);
  const [tilt, setTilt] = useState({ rx: 0, ry: 0 });
  const reduceMotion = useRef(false);

  useEffect(() => {
    reduceMotion.current = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }, []);

  const onMove = (e) => {
    if (!ref.current || large || reduceMotion.current) return;
    const r = ref.current.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width  - 0.5;
    const y = (e.clientY - r.top)  / r.height - 0.5;
    setTilt({ rx: -y * 5, ry: x * 5 });
  };
  const onLeave = () => setTilt({ rx: 0, ry: 0 });

  const displayName = [form.honorific, form.name].filter(Boolean).join(" ").trim();
  const displayTitle = [form.role, form.org].filter(Boolean).join(", ").trim();

  return (
    <article
      ref={ref}
      onMouseMove={onMove}
      onMouseLeave={onLeave}
      className={cn("legacy", large && "legacy-large", confirmed && "legacy-confirmed")}
      style={{ transform: `perspective(1200px) rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)` }}
      aria-label="Live preview of your archive card"
    >
      <div className="legacy-bg" aria-hidden="true" />
      <div className="legacy-inner">
        <div className="legacy-header">
          <div className="legacy-eyebrow">STREET-TO-STARDOM · <strong>2026 ARCHIVE</strong></div>
          <div className={cn("legacy-status", confirmed && "confirmed")}>
            <span className="sdot" aria-hidden="true"></span>
            {confirmed ? "Confirmed" : "Pending"}
          </div>
        </div>

        <div className="legacy-portrait" aria-hidden="true">
          <span className="portrait-init">{displayName ? initialsFrom(displayName) : "—"}</span>
        </div>

        <h3 className={cn("legacy-name", !displayName && "pending")}>
          {displayName || "Your name appears here"}
        </h3>
        <div className={cn("legacy-title", !displayTitle && "pending")}>
          {displayTitle || "Role · Organisation"}
        </div>

        <div className="legacy-grid">
          <div className="lf">
            <span className="lf-key">Will speak at</span>
            <span className={cn("lf-val", !computed.centre && "pending")}>
              {computed.centre?.name || "Centre pending"}
              {computed.centre && <small>{computed.centre.focus}</small>}
            </span>
          </div>
          <div className="lf">
            <span className="lf-key">Session</span>
            <span className={cn("lf-val", !computed.day && "pending")}>
              {computed.day?.date || "Date pending"}
              {computed.day && <small>{computed.day.dow} · Theme · {computed.day.theme}</small>}
            </span>
          </div>
          <div className="lf">
            <span className="lf-key">Children present</span>
            <span className={cn("lf-val", !computed.centre && "pending")}>
              {computed.centre ? computed.centre.children : "—"}
              {computed.centre && <small>of 900 cohort</small>}
            </span>
          </div>
          <div className="lf">
            <span className="lf-key">Time</span>
            <span className="lf-val">9:00 — 10:00 AM<small>+ 30 min mentorship</small></span>
          </div>
        </div>

        <p className="legacy-quote">
          {confirmed
            ? <>"One of six leaders who built <em>a generation.</em>"</>
            : <>"{TONE.legacyQuote}"</>}
        </p>

        <div className="legacy-seal">
          <span>Cohort 2026 · Vol. I</span>
          <div className="crest" aria-hidden="true">S</div>
          <span>{confirmed ? "Archived ✓" : "Catalogue Pending"}</span>
        </div>
      </div>
    </article>
  );
}

// ─── AI · Centre Insight panel ───────────────────────────────────────
function AICentreInsight({ form, onSelectCentre }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(false);
  const requested = useRef(false);

  const profileReady = form.name.trim().split(/\s+/).length >= 2 && form.role.trim() && form.org.trim();

  useEffect(() => {
    if (!profileReady || requested.current) return;
    requested.current = true;
    setLoading(true);
    AI.centreMatch({ name: form.name, role: form.role, org: form.org })
      .then((d) => { if (d) setData(d); else setError(true); })
      .catch(() => setError(true))
      .finally(() => setLoading(false));
  }, [profileReady]);

  if (!profileReady || error) return null;
  if (loading) {
    return (
      <div className="ai-panel" role="status">
        <div className="ai-header"><span className="ai-spark" aria-hidden="true">✦</span> AI Centre Advisor</div>
        <div className="ai-loading"><div className="ai-dots" aria-hidden="true"><span></span><span></span><span></span></div>Analysing your profile…</div>
      </div>
    );
  }
  if (!data) return null;

  const topCentre = CENTRES.find((c) => c.id === data.top_pick?.id);
  const runnerCentre = CENTRES.find((c) => c.id === data.runner_up?.id);

  return (
    <div className="ai-panel" role="region" aria-label="AI centre recommendations">
      <div className="ai-header"><span className="ai-spark" aria-hidden="true">✦</span> AI Centre Advisor · based on your profile</div>
      <div className="ai-rec">
        {topCentre && (
          <button type="button" className="ai-rec-item" onClick={() => onSelectCentre(topCentre.id)}>
            <div className="ai-rec-rank" aria-hidden="true">1</div>
            <div className="ai-rec-body">
              <div className="ai-rec-centre">{topCentre.name}</div>
              <div className="ai-rec-reason">{data.top_pick.reason}</div>
              <div className="ai-rec-select">Select this centre →</div>
            </div>
          </button>
        )}
        {runnerCentre && (
          <button type="button" className="ai-rec-item" onClick={() => onSelectCentre(runnerCentre.id)}>
            <div className="ai-rec-rank runner" aria-hidden="true">2</div>
            <div className="ai-rec-body">
              <div className="ai-rec-centre">{runnerCentre.name}</div>
              <div className="ai-rec-reason">{data.runner_up.reason}</div>
              <div className="ai-rec-select">Select this centre →</div>
            </div>
          </button>
        )}
      </div>
      {data.personal_note && <div className="ai-personal-note">{data.personal_note}</div>}
    </div>
  );
}

// ─── AI · Note Suggestions ───────────────────────────────────────────
function AINoteSuggest({ form, onSelect }) {
  const [suggestions, setSuggestions] = useState(null);
  const [loading, setLoading] = useState(false);
  const [requested, setRequested] = useState(false);

  const profileReady = form.name.trim().split(/\s+/).length >= 2 && form.role.trim();

  const doFetch = useCallback(() => {
    if (loading || suggestions) return;
    setLoading(true); setRequested(true);
    const centreObj = CENTRES.find((c) => c.id === form.centre);
    AI.noteSuggest({ name: form.name, role: form.role, centre: centreObj?.name || "", focus: centreObj?.focus || "" })
      .then((d) => { if (d?.suggestions) setSuggestions(d.suggestions); })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [form.name, form.role, form.centre, loading, suggestions]);

  if (!profileReady) return null;
  if (suggestions) {
    return (
      <div className="ai-note-chips" role="group" aria-label="AI note suggestions">
        {suggestions.map((s, i) => (
          <button key={i} type="button" className="ai-note-chip" onClick={() => onSelect(s)}>
            ✦ {s}
          </button>
        ))}
      </div>
    );
  }
  if (loading) {
    return (
      <div className="ai-loading" role="status" style={{paddingBottom: 0}}>
        <div className="ai-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        Writing suggestions…
      </div>
    );
  }
  if (!requested) {
    return (
      <button type="button" className="ai-note-chip" onClick={doFetch} style={{marginTop: 8}}>
        ✦ Suggest a note with AI
      </button>
    );
  }
  return null;
}

function HowItWorksModal({ open, onClose, onBegin }) {
  const firstFocusable = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      if (e.key === "Tab") {
        // Simple focus trap
        const focusables = document.querySelectorAll(".modal-panel button, .modal-panel a, .modal-panel input");
        if (!focusables.length) return;
        const first = focusables[0], last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey);
    setTimeout(() => firstFocusable.current?.focus(), 60);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";

// Trigger a file download from a Blob
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

// Load an image as a Promise
function loadImg(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// Read a File into a downsampled JPEG dataURL.
// Caps the largest dimension to MAX_DIM and re-encodes at q=0.82 so we
// don't pin a 12 MP phone photo into localStorage.
// Lazy-loaded smart background remover.
// Loads @imgly/background-removal from a CDN on first use (≈ 30 MB
// for the WASM model). All processing happens in the browser — the
// image never leaves the user's device.
//
// The library exports `removeBackground(imageBlob, config?)` where
// config can include { progress: (key, current, total) => void } and
// other tuning knobs. We surface progress through a callback so the
// UI can show real-time download/segment percentages.
let _bgRemovalPromise = null;
function loadBgRemoval() {
  if (_bgRemovalPromise) return _bgRemovalPromise;
  _bgRemovalPromise = (async () => {
    // Try the jsdelivr ESM build first; mirror to unpkg if blocked.
    const candidates = [
      "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.6/+esm",
      "https://unpkg.com/@imgly/background-removal@1.5.6/dist/index.mjs",
    ];
    let lastErr;
    for (const url of candidates) {
      try {
        const mod = await import(url);
        return mod.default || mod.removeBackground || mod;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error("Background removal library unreachable.");
  })();
  return _bgRemovalPromise;
}

/**
 * Pollinations image enhancement — generates a stylized AI portrait
 * variant from a text description of the speaker. Useful when the
 * user doesn't have a usable headshot but wants something polished
 * on the deliverable. Free, no API key.
 *
 * Pollinations image endpoint:
 *   GET https://image.pollinations.ai/prompt/{prompt}?width=W&height=H&model=flux&nologo=true
 *
 * Returns a JPEG; we fetch it and convert to a data URL.
 */
async function pollinationsPortrait(prompt, opts) {
  const o = opts || {};
  const w = o.width  || 1024;
  const h = o.height || 1024;
  const model = o.model || "flux";
  const params = new URLSearchParams({
    width: String(w),
    height: String(h),
    model,
    nologo: "true",
    enhance: "true",
    seed: String(Math.floor(Math.random() * 1e9)),
    private: "true",
  });
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) + "?" + params.toString();
  const r = await fetch(url, { method: "GET", credentials: "omit" });
  if (!r.ok) throw new Error("Pollinations returned " + r.status);
  const blob = await r.blob();
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result));
    fr.onerror = () => rej(new Error("Could not read generated image."));
    fr.readAsDataURL(blob);
  });
}

async function fileToResizedDataUrl(file, MAX_DIM = 1400) {
  if (!file || !file.type || !file.type.startsWith("image/")) {
    throw new Error("Please choose an image file (JPG, PNG, WEBP).");
  }
  if (file.size > 20 * 1024 * 1024) {
    throw new Error("That image is over 20 MB. Please pick a smaller photo.");
  }
  // Read the file
  const readerData = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Could not read that file."));
    r.readAsDataURL(file);
  });
  // Decode into an Image, then redraw to canvas at capped dimensions
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("That image could not be decoded."));
    i.src = readerData;
  });
  const ratio = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
  const w = Math.round(img.width * ratio);
  const h = Math.round(img.height * ratio);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);
  // Use JPEG to keep size sane; PNG of a photo would be enormous.
  return c.toDataURL("image/jpeg", 0.82);
}

// Ensure custom web fonts are actually loaded into the canvas runtime.
// Without this, the first canvas paint will silently fall back to the
// system equivalent (Helvetica/Arial) before Montserrat is parsed.
async function ensureFontLoaded(specs) {
  if (typeof document === "undefined" || !document.fonts || !document.fonts.load) return;
  try {
    await Promise.all(specs.map((s) => document.fonts.load(s, "STS")));
    await document.fonts.ready;
  } catch (e) {
    // Non-fatal — canvas falls back to the next family in the stack.
    console.warn("[STS] Font preload skipped:", e && e.message);
  }
}

// ─── Canvas drawing primitives ──────────────────────────────────────
// Lightweight helpers that get the deliverables out of "fillText soup"
// territory and into something that reads as designed.

function cnvRoundRect(ctx, x, y, w, h, r) {
  const rad = typeof r === "number" ? { tl: r, tr: r, br: r, bl: r } : Object.assign({ tl: 0, tr: 0, br: 0, bl: 0 }, r);
  ctx.beginPath();
  ctx.moveTo(x + rad.tl, y);
  ctx.lineTo(x + w - rad.tr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rad.tr);
  ctx.lineTo(x + w, y + h - rad.br);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rad.br, y + h);
  ctx.lineTo(x + rad.bl, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rad.bl);
  ctx.lineTo(x, y + rad.tl);
  ctx.quadraticCurveTo(x, y, x + rad.tl, y);
  ctx.closePath();
}

function cnvFilmGrain(ctx, x, y, w, h, intensity) {
  // Subtle monochrome grain — gives the photograph an editorial weight
  const id = ctx.createImageData(w, h);
  const data = id.data;
  const i_max = data.length;
  const amp = intensity != null ? intensity : 14;
  for (let i = 0; i < i_max; i += 4) {
    const v = (Math.random() - 0.5) * amp;
    data[i] = 128 + v; data[i+1] = 128 + v; data[i+2] = 128 + v;
    data[i+3] = 8;
  }
  const tmp = document.createElement("canvas");
  tmp.width = w; tmp.height = h;
  tmp.getContext("2d").putImageData(id, 0, 0);
  const prev = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = "overlay";
  ctx.drawImage(tmp, x, y);
  ctx.globalCompositeOperation = prev;
}

// Soft drop-shadow text — used for headlines on top of busy photos
function cnvShadowedText(ctx, text, x, y, opts) {
  const o = opts || {};
  ctx.save();
  if (o.shadow !== false) {
    ctx.shadowColor = o.shadowColor || "rgba(0,0,0,0.55)";
    ctx.shadowBlur = o.shadowBlur != null ? o.shadowBlur : 16;
    ctx.shadowOffsetY = o.shadowOffsetY != null ? o.shadowOffsetY : 2;
  }
  ctx.fillText(text, x, y);
  ctx.restore();
}

function cnvDrawCenteredCircleImage(ctx, img, cx, cy, diameter) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, diameter / 2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  const r = Math.max(diameter / img.width, diameter / img.height);
  const dw = img.width * r, dh = img.height * r;
  ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
  ctx.restore();
}

// ── STS brand mark — proper recreation of the SVG logo in 2D
// Sky-blue rounded square with the angled S T S monogram in white,
// with a crimson T stroke through the centre. Used on every deliverable.
// STS logo embedded as base64 SVG. The same asset that lives at
// assets/sts-logo.svg, inlined here so canvas deliverables don't
