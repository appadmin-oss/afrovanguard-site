<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">

<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">

<title>Street-To-Stardom · 2026 · Empowered 360° · Speaker Initiation</title>
<meta name="description" content="You have been invited to address the next 900. Street-To-Stardom 2026 Leadership Series — Empowered 360° — Alimosho, Lagos.">
<meta property="og:title" content="Street-To-Stardom · 2026 · Empowered 360°">
<meta property="og:description" content="One conversation can redirect a Lagos child's destiny. Six centres. 900 Lagos children. August 2026.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="assets/og-image.png">
<meta name="twitter:image" content="assets/og-image.png">
<link rel="icon" type="image/svg+xml" href="assets/sts-logo.svg">
<link rel="apple-touch-icon" href="assets/sts-logo.svg">

<!-- Preload critical assets so the first paint feels instant -->
<link rel="preload" as="image" href="assets/bg.png">

<!-- Pre-paint theme bootstrap: runs before CSS to avoid FOUC -->
<script>
  (function () {
    try {
      var mode = localStorage.getItem("sts.theme") || "system";
      var resolved = mode === "system"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : mode;
      document.documentElement.setAttribute("data-theme", resolved);
      document.documentElement.setAttribute("data-theme-mode", mode);
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────
   STS · CEO Speaker Initiation — production
   Visual system aligned to the Street-To-Stardom main website.
   Light + Dark modes via data-theme attribute on <html>.
   ───────────────────────────────────────────────────────────────────── */

:root,
:root[data-theme="light"] {
  --bg: #FAFAF8;
  --bg-sunken: #F4F4F0;
  --surface: #FFFFFF;
  --surface-2: #FAFAF8;
  --ink: #0A0A0F;
  --ink-soft: #1A1A22;
  --muted: #6B6B70;
  --muted-2: #93939A;
  --hairline: #ECECEC;
  --hairline-strong: #D7D7DA;
  --nav-bg: rgba(250, 250, 248, 0.82);
  --tint-blue: rgba(7, 50, 247, 0.06);
  --tint-crimson: rgba(200, 16, 46, 0.07);

  --blue: #0732F7;
  --blue-deep: #0420B5;
  --blue-tint: #EEF1FF;
  --crimson: #C8102E;
  --crimson-deep: #92091F;
  --crimson-tint: #FDEEF1;

  /* Single accent system mapped to brand blue for backwards compat */
  --accent: var(--blue);
  --accent-deep: var(--blue-deep);
  --accent-tint: var(--blue-tint);
  --accent-2: var(--crimson);
  --accent-2-tint: var(--crimson-tint);

  --success: #1f9b5c;
  --warning: #d97706;
  --error:   var(--crimson);

  /* Type system matches STS website — Montserrat display + Inter body */
  --font-display: "Montserrat", ui-sans-serif, system-ui, sans-serif;
  --font-display-2: "Montserrat", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
  --r-pill: 999px;

  --section-pad-x: 56px;
  --section-pad-y: 96px;

  --shadow-soft: 0 1px 2px rgba(10,10,15,0.04), 0 12px 32px -16px rgba(10,10,15,0.10);
  --shadow-float: 0 12px 32px -8px rgba(7, 50, 247, 0.18), 0 2px 6px rgba(10, 10, 15, 0.05);
  --shadow-card: 0 1px 2px rgba(10, 10, 15, 0.04);
  --shadow-deep: 0 60px 120px -40px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.18);
  --shadow-ring: 0 0 0 3px var(--blue-tint);

  --ease-out: cubic-bezier(.2,.7,.2,1);
  --t-fast: 140ms;
  --t-med: 240ms;
  --t-slow: 480ms;
}

:root[data-theme="dark"] {
  --bg: #0B0B12;
  --bg-sunken: #07070C;
  --surface: #14141C;
  --surface-2: #1A1A24;
  --ink: #F2F2F4;
  --ink-soft: #DCDCE0;
  --muted: #94949C;
  --muted-2: #6A6A72;
  --hairline: #232330;
  --hairline-strong: #31313F;
  --nav-bg: rgba(11, 11, 18, 0.78);
  --tint-blue: rgba(7, 50, 247, 0.14);
  --tint-crimson: rgba(200, 16, 46, 0.16);

  --blue: #5172FF;
  --blue-deep: #2A4DDD;
  --blue-tint: rgba(81, 114, 255, 0.12);
  --crimson: #FF4D63;
  --crimson-deep: #DD2B43;
  --crimson-tint: rgba(255, 77, 99, 0.12);

  --shadow-soft: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.55);
  --shadow-float: 0 12px 32px -8px rgba(81, 114, 255, 0.4), 0 2px 6px rgba(0, 0, 0, 0.35);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-ring: 0 0 0 3px var(--blue-tint);

  /* Status palette — lifted brightness for dark-mode legibility (4.5:1
     contrast against --bg). Light-theme --success is too dark to read
     when the page background is near-black. */
  --success: #5ee2a6;
  --success-soft: rgba(94, 226, 166, 0.16);
  --warning: #f7c860;
  --danger:  #ff6a7a;
}

/* ── Reset + Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
  /* `clip` prevents horizontal overflow without creating a new scrolling
     container the way `hidden` does on the root — so vertical page scroll
     keeps working on mobile. Falls back via `overflow-x: hidden` for
     browsers that don't support `clip`. */
  overflow-x: hidden;
  overflow-x: clip;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  min-height: 100dvh;
  /* iOS notch / Android nav-bar safe areas */
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  /* Remove iOS tap-highlight; we provide our own focus/active states */
  -webkit-tap-highlight-color: transparent;
}
/* touch-action only on interactive elements (NOT body, which locks scroll
   on some mobile browsers). This still kills the iOS double-tap-zoom on
   buttons/links — the original goal. */
button, a, [role="button"], .btn, .step, .day, .centre, .deliverable,
.support-tier, .photo-upload-btn, .photo-upload-drop, .donation-banner__cta,
.theme-toggle button, .nav-cta, .hero-cta-primary, .hero-cta-secondary,
.bar-cta, .mob-preview-btn, .mob-continue {
  touch-action: manipulation;
}
input, textarea, select { touch-action: auto; }
::selection { background: var(--accent); color: #fff; }
button, input, textarea, select {
  font: inherit;
  color: inherit;
}
button { cursor: pointer; background: transparent; border: 0; padding: 0; color: inherit; }
img, svg { display: block; max-width: 100%; }
img { height: auto; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; padding: 0; margin: 0; }
/* Prevent any flex/grid child from blowing out the viewport */
.stage, .hero, .confirm, .modal-panel, .composer, .review {
  max-width: 100%;
  min-width: 0;
}
::selection { background: var(--accent); color: #fff; }
button, input, textarea, select {
  font: inherit;
  color: inherit;
}
button { cursor: pointer; background: transparent; border: 0; padding: 0; color: inherit; }
img, svg { display: block; max-width: 100%; }
img { height: auto; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; padding: 0; margin: 0; }
/* Prevent any flex/grid child from blowing out the viewport */
.stage, .hero, .confirm, .modal-panel, .composer, .review {
  max-width: 100%;
  min-width: 0;
}

/* ── Accessibility: focus, skip link, sr-only ─────────────── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
[role="button"]:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.skip-link {
  position: absolute; top: 0; left: 0;
  padding: 12px 18px;
  background: var(--ink); color: var(--bg);
  font-family: var(--font-mono); font-size: 12px;
  border-bottom-right-radius: 8px;
  transform: translateY(-100%);
  transition: transform var(--t-fast) ease;
  z-index: 1000;
}
.skip-link:focus { transform: translateY(0); }

/* ── Backend-unreachable banner — sticky top, dismissible ─── */
.api-warning {
  position: sticky;
  top: 0;
  z-index: 90;
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 18px;
  background: #FFF4E5;
  color: #8B5A00;
  border-bottom: 1px solid #FFC07A;
  font-size: 13.5px;
  line-height: 1.45;
}
.api-warning-icon { font-size: 18px; line-height: 1; flex-shrink: 0; margin-top: 1px; }
.api-warning-body { flex: 1; }
.api-warning-body strong { color: #5C3A00; font-weight: 600; }
.api-warning-body code {
  background: rgba(255,255,255,0.55);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  word-break: break-all;
}
.api-warning-dismiss {
  background: transparent;
  border: 0;
  color: inherit;
  font-size: 20px;
  line-height: 1;
  padding: 0 6px;
  cursor: pointer;
  opacity: 0.7;
  flex-shrink: 0;
}
.api-warning-dismiss:hover { opacity: 1; }
:root[data-theme="dark"] .api-warning {
  background: rgba(255, 192, 122, 0.10);
  color: #FFD2A2;
  border-bottom-color: rgba(255, 192, 122, 0.32);
}
:root[data-theme="dark"] .api-warning-body strong { color: #FFE4C2; }
:root[data-theme="dark"] .api-warning-body code { background: rgba(0,0,0,0.30); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.live-region {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden; clip: rect(0,0,0,0);
}

/* ── Page chrome (Nav) ──────────────────────────────────────
   Mirrors the Street-To-Stardom main website's sticky nav.
   Brand-block left · stepper lozenge / route links center · theme toggle + CTA right.
   We keep the legacy `.bar` class name so the existing React TopBar continues to work. */
.page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

.bar {
  position: sticky;
  top: 0;
  z-index: 60;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid var(--hairline);
  transition: background var(--t-med) ease, border-color var(--t-med) ease, color var(--t-med) ease;
}
.bar-translucent {
  background: rgba(10,10,15,0.45);
  border-bottom-color: rgba(255,255,255,0.08);
  color: #fff;
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
}
.bar-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 14px var(--section-pad-x);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
}

/* Brand block — circular logo + name */
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: transparent;
  border: 0;
  padding: 0;
  color: inherit;
  flex-shrink: 0;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.brand-mark {
  display: block;
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #1791c8;
  overflow: hidden;
  transition: transform 200ms cubic-bezier(.3,.7,.4,1);
}
.brand-mark img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center 38%;
}
.brand:hover .brand-mark { transform: rotate(-8deg); }

.brand-text {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  line-height: 1.1;
}
.brand-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  color: var(--ink);
  transition: color var(--t-med) ease;
}
.bar-translucent .brand-name { color: #fff; }
.brand-sub {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.005em;
  transition: color var(--t-med) ease;
}
.bar-translucent .brand-sub { color: rgba(255,255,255,0.65); }

/* Right side of the bar (stepper lozenge + theme toggle + CTA) */
.bar-stage {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  flex-wrap: nowrap;
}

.lozenge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  transition: background var(--t-med) ease, color var(--t-med) ease, border-color var(--t-med) ease;
}
.lozenge .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 0 rgba(31,155,92,0.5);
  animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(31,155,92,0.5); }
  50% { box-shadow: 0 0 0 5px rgba(31,155,92,0); }
}
.bar-translucent .lozenge {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.16);
  color: #fff;
}

/* Crimson CTA — matches STS .nav-cta */
.bar-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  background: var(--crimson);
  color: #fff;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: background var(--t-fast) ease, transform var(--t-fast) ease;
}
.bar-cta:hover { background: var(--crimson-deep); transform: translateY(-1px); }
.bar-cta .ar { transition: transform var(--t-fast) ease; display: inline-block; }
.bar-cta:hover .ar { transform: translateX(2px); }

/* Afrovanguard external link */
.bar-ext {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding-left: 14px;
  border-left: 1px solid var(--hairline-strong);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  transition: color var(--t-fast) ease, border-color var(--t-med) ease;
}
.bar-ext:hover { color: var(--ink); }
.bar-ext svg { opacity: 0.7; }
.bar-translucent .bar-ext { color: rgba(255,255,255,0.7); border-left-color: rgba(255,255,255,0.2); }
.bar-translucent .bar-ext:hover { color: #fff; }

/* Theme toggle — 3-state segmented control */
.theme-toggle {
  display: inline-flex;
  padding: 3px;
  border: 1px solid var(--hairline);
  border-radius: var(--r-pill);
  background: var(--bg);
  gap: 2px;
  transition: background var(--t-med) ease, border-color var(--t-med) ease;
}
.theme-toggle button {
  appearance: none;
  width: 26px;
  height: 26px;
  border: 0;
  background: transparent;
  border-radius: 50%;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 150ms ease, color 150ms ease;
  padding: 0;
}
.theme-toggle button:hover { color: var(--ink); }
.theme-toggle button.on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(10,10,15,0.08), inset 0 0 0 1px var(--hairline);
}
.bar-translucent .theme-toggle {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.14);
}
.bar-translucent .theme-toggle button { color: rgba(255,255,255,0.65); }
.bar-translucent .theme-toggle button:hover { color: #fff; }
.bar-translucent .theme-toggle button.on {
  background: rgba(255,255,255,0.16);
  color: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.18);
}

/* ── Hero ─────────────────────────────────────────────────── */
.hero {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column;
  padding: 20px var(--section-pad-x) 64px;
  color: #fff;
  overflow: hidden;
  background: #06060B;
}
.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-bg img {
  width: 100%; height: 100%; object-fit: cover;
  /* The bg.png is the branded STS hero photo with its own dark vignette
     and brand overlay; keep colour intact, just modest contrast lift. */
  filter: contrast(1.05) saturate(1.05) brightness(0.55);
}
/* Heavy editorial scrim — the hero photo is meant to read as a faint,
   almost-imperceptible texture under the type, not as the subject. The
   overlay is deliberately near-opaque at the centre so the typography
   sits clean against ink. */
.hero-bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 20% 40%, rgba(7,50,247,0.55), transparent 65%),
    radial-gradient(ellipse at 80% 70%, rgba(200,16,46,0.35), transparent 65%),
    linear-gradient(180deg, rgba(6,6,11,0.92) 0%, rgba(6,6,11,0.78) 35%, rgba(6,6,11,0.86) 65%, rgba(6,6,11,0.98) 100%);
}

/* Hero top status strip */
.hero-status {
  position: relative; z-index: 3;
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; flex-wrap: wrap;
  padding: 12px 0 14px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.75);
}

/* Countdown band — sits between the hero and the main content. Dark
   ink panel so it reads as a strong transition: big weeks/days/hours
   numbers on the left, milestone grid stacking below on small screens
   or sitting beside on wide ones. Milestones come from the Sheet via
   /milestones.php and refresh on each page load. */
.countdown-band {
  position: relative;
  background: linear-gradient(180deg, #06060B 0%, #0A0A14 100%);
  color: #fff;
  padding: 36px var(--section-pad-x);
  border-top: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.countdown-band::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 12% 0%, rgba(7,50,247,0.18), transparent 55%),
    radial-gradient(ellipse at 88% 100%, rgba(200,16,46,0.12), transparent 55%);
}
.countdown-band__inner {
  position: relative;
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(280px, 1fr) 2fr;
  gap: 40px; align-items: center;
}
.countdown-band__main {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
}
.countdown-band__label {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(255,255,255,0.62);
}
.countdown-band__numbers {
  display: inline-flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.countdown-band__numbers .hcn {
  display: inline-flex; align-items: baseline; gap: 8px;
}
.countdown-band__numbers .hcn strong {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(40px, 6vw, 64px);
  letter-spacing: -0.025em; line-height: 1;
  color: #fff;
  text-shadow: 0 2px 24px rgba(7, 50, 247, 0.35);
}
.countdown-band__numbers .hcn em {
  font-style: normal;
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(255,255,255,0.62);
}
.countdown-band__numbers .hcn-sep {
  color: rgba(255,255,255,0.32);
  font-size: 28px; line-height: 1;
}
@media (max-width: 900px) {
  .countdown-band { padding: 28px var(--section-pad-x); }
  .countdown-band__inner { grid-template-columns: 1fr; gap: 22px; }
}
.hero-milestones {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
}
.hero-milestones .hm {
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 10px;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  transition: background var(--t-fast) ease, border-color var(--t-fast) ease;
}
.hero-milestones .hm:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.22); }
.hero-milestones .hm__weeks {
  font-family: var(--font-display); font-weight: 600;
  font-size: 20px; letter-spacing: -0.02em; line-height: 1;
  color: #fff;
  min-width: 44px;
}
.hero-milestones .hm__label {
  font-size: 12.5px; line-height: 1.35;
  color: rgba(255,255,255,0.86);
}
.hero-milestones .hm__tag {
  font-family: var(--font-mono);
  font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  white-space: nowrap;
}
.hero-milestones .hm--past {
  opacity: 0.55;
  background: rgba(255,255,255,0.02);
}
.hero-milestones .hm--past .hm__weeks { color: rgba(255,255,255,0.55); }
.hero-milestones .hm--past .hm__tag { color: rgba(255,255,255,0.40); }
@media (max-width: 720px) {
  .countdown-band__numbers { gap: 8px; }
  .countdown-band__numbers .hcn { gap: 6px; }
  .countdown-band__numbers .hcn-sep { display: none; }
  .hero-milestones { grid-template-columns: 1fr; gap: 8px; }
  .hero-milestones .hm { padding: 9px 10px; }
}
.hero-status-l, .hero-status-r { display: inline-flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.hero-status-item { display: inline-flex; align-items: center; gap: 8px; }
.hero-status-item strong { color: #fff; font-weight: 500; }
.hero-status-sep { width: 1px; height: 11px; background: rgba(255,255,255,0.2); }
.hero-status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #2ecc71;
  box-shadow: 0 0 0 0 rgba(46,204,113,0.55);
  animation: liveDot 2.2s ease-in-out infinite;
}
@keyframes liveDot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(46,204,113,0.55); }
  50% { box-shadow: 0 0 0 6px rgba(46,204,113,0); }
}

.hero-inner {
  position: relative; z-index: 2;
  flex: 1;
  display: flex; flex-direction: column; justify-content: center;
  max-width: 1280px; width: 100%; margin: 0 auto;
  padding: 64px 0 32px;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 14px;
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  margin-bottom: 32px;
}
.hero-eyebrow::before {
  content: ""; display: inline-block;
  width: 32px; height: 1px; background: currentColor; opacity: 0.55;
}
.hero-h {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(44px, 8vw, 116px);
  line-height: 1.0; letter-spacing: -0.035em;
  margin: 0 0 28px; max-width: 1080px;
  color: #fff;
  text-wrap: balance;
}
/* Mirrors the STS main website's hero-underline pattern:
   solid colour bar painted behind the descender line, no italic. */
.hero-h em {
  font-style: normal;
  font-weight: 600;
  color: #fff;
  background-image: linear-gradient(var(--crimson), var(--crimson));
  background-repeat: no-repeat;
  background-position: 0 92%;
  background-size: 100% 8px;
  padding-bottom: 4px;
  -webkit-text-fill-color: currentColor;
}
.hero-sub {
  font-size: clamp(16px, 1.35vw, 19px);
  line-height: 1.55;
  color: rgba(255,255,255,0.78);
  max-width: 620px;
  margin: 0 0 40px;
  text-wrap: pretty;
}
.hero-cta-group {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  margin-bottom: 52px;
}
.hero-cta-primary {
  display: inline-flex; align-items: center; gap: 12px;
  min-height: 52px;
  padding: 14px 22px 14px 26px;
  background: #fff; color: var(--ink);
  border-radius: var(--r-pill);
  font-weight: 600; font-size: 15px;
  transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-med) ease, background var(--t-fast) ease;
  box-shadow: 0 8px 32px -8px rgba(0,0,0,0.4);
}
.hero-cta-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 48px -8px rgba(7,50,247,0.45);
  background: color-mix(in srgb, #fff 95%, var(--accent));
}
.hero-cta-primary:active { transform: translateY(0); }
.hero-cta-primary .cta-arrow {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px;
  background: var(--ink); color: var(--bg);
  border-radius: 50%; font-size: 11px;
  transition: transform var(--t-med) ease;
}
.hero-cta-primary:hover .cta-arrow { transform: translateY(2px); }

.hero-cta-secondary {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 52px;
  padding: 12px 18px;
  background: transparent;
  color: rgba(255,255,255,0.88);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: var(--r-pill);
  font-size: 14.5px; font-weight: 500;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease, color var(--t-fast) ease;
}
.hero-cta-secondary:hover {
  border-color: rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.06);
  color: #fff;
}
.hero-cta-secondary .play-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(255,255,255,0.16);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px;
  padding-left: 1px;
}

/* Hero capacity bar */
.hero-capacity {
  margin-bottom: 48px; max-width: 760px;
}
.hero-capacity-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px; flex-wrap: wrap;
  margin-bottom: 12px;
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}
.hero-capacity-head strong {
  font-family: var(--font-display); font-weight: 600;
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
  color: rgba(255,255,255,0.95);
}
.hero-capacity-track { display: flex; gap: 4px; }
.hero-cap-cell {
  flex: 1; height: 8px;
  border-radius: 3px;
  background: rgba(255,255,255,0.13);
  position: relative;
  cursor: default;
  transition: transform var(--t-fast) ease;
}
.hero-cap-cell.reserved { background: rgba(255,255,255,0.4); }
.hero-cap-cell.honoured { background: var(--accent-2); opacity: 0.75; }
.hero-cap-cell.open { background: var(--accent); }
.hero-cap-cell.recommended { background: var(--accent); box-shadow: 0 0 0 2px rgba(255,255,255,0.22); }
.hero-cap-cell:hover { transform: scaleY(1.6); }
.hero-cap-cell::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%);
  background: var(--ink); color: var(--bg);
  padding: 6px 10px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-fast) ease;
}
.hero-cap-cell:hover::after,
.hero-cap-cell:focus::after { opacity: 1; }

/* Hero stats */
.hero-stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 0;
  padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.14);
}
.hs {
  padding: 0 28px;
  border-right: 1px solid rgba(255,255,255,0.12);
  display: flex; flex-direction: column; gap: 8px;
}
.hs:first-child { padding-left: 0; }
.hs:last-child { border-right: 0; padding-right: 0; }
.hs-n {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(36px, 4vw, 56px); line-height: 1; letter-spacing: -0.025em;
  color: #fff;
}
.hs-l {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: rgba(255,255,255,0.55);
  line-height: 1.5;
}

/* Hero peers */
.hero-peers {
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.10);
}
.hero-peers-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px; flex-wrap: wrap;
  margin-bottom: 18px;
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}
.hero-peers-head strong {
  font-family: var(--font-display); font-weight: 600;
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
  color: rgba(255,255,255,0.9);
}
.hero-peers-track {
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}
.hero-peers-row {
  display: flex; gap: 36px;
  width: max-content;
  animation: peerScroll 42s linear infinite;
}
.hero-peers:hover .hero-peers-row,
.hero-peers:focus-within .hero-peers-row { animation-play-state: paused; }
@keyframes peerScroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.hero-peer {
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
  padding: 8px 16px 8px 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r-pill);
  transition: background var(--t-fast) ease, border-color var(--t-fast) ease;
}
.hero-peer:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.22); }
.hero-peer-init {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display-2); font-weight: 600;
  font-size: 13px; color: #fff;
}
.hero-peer-meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.hero-peer-name { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; }
.hero-peer-title { font-size: 11px; color: rgba(255,255,255,0.6); white-space: nowrap; }

/* Hero scroll cue */
.hero-scroll-cue {
  position: absolute; left: 50%; bottom: 22px;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: rgba(255,255,255,0.55);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
  transition: color var(--t-fast) ease;
  z-index: 4;
}
.hero-scroll-cue:hover { color: #fff; }
.hero-scroll-cue .cue-arrow {
  width: 22px; height: 22px;
  border: 1px solid currentColor; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px;
  animation: cueBounce 2.4s ease-in-out infinite;
}
@keyframes cueBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(4px); }
}

/* ── Main stage ────────────────────────────────────────────── */
.stage {
  background: var(--bg);
  padding: var(--section-pad-y) var(--section-pad-x) 120px;
  flex: 1;
}
.wrap { max-width: 1320px; margin: 0 auto; }

/* Prelude */
.prelude {
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 64px;
  padding-bottom: 64px;
  margin-bottom: 56px;
  border-bottom: 1px solid var(--hairline);
  align-items: end;
}
.eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 18px;
}
.prelude-h {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(34px, 4.5vw, 64px); line-height: 1.05; letter-spacing: -0.025em;
  margin: 0 0 22px; text-wrap: balance;
}
.prelude-h em {
  font-style: normal; font-weight: 600;
  color: var(--ink);
  background-image: linear-gradient(var(--blue), var(--blue));
  background-repeat: no-repeat;
  background-position: 0 92%;
  background-size: 100% 6px;
  padding-bottom: 3px;
}
.prelude-lede {
  font-size: 17px; line-height: 1.55; color: var(--muted);
  max-width: 580px; margin: 0;
}
.prelude-meta {
  margin: 0; display: flex; flex-direction: column; gap: 14px;
}
.prelude-meta-row {
  display: grid; grid-template-columns: 120px 1fr;
  gap: 18px; align-items: baseline;
}
.prelude-meta-row dt {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2);
}
.prelude-meta-row dd {
  margin: 0;
  font-family: var(--font-display); font-weight: 500;
  font-size: 16px; letter-spacing: -0.01em;
}
.prelude-meta-row dd small {
  display: block; font-family: var(--font-body); font-size: 12.5px;
  color: var(--muted); margin-top: 3px;
}

/* Composer (form area + right rail) */
.composer { display: grid; grid-template-columns: 1.55fr 1fr; gap: 56px; align-items: start; }
.composer-left { min-width: 0; }
.composer-right { min-width: 0; }
.sticky-rail { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 18px; }

/* Stepper */
.stepper {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-bottom: 36px;
  position: relative;
}
/* Progress rail underneath the steps — sits behind the cards as a
   visual anchor so the form's overall progress is legible at a glance. */
.stepper::before {
  content: ""; position: absolute;
  left: 16px; right: 16px; top: 50%;
  height: 2px; background: var(--hairline);
  z-index: 0;
}
.step {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; gap: 6px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--r-md);
  text-align: left;
  min-height: 78px;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease, transform var(--t-fast) ease, box-shadow var(--t-fast) ease;
}
.step:not(:disabled):hover { border-color: var(--hairline-strong); transform: translateY(-1px); }
.step:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
}
.step .ix {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted-2);
  display: inline-flex; align-items: center; gap: 8px;
}
.step .ix-bar { width: 14px; height: 1px; background: currentColor; opacity: 0.4; }
.step .ttl {
  font-family: var(--font-display); font-weight: 500;
  font-size: 16px; letter-spacing: -0.012em; color: var(--ink);
}
.step .kicker { font-size: 12.5px; color: var(--muted); }
.step.on {
  border-color: var(--accent); background: var(--accent-tint);
  box-shadow: 0 4px 14px -6px color-mix(in srgb, var(--accent) 50%, transparent);
}
.step.on .ix, .step.on .ttl { color: var(--accent-deep); }
.step.done { border-color: color-mix(in srgb, var(--success) 35%, var(--hairline-strong)); background: color-mix(in srgb, var(--success) 6%, var(--surface)); }
.step.done .ix { color: var(--success); }
.step.done .ttl { color: var(--ink); }
.step.todo { opacity: 0.55; }
.step:disabled { cursor: not-allowed; }

/* Scene wrapper */
.scene-wrap { min-height: 460px; }
.scene {
  animation: sceneIn 460ms var(--ease-out) both;
}
@keyframes sceneIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.step-head { margin-bottom: 32px; }
.step-kicker {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 16px;
}
.step-title {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(28px, 3.5vw, 44px); letter-spacing: -0.02em;
  line-height: 1.1; margin: 0 0 14px; text-wrap: balance;
}
.step-title em {
  font-style: normal; font-weight: 600;
  color: var(--ink);
  background-image: linear-gradient(var(--blue), var(--blue));
  background-repeat: no-repeat;
  background-position: 0 92%;
  background-size: 100% 5px;
  padding-bottom: 2px;
}
.step-sub {
  font-size: 15.5px; line-height: 1.55; color: var(--muted);
  max-width: 660px; margin: 0; text-wrap: pretty;
}

/* Fields */
.fields { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
.field { grid-column: span 12; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.col-3 { grid-column: span 3; }
.field.col-5 { grid-column: span 5; }
.field.col-7 { grid-column: span 7; }
.field.col-9 { grid-column: span 9; }
.field.full { grid-column: 1 / -1; }
.field label {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  font-weight: 500;
}
.field label .opt {
  font-family: var(--font-body); text-transform: none;
  letter-spacing: 0; font-size: 11.5px; color: var(--muted-2); font-weight: 400;
}
.field label .ok-check {
  color: var(--success); font-family: var(--font-body); letter-spacing: 0;
  text-transform: none; font-size: 14px;
}
.field input, .field textarea, .field select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-md);
  padding: 14px 16px;
  font-size: 15px;
  color: var(--ink);
  font-family: var(--font-body);
  transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, background var(--t-fast) ease;
  min-height: 48px;
  outline: none;
}
.field input::placeholder, .field textarea::placeholder { color: var(--muted-2); }
.field input:hover, .field textarea:hover { border-color: var(--ink-soft); }
.field input:focus, .field textarea:focus, .field input:focus-visible, .field textarea:focus-visible {
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
}
.field textarea { min-height: 100px; resize: vertical; line-height: 1.55; }
.field.err input, .field.err textarea { border-color: var(--error); background: var(--crimson-tint); }
.field.err input:focus, .field.err textarea:focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--error) 22%, transparent); }
.field.ok input, .field.ok textarea { border-color: color-mix(in srgb, var(--success) 50%, var(--hairline-strong)); }
.field-hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
.err-text {
  font-size: 12.5px; color: var(--error);
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 2px;
}
.err-text::before { content: "⚠"; font-size: 11px; }

/* ── Photo upload (optional) ─────────────────────────────── */
.photo-upload {
  display: flex; flex-direction: column; gap: 12px;
}
.photo-upload.has-photo { flex-direction: row; align-items: stretch; gap: 16px; }
.photo-upload-drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 138px;
  padding: 20px;
  background: var(--bg-sunken);
  border: 1.5px dashed var(--hairline-strong);
  border-radius: var(--r-md);
  color: var(--muted);
  cursor: pointer;
  text-align: center;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease, color var(--t-fast) ease;
}
.photo-upload-drop:hover, .photo-upload-drop.dragover {
  border-color: var(--blue);
  background: var(--blue-tint);
  color: var(--blue);
}
.photo-upload-drop:disabled { cursor: progress; opacity: 0.7; }
.photo-upload-icon { display: inline-flex; }
.photo-upload-text { font-weight: 600; font-size: 14px; }
.photo-upload-hint { font-size: 11.5px; color: var(--muted); }
.photo-upload-preview {
  width: 110px; height: 110px;
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--bg-sunken);
  border: 1px solid var(--hairline-strong);
  flex-shrink: 0;
}
.photo-upload-preview img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.photo-upload-actions {
  display: flex; flex-direction: column; gap: 8px;
  justify-content: center;
  flex: 1;
}
/* Real-time progress for AI operations on the photo */
.photo-upload-progress {
  margin-top: 6px;
  font-size: 11.5px;
  color: var(--muted);
  display: flex; flex-direction: column; gap: 4px;
}
.photo-upload-progress-bar {
  height: 4px;
  background: var(--bg-sunken);
  border-radius: 999px;
  overflow: hidden;
}
.photo-upload-progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--crimson));
  border-radius: 999px;
  transition: width 0.3s ease;
}
.photo-upload-btn {
  appearance: none;
  padding: 9px 14px;
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-pill);
  font-family: var(--font-body); font-weight: 500; font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  transition: background var(--t-fast) ease, border-color var(--t-fast) ease, color var(--t-fast) ease;
  text-align: center;
}
.photo-upload-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.photo-upload-btn-primary {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.photo-upload-btn-primary:hover:not(:disabled) {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.photo-upload-btn-danger:hover:not(:disabled) { border-color: var(--crimson); color: var(--crimson); }
.photo-upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.photo-upload-preview.transparent {
  /* Checkerboard so a transparent PNG reads as transparent */
  background-color: #fff;
  background-image:
    linear-gradient(45deg, #e5e5e5 25%, transparent 25%),
    linear-gradient(-45deg, #e5e5e5 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e5e5e5 75%),
    linear-gradient(-45deg, transparent 75%, #e5e5e5 75%);
  background-size: 12px 12px;
  background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
}

.autosave-row {
  margin-top: 16px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.06em; color: var(--muted);
  display: inline-flex; align-items: center; gap: 8px;
}
.autosave-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--success);
  animation: pulseDot 2.2s ease-in-out infinite;
}

/* ── Buttons ───────────────────────────────────────────────
   Mirrors STS website: crimson primary pill with shadow, blue outline secondary. */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 0 22px;
  height: 48px;
  border-radius: var(--r-pill);
  font-size: 15px; font-weight: 600;
  letter-spacing: -0.005em;
  font-family: var(--font-body);
  border: 1.5px solid transparent;
  white-space: nowrap;
  transition: background var(--t-fast) ease, color var(--t-fast) ease, border-color var(--t-fast) ease, transform var(--t-fast) ease, box-shadow var(--t-med) ease;
}
.btn-primary {
  background: var(--crimson);
  color: #fff;
  box-shadow: var(--shadow-float);
}
.btn-primary:hover:not(:disabled) { background: var(--crimson-deep); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0) scale(0.98); }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
.btn-secondary {
  background: transparent;
  color: var(--blue);
  border-color: var(--blue);
}
.btn-secondary:hover:not(:disabled) { background: var(--blue); color: #fff; }
.btn-ghost {
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--hairline-strong);
  padding: 0 18px;
}
.btn-ghost:hover:not(:disabled) { color: var(--blue); border-color: var(--blue); }
.btn-ghost:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost-light {
  background: rgba(255,255,255,0.06);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
}
.btn-ghost-light:hover { background: rgba(255,255,255,0.12); }
.btn-light { background: #fff; color: var(--ink); }
.btn-light:hover:not(:disabled) { background: var(--bg-sunken); }
.btn-arrow { transition: transform var(--t-med) cubic-bezier(.3,.7,.4,1); display: inline-block; }
.btn:hover .btn-arrow { transform: translateX(3px); }
.btn:hover .btn-arrow.back { transform: translateX(-3px); }
.btn-final {
  background: var(--crimson);
  color: #fff;
  box-shadow: 0 12px 32px -8px rgba(200,16,46,0.45), 0 2px 6px rgba(10,10,15,0.05);
}
.btn-final:hover:not(:disabled) {
  background: var(--crimson-deep);
  box-shadow: 0 16px 40px -8px rgba(200,16,46,0.55), 0 4px 12px rgba(10,10,15,0.08);
  transform: translateY(-1px);
}

.actions {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  margin-top: 36px;
  padding-top: 28px;
  border-top: 1px solid var(--hairline);
}

.composer-foot {
  margin-top: 24px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--muted); letter-spacing: 0.06em;
}
.autosave { display: inline-flex; align-items: center; gap: 8px; }

/* ── Centres grid ─────────────────────────────────────────── */
.centres { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.centre {
  position: relative;
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-lg);
  text-align: left;
  overflow: hidden;
  transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, transform var(--t-fast) ease;
  cursor: pointer;
}
.centre:not(:disabled):hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: var(--shadow-soft); }
.centre.on { border-color: var(--accent); box-shadow: var(--shadow-ring); background: var(--accent-tint); }
.centre.honoured { cursor: not-allowed; opacity: 0.78; }
.centre.honoured:hover { transform: none; }
.centre-photo {
  position: relative;
  aspect-ratio: 16 / 10;
  background: var(--bg-sunken);
  overflow: hidden;
}
.centre-photo::before {
  /* Subtle texture — radial highlights add depth without an image */
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 25% 20%, rgba(255,255,255,0.18), transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(0,0,0,0.30), transparent 60%);
  pointer-events: none;
}
.centre-photo::after {
  /* Crimson STS accent stripe */
  content: "";
  position: absolute;
  top: 0; left: 24px;
  width: 3px; height: 32px;
  background: var(--crimson);
}
.centre-photo-mono {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(54px, 7vw, 86px);
  color: rgba(255,255,255,0.88);
  letter-spacing: -0.02em;
  text-shadow: 0 2px 8px rgba(0,0,0,0.30);
}
.centre-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 6px; }
.centre-top {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
.centre-pill {
  padding: 4px 10px;
  background: var(--bg-sunken); border-radius: var(--r-pill);
  font-size: 10px; letter-spacing: 0.06em;
}
.centre-pill.honoured-pill { background: var(--accent-2-tint); color: var(--crimson-deep); font-weight: 500; }
.centre-name { font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: -0.018em; }
.centre-focus { font-size: 13.5px; color: var(--accent); font-weight: 500; }
.centre-bio { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: 6px 0 12px; }
.centre-foot {
  display: flex; gap: 18px; align-items: flex-end;
  padding-top: 12px;
  border-top: 1px solid var(--hairline);
}
.centre-stat { display: flex; flex-direction: column; gap: 2px; }
.centre-stat-n {
  font-family: var(--font-display); font-weight: 500; font-size: 18px;
  letter-spacing: -0.015em; color: var(--ink);
}
.centre-stat-l { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.centre-stat.right { margin-left: auto; text-align: right; }
.select-chip {
  padding: 7px 12px;
  background: var(--ink); color: var(--bg);
  border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  text-transform: none;
}
.centre.on .select-chip { background: var(--accent); }

/* AI Match Badge */
.ai-match-badge {
  position: absolute; top: 12px; right: 12px; z-index: 3;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px 5px 8px;
  background: var(--accent); color: #fff;
  border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
  box-shadow: 0 4px 12px -2px rgba(7,50,247,0.4);
}
.ai-match-badge.runner-up { background: var(--accent-2); box-shadow: 0 4px 12px -2px rgba(200,16,46,0.4); }
.ai-match-badge .badge-icon { font-size: 11px; }

/* ── Date legend + weeks ──────────────────────────────────── */
.legend {
  display: flex; gap: 18px; flex-wrap: wrap;
  margin-bottom: 22px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--muted); letter-spacing: 0.04em;
}
.lg { display: inline-flex; align-items: center; gap: 7px; }
.lg-sw { width: 12px; height: 12px; border-radius: 3px; background: var(--bg-sunken); border: 1px solid var(--hairline-strong); }
.lg-open { background: var(--surface); }
.lg-rec { background: var(--accent-tint); border-color: var(--accent); }
.lg-res { background: var(--bg-sunken); }
.lg-on { background: var(--accent); border-color: var(--accent); }

/* ── Provisional-date notice — used in StepDate, StepReview, Confirmation ── */
.provisional-notice {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; margin-bottom: 22px;
  background: color-mix(in srgb, var(--warning) 10%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--warning) 35%, var(--hairline-strong));
  border-radius: var(--r-md);
}
.provisional-notice__icon {
  flex: 0 0 auto; width: 20px; height: 20px; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  color: var(--warning);
}
.provisional-notice__body { flex: 1; min-width: 0; line-height: 1.5; }
.provisional-notice__title {
  font-weight: 600; font-size: 13px; color: var(--ink); margin-bottom: 3px;
  letter-spacing: -0.005em;
}
.provisional-notice__text { font-size: 12.5px; color: var(--ink-soft, var(--muted)); }
.provisional-notice__text strong { color: var(--ink); font-weight: 600; }
.provisional-notice--compact { padding: 11px 14px; margin-bottom: 16px; }
.provisional-notice--compact .provisional-notice__title { font-size: 12.5px; }
.provisional-notice--compact .provisional-notice__text { font-size: 12px; }
:root[data-theme="dark"] .provisional-notice {
  background: color-mix(in srgb, var(--warning) 14%, var(--surface));
  border-color: color-mix(in srgb, var(--warning) 40%, var(--hairline-strong));
}

.weeks { display: flex; flex-direction: column; gap: 18px; }
.week { display: flex; flex-direction: column; }
.week-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 0 0 10px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.week-head strong { font-family: var(--font-display); font-size: 13px; letter-spacing: -0.005em; color: var(--ink); text-transform: none; }
.days { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--hairline-strong); border-radius: var(--r-lg); overflow: hidden; }
.day {
  position: relative;
  padding: 18px 20px 20px;
  background: var(--surface);
  border-right: 1px solid var(--hairline);
  cursor: pointer;
  transition: background var(--t-fast) ease;
  min-height: 130px;
  display: flex; flex-direction: column; gap: 6px;
}
.day:last-child { border-right: 0; }
.day:hover:not(.reserved) { background: var(--bg-sunken); }
.day.on { background: var(--accent); color: #fff; }
.day.on .day-meta, .day.on .day-theme small { color: rgba(255,255,255,0.78); }
.day.on .day-check { opacity: 1; }
.day.rec { background: var(--accent-tint); }
.day.reserved { background: var(--bg-sunken); cursor: not-allowed; }
.day.reserved::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,0,0,0.025) 8px, rgba(0,0,0,0.025) 10px);
  pointer-events: none;
}
.day-check {
  position: absolute; top: 14px; right: 16px;
  width: 22px; height: 22px;
  border-radius: 50%; background: rgba(255,255,255,0.18);
  display: grid; place-items: center;
  color: #fff; font-size: 12px;
  opacity: 0; transition: opacity var(--t-fast) ease;
}
.day-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.day-date { font-family: var(--font-display); font-weight: 500; font-size: 19px; letter-spacing: -0.012em; }
.day-theme { font-size: 13px; color: var(--ink-soft); }
.day-theme small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.day-reserved-by {
  display: flex; align-items: center; gap: 10px;
  margin-top: auto; padding-top: 10px;
  border-top: 1px solid var(--hairline-strong);
  font-size: 12px;
}
.day-reserved-init {
  width: 30px; height: 30px;
  background: var(--ink); color: var(--bg);
  border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 500; font-size: 11px;
  flex-shrink: 0;
}
.day-reserved-by strong { display: block; color: var(--ink); font-weight: 600; font-size: 12.5px; }
.day-reserved-by small { color: var(--muted); font-size: 11px; }
.rec-flag {
  position: absolute; top: 14px; left: 18px;
  padding: 3px 8px;
  background: var(--accent); color: #fff;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
  border-radius: 4px;
}

/* ── Review summary ───────────────────────────────────────── */
.review {
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-lg);
  padding: 32px 36px;
}
.review h4 {
  margin: 0 0 22px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
}
.review dl { margin: 0; display: flex; flex-direction: column; gap: 18px; }
.review-line {
  display: grid; grid-template-columns: 130px 1fr;
  gap: 24px; align-items: baseline;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--hairline);
}
.review-line:last-child { padding-bottom: 0; border-bottom: 0; }
.review-line dt {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.review-line dd {
  margin: 0;
  font-family: var(--font-display); font-weight: 500;
  font-size: 18px; letter-spacing: -0.012em;
}
.review-line dd small {
  display: block; font-family: var(--font-body); font-size: 13px;
  color: var(--muted); font-weight: 400; margin-top: 3px;
}

/* ── Legacy Card (right rail) ─────────────────────────────── */
.legacy {
  /* Always-dark — this card represents the deliverable which is always
     dark photographic. Using var(--ink) inverts it in dark mode and the
     white text disappears. Lock to the dark-side palette here. */
  background: #0A0A0F;
  color: #fff;
  border-radius: var(--r-lg);
  overflow: hidden;
  position: relative;
  transition: transform var(--t-slow) var(--ease-out);
  transform-style: preserve-3d;
}
.legacy-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(7,50,247,0.35), transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(200,16,46,0.18), transparent 60%);
  pointer-events: none;
}
.legacy-inner { position: relative; padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 18px; }
.legacy-header {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.14);
}
.legacy-eyebrow {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.55);
}
.legacy-eyebrow strong { color: #fff; font-weight: 500; }
.legacy-status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: rgba(255,255,255,0.08);
  border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.06em; color: rgba(255,255,255,0.75);
}
.legacy-status.confirmed { background: rgba(31,155,92,0.18); color: #5ee2a6; }
.legacy-status .sdot {
  width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  animation: pulseDot 2.2s ease-in-out infinite;
}
.legacy-portrait {
  align-self: center;
  width: 72px; height: 72px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; font-size: 24px;
  letter-spacing: -0.01em; color: #fff;
  margin-top: 4px;
}
.portrait-init { font-style: normal; }
.legacy-name {
  text-align: center;
  font-family: var(--font-display); font-weight: 600;
  font-size: 20px; letter-spacing: -0.015em; line-height: 1.2;
  margin: 0;
}
.legacy-name.pending { color: rgba(255,255,255,0.4); font-style: italic; }
.legacy-title {
  text-align: center;
  font-size: 12.5px;
  color: rgba(255,255,255,0.62);
  margin: -6px 0 4px;
}
.legacy-title.pending { color: rgba(255,255,255,0.3); font-style: italic; }
.legacy-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  padding-top: 14px; padding-bottom: 14px;
  border-top: 1px solid rgba(255,255,255,0.14);
  border-bottom: 1px solid rgba(255,255,255,0.14);
}
.lf { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lf-key {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}
.lf-val {
  font-family: var(--font-display); font-weight: 500; font-size: 14px;
  letter-spacing: -0.005em; color: #fff;
  display: flex; flex-direction: column; gap: 2px;
}
.lf-val.pending { color: rgba(255,255,255,0.4); font-style: italic; font-weight: 400; }
.lf-val small { font-family: var(--font-body); font-weight: 400; font-size: 11px; color: rgba(255,255,255,0.55); font-style: normal; }
.legacy-quote {
  font-family: var(--font-display); font-weight: 500;
  font-size: 13.5px; line-height: 1.5;
  letter-spacing: -0.005em;
  color: rgba(255,255,255,0.82);
  margin: 0; text-align: center;
}
.legacy-quote em { color: var(--accent); font-style: normal; font-weight: 600; }
.legacy-seal {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.14);
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.08em; color: rgba(255,255,255,0.45);
}
.crest {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display-2); font-weight: 700; font-size: 12px;
  color: #fff;
}
.legacy-large .legacy-inner { padding: 36px 36px 28px; }
.legacy-large .legacy-portrait { width: 96px; height: 96px; font-size: 32px; }
.legacy-large .legacy-name { font-size: 28px; }
.legacy-large .lf-val { font-size: 15px; }

/* Peers panel */
.peers {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  padding: 22px 24px;
}
.peers h5 {
  margin: 0 0 14px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; align-items: baseline;
}
.peers h5 span { color: var(--accent); font-weight: 500; }
.peers-list { display: flex; flex-direction: column; gap: 16px; }
.peers-list li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; }
.peer-init {
  width: 36px; height: 36px;
  background: var(--bg-sunken); color: var(--ink);
  border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 500; font-size: 12px;
}
.peer-name strong { display: block; font-size: 13.5px; font-weight: 600; }
.peer-name small { display: block; font-size: 11.5px; color: var(--muted); }
.peer-where { text-align: right; }
.peer-status { font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: 0.04em; }
.peer-where small { display: block; font-size: 11px; color: var(--muted); }
.peers-foot {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--hairline);
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.06em; color: var(--muted);
}

/* ── AI Panels ────────────────────────────────────────────── */
.ai-panel {
  position: relative;
  background: linear-gradient(135deg, var(--accent-tint), color-mix(in srgb, var(--accent-tint) 35%, var(--surface)));
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--hairline));
  border-radius: var(--r-lg);
  padding: 20px 22px;
  margin-bottom: 24px;
  overflow: hidden;
}
.ai-panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
  background-size: 200% 100%;
  animation: aiShimmer 3.5s ease-in-out infinite;
}
@keyframes aiShimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
.ai-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep);
}
.ai-spark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  background: var(--accent); color: #fff;
  border-radius: 6px; font-size: 12px;
}
.ai-rec { display: flex; flex-direction: column; gap: 10px; }
.ai-rec-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--hairline);
  border-radius: var(--r-md);
  text-align: left;
  cursor: pointer;
  width: 100%;
  transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, transform var(--t-fast) ease;
}
.ai-rec-item:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 16px -4px rgba(7,50,247,0.25);
  transform: translateY(-1px);
}
.ai-rec-rank {
  flex-shrink: 0;
  width: 28px; height: 28px;
  background: var(--accent); color: #fff;
  border-radius: 8px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; font-size: 14px;
}
.ai-rec-rank.runner { background: var(--accent-2); }
.ai-rec-body { flex: 1; min-width: 0; }
.ai-rec-centre {
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  letter-spacing: -0.01em; color: var(--ink); margin-bottom: 3px;
}
.ai-rec-reason { font-size: 13px; color: var(--muted); line-height: 1.45; }
.ai-rec-select { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--accent); margin-top: 6px; }
.ai-personal-note {
  font-family: var(--font-display); font-weight: 500; font-size: 14px;
  color: var(--ink-soft); margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid color-mix(in srgb, var(--accent) 15%, var(--hairline));
  line-height: 1.5;
}
.ai-loading {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 0 4px;
  font-size: 13px; color: var(--muted);
}
.ai-dots { display: inline-flex; gap: 4px; }
.ai-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0.4; animation: dotPulse 1.2s ease-in-out infinite; }
.ai-dots span:nth-child(2) { animation-delay: 0.15s; }
.ai-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes dotPulse {
  0%, 80%, 100% { opacity: 0.4; transform: scale(1); }
  40% { opacity: 1; transform: scale(1.2); }
}
.ai-note-chips { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.ai-note-chip {
  display: block; width: 100%; text-align: left;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--hairline);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  font-size: 13px; color: var(--ink-soft);
  line-height: 1.45;
  cursor: pointer;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease;
}
.ai-note-chip:hover { border-color: var(--accent); background: var(--accent-tint); }

/* AI brief (on confirmation) */
.ai-brief {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: var(--r-lg);
  padding: 26px 28px 24px;
  color: #fff;
}
.ai-brief-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
}
.ai-brief-greeting {
  font-family: var(--font-display); font-weight: 500;
  font-size: 17px; letter-spacing: -0.01em;
  color: rgba(255,255,255,0.92); margin-bottom: 18px; line-height: 1.4;
}
.ai-brief-section-title {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.5);
  margin: 16px 0 8px;
}
.ai-brief-point {
  padding: 10px 0;
  font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.55;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.ai-brief-point:last-child { border-bottom: 0; }
.ai-brief-highlight {
  padding: 14px 16px;
  background: rgba(255,255,255,0.05);
  border-radius: var(--r-md);
  border-left: 3px solid var(--accent);
  margin: 10px 0;
}
.ai-brief-highlight-label {
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
}
.ai-brief-highlight-text {
  font-family: var(--font-display); font-weight: 500; font-size: 15px;
  letter-spacing: -0.005em;
  color: rgba(255,255,255,0.9); line-height: 1.45;
}
.ai-share-tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
.ai-share-tab {
  padding: 8px 14px;
  border-radius: var(--r-pill);
  border: 1px solid rgba(255,255,255,0.18);
  background: transparent; color: rgba(255,255,255,0.62);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  cursor: pointer;
  transition: all var(--t-fast) ease;
}
.ai-share-tab:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
.ai-share-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.ai-share-copy {
  position: relative;
  background: rgba(0,0,0,0.32);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--r-md);
  padding: 18px 18px 48px;
  font-size: 14px; line-height: 1.6;
  color: rgba(255,255,255,0.85);
  white-space: pre-wrap;
  min-height: 80px;
}
.ai-share-copy-btn {
  position: absolute; bottom: 10px; right: 10px;
  padding: 6px 16px;
  border-radius: var(--r-pill);
  background: var(--accent); color: #fff;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.04em;
  transition: background var(--t-fast) ease, transform 100ms ease;
}
.ai-share-copy-btn:hover { background: var(--accent-deep); }
.ai-share-copy-btn:active { transform: scale(0.96); }

/* ── Confirmation scene ───────────────────────────────────── */
.page-confirm { background: #06060B; color: #fff; min-height: 100vh; min-height: 100dvh; }
.confirm {
  position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden;
  padding: 64px var(--section-pad-x);
}
.confirm-bg { position: absolute; inset: 0; z-index: 0; }
.confirm-bg img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05) saturate(1.05); }
.confirm-bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(7,50,247,0.32), transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(200,16,46,0.18), transparent 60%),
    linear-gradient(180deg, rgba(6,6,11,0.50), rgba(6,6,11,0.82));
}
.confirm-inner {
  position: relative; z-index: 2;
  max-width: 1320px; margin: 0 auto;
}
.confirm-reveal {
  text-align: center; max-width: 760px; margin: 0 auto;
  transition: opacity var(--t-slow) ease, transform var(--t-slow) var(--ease-out);
  animation: confirmIn 800ms var(--ease-out) both;
}
@keyframes confirmIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.confirm-reveal.compact { padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,0.10); }
.confirm-reveal.compact .confirm-trophy {
  max-width: 320px; aspect-ratio: 1200 / 630;
  margin-bottom: 24px;
  opacity: 0.95;
  transition: max-width var(--t-slow) var(--ease-out), opacity var(--t-slow) ease;
}

/* Trophy moment — the og-image hero strip celebrating confirmation */
.confirm-trophy {
  position: relative;
  max-width: 720px;
  margin: 0 auto 40px;
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: 0 40px 80px -32px rgba(7,50,247,0.45),
              0 8px 24px rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.10);
  background: #06060B;
  aspect-ratio: 1200 / 630;
  animation: trophyIn 900ms var(--ease-out) both;
}
@keyframes trophyIn {
  from { opacity: 0; transform: translateY(24px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.confirm-trophy img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.confirm-trophy::after {
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(6,6,11,0.05) 0%, rgba(6,6,11,0.55) 100%);
  pointer-events: none;
}
.confirm-trophy-caption {
  position: absolute; left: 24px; bottom: 18px; right: 24px;
  z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  color: rgba(255,255,255,0.96);
  font-family: var(--font-display);
  font-weight: 600; font-size: 13px;
  letter-spacing: 0.08em; text-transform: uppercase;
  text-shadow: 0 1px 2px rgba(0,0,0,0.45);
}
.confirm-trophy-caption .who {
  display: inline-flex; align-items: center; gap: 8px;
}
.confirm-trophy-caption .who::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--crimson);
  border-radius: 50%;
}
.confirm-trophy-caption .ref {
  font-family: var(--font-mono);
  font-weight: 400; font-size: 11px;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.72);
  text-transform: none;
}

.confirm-eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 14px;
}
.confirm-h {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(38px, 5vw, 72px); line-height: 1.05; letter-spacing: -0.03em;
  margin: 0 0 18px;
}
.confirm-h em {
  font-style: normal; font-weight: 600;
  color: #fff;
  background-image: linear-gradient(var(--crimson), var(--crimson));
  background-repeat: no-repeat;
  background-position: 0 92%;
  background-size: 100% 8px;
  padding-bottom: 4px;
}
.confirm-sub {
  font-size: 16px; line-height: 1.55; color: rgba(255,255,255,0.75);
  max-width: 560px; margin: 0 auto 28px;
}
.confirm-meta {
  display: flex; justify-content: center; gap: 28px;
  flex-wrap: wrap; padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.10);
}
.confirm-meta div { display: flex; flex-direction: column; gap: 4px; text-align: left; }
.confirm-meta dt {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.55);
}
.confirm-meta dd { margin: 0; font-family: var(--font-display); font-size: 16px; letter-spacing: -0.005em; }
.confirm-meta-tag {
  margin-left: 6px; font-family: var(--font-mono); font-size: 8.5px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--warning, #f7c860); background: rgba(247,200,96,0.14);
  border: 1px solid rgba(247,200,96,0.35); border-radius: 999px;
  padding: 2px 6px; vertical-align: middle;
}
.confirm-next-steps {
  margin: 28px auto 0; padding-top: 24px; max-width: 560px; text-align: left;
  border-top: 1px solid rgba(255,255,255,0.10);
}
.confirm-next-steps__head {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.55);
  margin-bottom: 14px;
}
.confirm-next-steps__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.confirm-next-steps__list li { display: flex; gap: 12px; align-items: flex-start; }
.confirm-next-steps__num {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; color: #fff;
}
.confirm-next-steps__list li > div { display: flex; flex-direction: column; gap: 2px; padding-top: 1px; }
.confirm-next-steps__list li strong { font-size: 14px; color: #fff; font-weight: 600; letter-spacing: -0.005em; }
.confirm-next-steps__list li span { font-size: 12.5px; color: rgba(255,255,255,0.6); line-height: 1.5; }
@media (max-width: 640px) {
  .confirm-next-steps { padding-top: 20px; }
  .confirm-meta-tag { display: block; margin-left: 0; margin-top: 3px; width: max-content; }
}
.confirm-stage-2 {
  opacity: 0; transform: translateY(20px);
  transition: opacity 700ms ease 200ms, transform 700ms var(--ease-out) 200ms;
}
.confirm-stage-2.visible { opacity: 1; transform: translateY(0); }
.confirm-grid {
  display: grid; grid-template-columns: 1fr 1.3fr; gap: 36px;
  margin-top: 48px;
}
.confirm-card-wrap { display: flex; flex-direction: column; gap: 16px; }
.deliverables {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}
.deliverable {
  position: relative;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r-md);
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease;
  cursor: pointer;
}
.deliverable:hover { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); }
.deliverable-ix {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
}
.deliverable-t {
  font-family: var(--font-display); font-weight: 500;
  font-size: 16px; letter-spacing: -0.012em; color: #fff;
}
.deliverable-d { font-size: 12.5px; color: rgba(255,255,255,0.65); line-height: 1.5; }
.deliverable-cta {
  margin-top: auto; padding-top: 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--accent); letter-spacing: 0.05em;
}

/* Locked deliverable — subtle treatment, lock chip top-right, crimson CTA */
.deliverable.locked {
  background: rgba(255,255,255,0.025);
  border-style: dashed;
  border-color: rgba(255,255,255,0.20);
}
.deliverable.locked:hover {
  border-color: rgba(255,255,255,0.45);
  background: rgba(255,255,255,0.06);
}
.deliverable.locked .deliverable-t { color: rgba(255,255,255,0.80); }
.deliverable.locked .deliverable-d { color: rgba(255,255,255,0.55); }
.deliverable.locked .deliverable-cta {
  color: rgba(255,255,255,0.78);
  font-weight: 600;
}
.deliverable.locked:hover .deliverable-cta { color: #fff; }
.deliverable-lock {
  position: absolute;
  top: 14px; right: 14px;
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.22);
  color: rgba(255,255,255,0.78);
  border-radius: 50%;
}
.deliverable.locked:hover .deliverable-lock {
  background: rgba(255,255,255,0.16); color: #fff; border-color: rgba(255,255,255,0.45);
}

/* ── Donation banner — quiet, dignified call-to-attention ─── */
.donation-banner {
  position: relative;
  display: flex; align-items: center; gap: 18px;
  padding: 20px 22px;
  margin-bottom: 28px;
  border-radius: var(--r-lg);
  overflow: hidden;
  isolation: isolate;
}
.donation-banner__icon {
  flex-shrink: 0;
  width: 44px; height: 44px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg-sunken);
  color: var(--ink-soft);
}
.donation-banner__body { flex: 1; min-width: 0; line-height: 1.45; color: var(--ink); }
.donation-banner__head {
  font-family: var(--font-display); font-weight: 600;
  font-size: 17px; letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.donation-banner__sub {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.55;
}
.donation-banner__sub strong { color: var(--ink); font-weight: 600; }
.donation-banner__tier {
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.06em;
  color: var(--success);
  font-weight: 500;
}
.donation-banner__tier strong { color: var(--success); font-weight: 600; }
.donation-banner__cta {
  appearance: none;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 0 22px; height: 46px;
  background: var(--ink);
  color: var(--bg);
  border: 0; border-radius: var(--r-pill);
  font-family: var(--font-body); font-weight: 600; font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--t-fast) ease, transform var(--t-fast) ease;
  flex-shrink: 0;
}
.donation-banner__cta:hover { transform: translateY(-1px); }
.donation-banner__cta .btn-arrow { transition: transform var(--t-fast) ease; }
.donation-banner__cta:hover .btn-arrow { transform: translateY(2px); }

/* Locked variant — quiet ink panel with subtle gold-leaf accent */
.donation-banner--locked {
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  box-shadow: 0 1px 2px rgba(10,10,15,0.04), 0 8px 24px -16px rgba(10,10,15,0.08);
  animation: bannerIn 700ms var(--ease-out) both;
}
.donation-banner--locked .donation-banner__icon {
  background: var(--bg-sunken);
  color: var(--ink-soft);
  border: 1px solid var(--hairline-strong);
}
.donation-banner--locked .donation-banner__head { color: var(--ink); }
.donation-banner--locked .donation-banner__sub { color: var(--muted); }
.donation-banner--locked .donation-banner__sub strong { color: var(--ink); }

.donation-banner--locked .donation-banner__cta {
  background: var(--ink);
  color: var(--bg);
  box-shadow: 0 8px 20px -8px rgba(10,10,15,0.35);
}
.donation-banner--locked .donation-banner__cta:hover {
  background: var(--blue);
}

.donation-banner__pulse { display: none; } /* retired — too noisy */
@keyframes bannerIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Unlocked / success variant — quiet sage with a left rule */
.donation-banner--unlocked {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-left: 3px solid var(--success);
  box-shadow: 0 1px 2px rgba(10,10,15,0.04);
  animation: bannerIn 600ms var(--ease-out) both;
}
.donation-banner--unlocked .donation-banner__icon {
  background: rgba(31,155,92,0.12);
  color: var(--success);
}
.donation-banner--unlocked .donation-banner__head { color: var(--ink); }
.donation-banner--unlocked .donation-banner__sub { color: var(--muted); }

/* ── AI brief — locked teaser (calmer than before) ─────────── */
.ai-brief--locked {
  border: 1px solid var(--hairline-strong);
  background: var(--surface);
  border-left: 3px solid var(--ink);
}
.ai-brief-locked-body {
  display: flex; align-items: flex-start; gap: 12px;
  font-size: 13.5px; line-height: 1.55;
  color: rgba(255,255,255,0.82);
  margin: 6px 0 12px;
}
.ai-brief-locked-icon {
  flex-shrink: 0; margin-top: 1px;
  width: 30px; height: 30px;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.22);
  color: rgba(255,255,255,0.82);
  border-radius: 50%;
}
.ai-brief-locked-cta {
  appearance: none;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.10);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.28); border-radius: var(--r-pill);
  font-family: var(--font-body); font-weight: 600; font-size: 13px;
  cursor: pointer;
  transition: background var(--t-fast) ease, transform var(--t-fast) ease, border-color var(--t-fast) ease;
}
.ai-brief-locked-cta:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.45); transform: translateY(-1px); }

/* ── Support — highlight pulse + donated state ─────────────── */
.support--highlight {
  animation: supportPulse 1.6s var(--ease-out) 1;
}
@keyframes supportPulse {
