<style>
/* ─────────────────────────────────────────────────────────────────────
   STS · CEO Speaker Initiation v3 — production
   Light theme · cinematic hero · accessible · mobile-first.
   ───────────────────────────────────────────────────────────────────── */

:root {
  --bg: #FAFAF8;
  --bg-sunken: #F4F4F0;
  --surface: #FFFFFF;
  --surface-2: #FAFAF8;
  --ink: #0A0A0F;
  --ink-soft: #1A1A22;
  --muted: #6B6B70;
  --muted-2: #93939A;
  --hairline: #ECECEC;
  --hairline-strong: #D7D7DA;

  --blue: #0732F7;
  --blue-deep: #0420B5;
  --blue-tint: #EEF1FF;
  --crimson: #C8102E;
  --crimson-deep: #92091F;
  --crimson-tint: #FDEEF1;

  --accent: var(--blue);
  --accent-deep: var(--blue-deep);
  --accent-tint: var(--blue-tint);
  --accent-2: var(--crimson);
  --accent-2-tint: var(--crimson-tint);

  --success: #1f9b5c;
  --warning: #d97706;
  --error:   var(--crimson);

  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-display-2: "Montserrat", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-xl: 22px;
  --r-pill: 999px;

  --section-pad-x: 56px;
  --section-pad-y: 96px;

  --shadow-soft: 0 1px 2px rgba(10,10,15,0.04), 0 12px 32px -16px rgba(10,10,15,0.10);
  --shadow-float: 0 24px 64px -32px rgba(7,50,247,0.30), 0 4px 12px rgba(10,10,15,0.06);
  --shadow-deep: 0 60px 120px -40px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.18);
  --shadow-ring: 0 0 0 3px var(--blue-tint);

  --ease-out: cubic-bezier(.2,.7,.2,1);
  --t-fast: 140ms;
  --t-med: 240ms;
  --t-slow: 480ms;
}

/* ── Reset + Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
}
::selection { background: var(--accent); color: #fff; }
button, input, textarea, select {
  font: inherit;
  color: inherit;
}
button { cursor: pointer; background: transparent; border: 0; padding: 0; color: inherit; }
img, svg { display: block; max-width: 100%; }
img { height: auto; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; padding: 0; margin: 0; }

/* ── Accessibility: focus, skip link, sr-only ─────────────── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
[role="button"]:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.skip-link {
  position: absolute; top: 0; left: 0;
  padding: 12px 18px;
  background: var(--ink); color: #fff;
  font-family: var(--font-mono); font-size: 12px;
  border-bottom-right-radius: 8px;
  transform: translateY(-100%);
  transition: transform var(--t-fast) ease;
  z-index: 1000;
}
.skip-link:focus { transform: translateY(0); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.live-region {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden; clip: rect(0,0,0,0);
}

/* ── Page chrome ──────────────────────────────────────────── */
.page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

.bar {
  border-bottom: 1px solid var(--hairline);
  background: rgba(250,250,248,0.85);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  position: sticky; top: 0; z-index: 60;
}
.bar-translucent { background: rgba(10,10,15,0.45); border-bottom-color: rgba(255,255,255,0.08); color: #fff; }
.bar-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 14px var(--section-pad-x);
  display: flex; align-items: center; justify-content: space-between; gap: 32px;
}
.brand {
  display: inline-flex; align-items: center; gap: 12px;
  background: transparent; border: 0; padding: 0;
  color: inherit;
}
.brand-mark {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--blue), var(--crimson));
  border-radius: 8px;
  display: grid; place-items: center;
  font-family: var(--font-display-2); font-weight: 700; font-size: 17px;
  color: #fff;
  flex-shrink: 0;
}
.brand-text { display: flex; flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.15; }
.brand-name {
  font-family: var(--font-display-2); font-weight: 700; font-size: 14px;
  letter-spacing: -0.005em; color: var(--ink);
}
.brand-sub {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}

.bar-stage { display: inline-flex; align-items: center; gap: 14px; }
.lozenge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
}
.lozenge .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 0 rgba(31,155,92,0.5);
  animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(31,155,92,0.5); }
  50% { box-shadow: 0 0 0 5px rgba(31,155,92,0); }
}
.bar-translucent .lozenge { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); color: #fff; }

.bar-cta {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--ink); color: #fff;
  border-radius: var(--r-pill);
  font-size: 12.5px; font-weight: 500;
  transition: background var(--t-fast) ease;
}
.bar-cta:hover { background: var(--accent); }
.bar-translucent .bar-cta { background: #fff; color: var(--ink); }
.bar-cta .ar { transition: transform var(--t-fast) ease; }
.bar-cta:hover .ar { transform: translateX(2px); }

/* ── Hero ─────────────────────────────────────────────────── */
.hero {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column;
  padding: 20px var(--section-pad-x) 64px;
  color: #fff;
  overflow: hidden;
  background: #06060B;
}
.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-bg img {
  width: 100%; height: 100%; object-fit: cover;
  filter: grayscale(0.4) contrast(1.1);
}
.hero-bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(7,50,247,0.45), transparent 60%),
    radial-gradient(ellipse at 70% 70%, rgba(200,16,46,0.30), transparent 60%),
    linear-gradient(180deg, rgba(6,6,11,0.7) 0%, rgba(6,6,11,0.45) 50%, rgba(6,6,11,0.92) 100%);
}

/* Hero top status strip */
.hero-status {
  position: relative; z-index: 3;
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; flex-wrap: wrap;
  padding: 12px 0 14px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.75);
}
.hero-status-l, .hero-status-r { display: inline-flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.hero-status-item { display: inline-flex; align-items: center; gap: 8px; }
.hero-status-item strong { color: #fff; font-weight: 500; }
.hero-status-sep { width: 1px; height: 11px; background: rgba(255,255,255,0.2); }
.hero-status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #2ecc71;
  box-shadow: 0 0 0 0 rgba(46,204,113,0.55);
  animation: liveDot 2.2s ease-in-out infinite;
}
@keyframes liveDot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(46,204,113,0.55); }
  50% { box-shadow: 0 0 0 6px rgba(46,204,113,0); }
}

.hero-inner {
  position: relative; z-index: 2;
  flex: 1;
  display: flex; flex-direction: column; justify-content: center;
  max-width: 1280px; width: 100%; margin: 0 auto;
  padding: 64px 0 32px;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 14px;
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  margin-bottom: 32px;
}
.hero-eyebrow::before {
  content: ""; display: inline-block;
  width: 32px; height: 1px; background: currentColor; opacity: 0.55;
}
.hero-h {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(44px, 8vw, 116px);
  line-height: 0.96; letter-spacing: -0.035em;
  margin: 0 0 28px; max-width: 1080px;
  color: #fff;
  text-wrap: balance;
}
.hero-h em {
  font-style: italic; font-weight: 400;
  background: linear-gradient(120deg, #6688ff 0%, #ff8094 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.hero-sub {
  font-size: clamp(16px, 1.35vw, 19px);
  line-height: 1.55;
  color: rgba(255,255,255,0.78);
  max-width: 620px;
  margin: 0 0 40px;
  text-wrap: pretty;
}
.hero-cta-group {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  margin-bottom: 52px;
}
.hero-cta-primary {
  display: inline-flex; align-items: center; gap: 12px;
  min-height: 52px;
  padding: 14px 22px 14px 26px;
  background: #fff; color: var(--ink);
  border-radius: var(--r-pill);
  font-weight: 600; font-size: 15px;
  transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-med) ease, background var(--t-fast) ease;
  box-shadow: 0 8px 32px -8px rgba(0,0,0,0.4);
}
.hero-cta-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 48px -8px rgba(7,50,247,0.45);
  background: color-mix(in srgb, #fff 95%, var(--accent));
}
.hero-cta-primary:active { transform: translateY(0); }
.hero-cta-primary .cta-arrow {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px;
  background: var(--ink); color: #fff;
  border-radius: 50%; font-size: 11px;
  transition: transform var(--t-med) ease;
}
.hero-cta-primary:hover .cta-arrow { transform: translateY(2px); }

.hero-cta-secondary {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 52px;
  padding: 12px 18px;
  background: transparent;
  color: rgba(255,255,255,0.88);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: var(--r-pill);
  font-size: 14.5px; font-weight: 500;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease, color var(--t-fast) ease;
}
.hero-cta-secondary:hover {
  border-color: rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.06);
  color: #fff;
}
.hero-cta-secondary .play-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(255,255,255,0.16);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px;
  padding-left: 1px;
}

/* Hero capacity bar */
.hero-capacity {
  margin-bottom: 48px; max-width: 760px;
}
.hero-capacity-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px; flex-wrap: wrap;
  margin-bottom: 12px;
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}
.hero-capacity-head strong {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 15px; text-transform: none; letter-spacing: -0.005em;
  color: rgba(255,255,255,0.95);
}
.hero-capacity-track { display: flex; gap: 4px; }
.hero-cap-cell {
  flex: 1; height: 8px;
  border-radius: 3px;
  background: rgba(255,255,255,0.13);
  position: relative;
  cursor: default;
  transition: transform var(--t-fast) ease;
}
.hero-cap-cell.reserved { background: rgba(255,255,255,0.4); }
.hero-cap-cell.honoured { background: var(--accent-2); opacity: 0.75; }
.hero-cap-cell.open { background: var(--accent); }
.hero-cap-cell.recommended { background: var(--accent); box-shadow: 0 0 0 2px rgba(255,255,255,0.22); }
.hero-cap-cell:hover { transform: scaleY(1.6); }
.hero-cap-cell::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%);
  background: var(--ink); color: #fff;
  padding: 6px 10px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-fast) ease;
}
.hero-cap-cell:hover::after,
.hero-cap-cell:focus::after { opacity: 1; }

/* Hero stats */
.hero-stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 0;
  padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.14);
}
.hs {
  padding: 0 28px;
  border-right: 1px solid rgba(255,255,255,0.12);
  display: flex; flex-direction: column; gap: 8px;
}
.hs:first-child { padding-left: 0; }
.hs:last-child { border-right: 0; padding-right: 0; }
.hs-n {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(36px, 4vw, 56px); line-height: 1; letter-spacing: -0.025em;
  color: #fff;
}
.hs-l {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: rgba(255,255,255,0.55);
  line-height: 1.5;
}

/* Hero peers */
.hero-peers {
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.10);
}
.hero-peers-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px; flex-wrap: wrap;
  margin-bottom: 18px;
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}
.hero-peers-head strong {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 15px; text-transform: none; letter-spacing: -0.005em;
  color: rgba(255,255,255,0.9);
}
.hero-peers-track {
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}
.hero-peers-row {
  display: flex; gap: 36px;
  width: max-content;
  animation: peerScroll 42s linear infinite;
}
.hero-peers:hover .hero-peers-row,
.hero-peers:focus-within .hero-peers-row { animation-play-state: paused; }
@keyframes peerScroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.hero-peer {
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
  padding: 8px 16px 8px 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r-pill);
  transition: background var(--t-fast) ease, border-color var(--t-fast) ease;
}
.hero-peer:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.22); }
.hero-peer-init {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display-2); font-weight: 600;
  font-size: 13px; color: #fff;
}
.hero-peer-meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.hero-peer-name { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; }
.hero-peer-title { font-size: 11px; color: rgba(255,255,255,0.6); white-space: nowrap; }

/* Hero scroll cue */
.hero-scroll-cue {
  position: absolute; left: 50%; bottom: 22px;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: rgba(255,255,255,0.55);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
  transition: color var(--t-fast) ease;
  z-index: 4;
}
.hero-scroll-cue:hover { color: #fff; }
.hero-scroll-cue .cue-arrow {
  width: 22px; height: 22px;
  border: 1px solid currentColor; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px;
  animation: cueBounce 2.4s ease-in-out infinite;
}
@keyframes cueBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(4px); }
}

/* ── Main stage ────────────────────────────────────────────── */
.stage {
  background: var(--bg);
  padding: var(--section-pad-y) var(--section-pad-x) 120px;
  flex: 1;
}
.wrap { max-width: 1320px; margin: 0 auto; }

/* Prelude */
.prelude {
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 64px;
  padding-bottom: 64px;
  margin-bottom: 56px;
  border-bottom: 1px solid var(--hairline);
  align-items: end;
}
.eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 18px;
}
.prelude-h {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(34px, 4.5vw, 64px); line-height: 1; letter-spacing: -0.03em;
  margin: 0 0 22px; text-wrap: balance;
}
.prelude-h em {
  font-style: italic; font-weight: 400;
  color: var(--accent);
}
.prelude-lede {
  font-size: 17px; line-height: 1.55; color: var(--muted);
  max-width: 580px; margin: 0;
}
.prelude-meta {
  margin: 0; display: flex; flex-direction: column; gap: 14px;
}
.prelude-meta-row {
  display: grid; grid-template-columns: 120px 1fr;
  gap: 18px; align-items: baseline;
}
.prelude-meta-row dt {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2);
}
.prelude-meta-row dd {
  margin: 0;
  font-family: var(--font-display); font-weight: 400;
  font-size: 17px; letter-spacing: -0.01em;
}
.prelude-meta-row dd small {
  display: block; font-family: var(--font-body); font-size: 12.5px;
  color: var(--muted); margin-top: 3px;
}

/* Composer (form area + right rail) */
.composer { display: grid; grid-template-columns: 1.55fr 1fr; gap: 56px; align-items: start; }
.composer-left { min-width: 0; }
.composer-right { min-width: 0; }
.sticky-rail { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 18px; }

/* Stepper */
.stepper {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-bottom: 36px;
}
.step {
  display: flex; flex-direction: column; gap: 6px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--r-md);
  text-align: left;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease, transform var(--t-fast) ease;
}
.step:not(:disabled):hover { border-color: var(--hairline-strong); transform: translateY(-1px); }
.step .ix {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted-2);
  display: inline-flex; align-items: center; gap: 8px;
}
.step .ix-bar { width: 14px; height: 1px; background: currentColor; opacity: 0.4; }
.step .ttl {
  font-family: var(--font-display); font-weight: 500;
  font-size: 16px; letter-spacing: -0.012em; color: var(--ink);
}
.step .kicker { font-size: 12.5px; color: var(--muted); }
.step.on { border-color: var(--accent); background: var(--accent-tint); }
.step.on .ix, .step.on .ttl { color: var(--accent-deep); }
.step.done { border-color: var(--hairline-strong); }
.step.done .ix { color: var(--success); }
.step.todo { opacity: 0.6; }
.step:disabled { cursor: not-allowed; }

/* Scene wrapper */
.scene-wrap { min-height: 460px; }
.scene {
  animation: sceneIn 460ms var(--ease-out) both;
}
@keyframes sceneIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.step-head { margin-bottom: 32px; }
.step-kicker {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 16px;
}
.step-title {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(28px, 3.5vw, 44px); letter-spacing: -0.025em;
  line-height: 1.05; margin: 0 0 14px; text-wrap: balance;
}
.step-title em { font-style: italic; font-weight: 400; color: var(--accent); }
.step-sub {
  font-size: 15.5px; line-height: 1.55; color: var(--muted);
  max-width: 660px; margin: 0; text-wrap: pretty;
}

/* Fields */
.fields { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
.field { grid-column: span 12; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.col-3 { grid-column: span 3; }
.field.col-5 { grid-column: span 5; }
.field.col-7 { grid-column: span 7; }
.field.col-9 { grid-column: span 9; }
.field.full { grid-column: 1 / -1; }
.field label {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  font-weight: 500;
}
.field label .opt {
  font-family: var(--font-body); text-transform: none;
  letter-spacing: 0; font-size: 11.5px; color: var(--muted-2); font-weight: 400;
}
.field label .ok-check {
  color: var(--success); font-family: var(--font-body); letter-spacing: 0;
  text-transform: none; font-size: 14px;
}
.field input, .field textarea, .field select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-md);
  padding: 14px 16px;
  font-size: 15px;
  color: var(--ink);
  font-family: var(--font-body);
  transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, background var(--t-fast) ease;
  min-height: 48px;
}
.field input::placeholder, .field textarea::placeholder { color: var(--muted-2); }
.field input:focus, .field textarea:focus {
  border-color: var(--accent);
  background: #fff;
  box-shadow: var(--shadow-ring);
}
.field textarea { min-height: 100px; resize: vertical; line-height: 1.55; }
.field.err input, .field.err textarea { border-color: var(--error); background: var(--crimson-tint); }
.field.err input:focus, .field.err textarea:focus { box-shadow: 0 0 0 3px var(--crimson-tint); }
.field.ok input, .field.ok textarea { border-color: color-mix(in srgb, var(--success) 50%, var(--hairline-strong)); }
.field-hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
.err-text {
  font-size: 12.5px; color: var(--error);
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 2px;
}
.err-text::before { content: "⚠"; font-size: 11px; }

.autosave-row {
  margin-top: 16px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.06em; color: var(--muted);
  display: inline-flex; align-items: center; gap: 8px;
}
.autosave-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--success);
  animation: pulseDot 2.2s ease-in-out infinite;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 13px 20px;
  border-radius: var(--r-pill);
  font-size: 14px; font-weight: 500;
  font-family: var(--font-body);
  min-height: 48px;
  transition: background var(--t-fast) ease, color var(--t-fast) ease, border-color var(--t-fast) ease, transform var(--t-fast) ease;
}
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--hairline-strong); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-sunken); border-color: var(--ink); }
.btn-ghost-light { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.18); }
.btn-ghost-light:hover { background: rgba(255,255,255,0.12); }
.btn-light { background: #fff; color: var(--ink); }
.btn-arrow { transition: transform var(--t-fast) ease; }
.btn:hover .btn-arrow { transform: translateX(3px); }
.btn:hover .btn-arrow.back { transform: translateX(-3px); }
.btn-final {
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  box-shadow: 0 12px 32px -10px rgba(7,50,247,0.5);
}
.btn-final:hover:not(:disabled) {
  background: linear-gradient(135deg, var(--accent-deep), var(--accent));
  box-shadow: 0 16px 40px -10px rgba(7,50,247,0.6);
}

.actions {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  margin-top: 36px;
  padding-top: 28px;
  border-top: 1px solid var(--hairline);
}

.composer-foot {
  margin-top: 24px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--muted); letter-spacing: 0.06em;
}
.autosave { display: inline-flex; align-items: center; gap: 8px; }

/* ── Centres grid ─────────────────────────────────────────── */
.centres { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.centre {
  position: relative;
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-lg);
  text-align: left;
  overflow: hidden;
  transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, transform var(--t-fast) ease;
  cursor: pointer;
}
.centre:not(:disabled):hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: var(--shadow-soft); }
.centre.on { border-color: var(--accent); box-shadow: var(--shadow-ring); background: var(--accent-tint); }
.centre.honoured { cursor: not-allowed; opacity: 0.78; }
.centre.honoured:hover { transform: none; }
.centre-photo {
  position: relative;
  aspect-ratio: 16 / 10;
  background: var(--bg-sunken);
}
.centre-photo img {
  width: 100%; height: 100%; object-fit: cover;
  filter: grayscale(0.3);
}
.centre-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 6px; }
.centre-top {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
.centre-pill {
  padding: 4px 10px;
  background: var(--bg-sunken); border-radius: var(--r-pill);
  font-size: 10px; letter-spacing: 0.06em;
}
.centre-pill.honoured-pill { background: var(--accent-2-tint); color: var(--crimson-deep); font-weight: 500; }
.centre-name { font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: -0.018em; }
.centre-focus { font-size: 13.5px; color: var(--accent); font-weight: 500; }
.centre-bio { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: 6px 0 12px; }
.centre-foot {
  display: flex; gap: 18px; align-items: flex-end;
  padding-top: 12px;
  border-top: 1px solid var(--hairline);
}
.centre-stat { display: flex; flex-direction: column; gap: 2px; }
.centre-stat-n {
  font-family: var(--font-display); font-weight: 500; font-size: 18px;
  letter-spacing: -0.015em; color: var(--ink);
}
.centre-stat-l { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.centre-stat.right { margin-left: auto; text-align: right; }
.select-chip {
  padding: 7px 12px;
  background: var(--ink); color: #fff;
  border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  text-transform: none;
}
.centre.on .select-chip { background: var(--accent); }

/* AI Match Badge */
.ai-match-badge {
  position: absolute; top: 12px; right: 12px; z-index: 3;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px 5px 8px;
  background: var(--accent); color: #fff;
  border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
  box-shadow: 0 4px 12px -2px rgba(7,50,247,0.4);
}
.ai-match-badge.runner-up { background: var(--accent-2); box-shadow: 0 4px 12px -2px rgba(200,16,46,0.4); }
.ai-match-badge .badge-icon { font-size: 11px; }

/* ── Date legend + weeks ──────────────────────────────────── */
.legend {
  display: flex; gap: 18px; flex-wrap: wrap;
  margin-bottom: 22px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--muted); letter-spacing: 0.04em;
}
.lg { display: inline-flex; align-items: center; gap: 7px; }
.lg-sw { width: 12px; height: 12px; border-radius: 3px; background: var(--bg-sunken); border: 1px solid var(--hairline-strong); }
.lg-open { background: var(--surface); }
.lg-rec { background: var(--accent-tint); border-color: var(--accent); }
.lg-res { background: var(--bg-sunken); }
.lg-on { background: var(--accent); border-color: var(--accent); }

.weeks { display: flex; flex-direction: column; gap: 18px; }
.week { display: flex; flex-direction: column; }
.week-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 0 0 10px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.week-head strong { font-family: var(--font-display); font-size: 13px; letter-spacing: -0.005em; color: var(--ink); text-transform: none; }
.days { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--hairline-strong); border-radius: var(--r-lg); overflow: hidden; }
.day {
  position: relative;
  padding: 18px 20px 20px;
  background: var(--surface);
  border-right: 1px solid var(--hairline);
  cursor: pointer;
  transition: background var(--t-fast) ease;
  min-height: 130px;
  display: flex; flex-direction: column; gap: 6px;
}
.day:last-child { border-right: 0; }
.day:hover:not(.reserved) { background: var(--bg-sunken); }
.day.on { background: var(--accent); color: #fff; }
.day.on .day-meta, .day.on .day-theme small { color: rgba(255,255,255,0.78); }
.day.on .day-check { opacity: 1; }
.day.rec { background: var(--accent-tint); }
.day.reserved { background: var(--bg-sunken); cursor: not-allowed; }
.day.reserved::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,0,0,0.025) 8px, rgba(0,0,0,0.025) 10px);
  pointer-events: none;
}
.day-check {
  position: absolute; top: 14px; right: 16px;
  width: 22px; height: 22px;
  border-radius: 50%; background: rgba(255,255,255,0.18);
  display: grid; place-items: center;
  color: #fff; font-size: 12px;
  opacity: 0; transition: opacity var(--t-fast) ease;
}
.day-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.day-date { font-family: var(--font-display); font-weight: 500; font-size: 19px; letter-spacing: -0.012em; }
.day-theme { font-size: 13px; color: var(--ink-soft); }
.day-theme small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.day-reserved-by {
  display: flex; align-items: center; gap: 10px;
  margin-top: auto; padding-top: 10px;
  border-top: 1px solid var(--hairline-strong);
  font-size: 12px;
}
.day-reserved-init {
  width: 30px; height: 30px;
  background: var(--ink); color: #fff;
  border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 500; font-size: 11px;
  flex-shrink: 0;
}
.day-reserved-by strong { display: block; color: var(--ink); font-weight: 600; font-size: 12.5px; }
.day-reserved-by small { color: var(--muted); font-size: 11px; }
.rec-flag {
  position: absolute; top: 14px; left: 18px;
  padding: 3px 8px;
  background: var(--accent); color: #fff;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
  border-radius: 4px;
}

/* ── Review summary ───────────────────────────────────────── */
.review {
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-lg);
  padding: 32px 36px;
}
.review h4 {
  margin: 0 0 22px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
}
.review dl { margin: 0; display: flex; flex-direction: column; gap: 18px; }
.review-line {
  display: grid; grid-template-columns: 130px 1fr;
  gap: 24px; align-items: baseline;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--hairline);
}
.review-line:last-child { padding-bottom: 0; border-bottom: 0; }
.review-line dt {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.review-line dd {
  margin: 0;
  font-family: var(--font-display); font-weight: 500;
  font-size: 18px; letter-spacing: -0.012em;
}
.review-line dd small {
  display: block; font-family: var(--font-body); font-size: 13px;
  color: var(--muted); font-weight: 400; margin-top: 3px;
}

/* ── Legacy Card (right rail) ─────────────────────────────── */
.legacy {
  background: var(--ink);
  color: #fff;
  border-radius: var(--r-lg);
  overflow: hidden;
  position: relative;
  transition: transform var(--t-slow) var(--ease-out);
  transform-style: preserve-3d;
}
.legacy-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(7,50,247,0.35), transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(200,16,46,0.18), transparent 60%);
  pointer-events: none;
}
.legacy-inner { position: relative; padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 18px; }
.legacy-header {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.14);
}
.legacy-eyebrow {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.55);
}
.legacy-eyebrow strong { color: #fff; font-weight: 500; }
.legacy-status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: rgba(255,255,255,0.08);
  border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.06em; color: rgba(255,255,255,0.75);
}
.legacy-status.confirmed { background: rgba(31,155,92,0.18); color: #5ee2a6; }
.legacy-status .sdot {
  width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  animation: pulseDot 2.2s ease-in-out infinite;
}
.legacy-portrait {
  align-self: center;
  width: 72px; height: 72px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 400; font-size: 24px;
  letter-spacing: -0.01em; color: #fff;
  margin-top: 4px;
}
.portrait-init { font-style: normal; }
.legacy-name {
  text-align: center;
  font-family: var(--font-display); font-weight: 400;
  font-size: 22px; letter-spacing: -0.015em; line-height: 1.15;
  margin: 0;
}
.legacy-name.pending { color: rgba(255,255,255,0.4); font-style: italic; }
.legacy-title {
  text-align: center;
  font-size: 12.5px;
  color: rgba(255,255,255,0.62);
  margin: -6px 0 4px;
}
.legacy-title.pending { color: rgba(255,255,255,0.3); font-style: italic; }
.legacy-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  padding-top: 14px; padding-bottom: 14px;
  border-top: 1px solid rgba(255,255,255,0.14);
  border-bottom: 1px solid rgba(255,255,255,0.14);
}
.lf { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lf-key {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}
.lf-val {
  font-family: var(--font-display); font-weight: 500; font-size: 14px;
  letter-spacing: -0.005em; color: #fff;
  display: flex; flex-direction: column; gap: 2px;
}
.lf-val.pending { color: rgba(255,255,255,0.4); font-style: italic; font-weight: 400; }
.lf-val small { font-family: var(--font-body); font-weight: 400; font-size: 11px; color: rgba(255,255,255,0.55); font-style: normal; }
.legacy-quote {
  font-family: var(--font-display); font-style: italic;
  font-size: 14px; line-height: 1.5;
  color: rgba(255,255,255,0.82);
  margin: 0; text-align: center;
}
.legacy-quote em { color: var(--accent); font-style: italic; }
.legacy-seal {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.14);
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.08em; color: rgba(255,255,255,0.45);
}
.crest {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display-2); font-weight: 700; font-size: 12px;
  color: #fff;
}
.legacy-large .legacy-inner { padding: 36px 36px 28px; }
.legacy-large .legacy-portrait { width: 96px; height: 96px; font-size: 32px; }
.legacy-large .legacy-name { font-size: 28px; }
.legacy-large .lf-val { font-size: 15px; }

/* Peers panel */
.peers {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  padding: 22px 24px;
}
.peers h5 {
  margin: 0 0 14px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; align-items: baseline;
}
.peers h5 span { color: var(--accent); font-weight: 500; }
.peers-list { display: flex; flex-direction: column; gap: 16px; }
.peers-list li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; }
.peer-init {
  width: 36px; height: 36px;
  background: var(--bg-sunken); color: var(--ink);
  border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 500; font-size: 12px;
}
.peer-name strong { display: block; font-size: 13.5px; font-weight: 600; }
.peer-name small { display: block; font-size: 11.5px; color: var(--muted); }
.peer-where { text-align: right; }
.peer-status { font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: 0.04em; }
.peer-where small { display: block; font-size: 11px; color: var(--muted); }
.peers-foot {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--hairline);
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.06em; color: var(--muted);
}

/* ── AI Panels ────────────────────────────────────────────── */
.ai-panel {
  position: relative;
  background: linear-gradient(135deg, var(--accent-tint), color-mix(in srgb, var(--accent-tint) 35%, var(--surface)));
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--hairline));
  border-radius: var(--r-lg);
  padding: 20px 22px;
  margin-bottom: 24px;
  overflow: hidden;
}
.ai-panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
  background-size: 200% 100%;
  animation: aiShimmer 3.5s ease-in-out infinite;
}
@keyframes aiShimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
.ai-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep);
}
.ai-spark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  background: var(--accent); color: #fff;
  border-radius: 6px; font-size: 12px;
}
.ai-rec { display: flex; flex-direction: column; gap: 10px; }
.ai-rec-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--hairline);
  border-radius: var(--r-md);
  text-align: left;
  cursor: pointer;
  width: 100%;
  transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, transform var(--t-fast) ease;
}
.ai-rec-item:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 16px -4px rgba(7,50,247,0.25);
  transform: translateY(-1px);
}
.ai-rec-rank {
  flex-shrink: 0;
  width: 28px; height: 28px;
  background: var(--accent); color: #fff;
  border-radius: 8px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; font-size: 14px;
}
.ai-rec-rank.runner { background: var(--accent-2); }
.ai-rec-body { flex: 1; min-width: 0; }
.ai-rec-centre {
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  letter-spacing: -0.01em; color: var(--ink); margin-bottom: 3px;
}
.ai-rec-reason { font-size: 13px; color: var(--muted); line-height: 1.45; }
.ai-rec-select { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--accent); margin-top: 6px; }
.ai-personal-note {
  font-family: var(--font-display); font-style: italic; font-size: 14px;
  color: var(--ink-soft); margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid color-mix(in srgb, var(--accent) 15%, var(--hairline));
  line-height: 1.5;
}
.ai-loading {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 0 4px;
  font-size: 13px; color: var(--muted);
}
.ai-dots { display: inline-flex; gap: 4px; }
.ai-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0.4; animation: dotPulse 1.2s ease-in-out infinite; }
.ai-dots span:nth-child(2) { animation-delay: 0.15s; }
.ai-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes dotPulse {
  0%, 80%, 100% { opacity: 0.4; transform: scale(1); }
  40% { opacity: 1; transform: scale(1.2); }
}
.ai-note-chips { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.ai-note-chip {
  display: block; width: 100%; text-align: left;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--hairline);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  font-size: 13px; color: var(--ink-soft);
  line-height: 1.45;
  cursor: pointer;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease;
}
.ai-note-chip:hover { border-color: var(--accent); background: var(--accent-tint); }

/* AI brief (on confirmation) */
.ai-brief {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: var(--r-lg);
  padding: 26px 28px 24px;
  color: #fff;
}
.ai-brief-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
}
.ai-brief-greeting {
  font-family: var(--font-display); font-style: italic;
  font-size: 17px; color: rgba(255,255,255,0.92); margin-bottom: 18px; line-height: 1.4;
}
.ai-brief-section-title {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.5);
  margin: 16px 0 8px;
}
.ai-brief-point {
  padding: 10px 0;
  font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.55;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.ai-brief-point:last-child { border-bottom: 0; }
.ai-brief-highlight {
  padding: 14px 16px;
  background: rgba(255,255,255,0.05);
  border-radius: var(--r-md);
  border-left: 3px solid var(--accent);
  margin: 10px 0;
}
.ai-brief-highlight-label {
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
}
.ai-brief-highlight-text {
  font-family: var(--font-display); font-style: italic; font-size: 16px;
  color: rgba(255,255,255,0.9); line-height: 1.45;
}
.ai-share-tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
.ai-share-tab {
  padding: 8px 14px;
  border-radius: var(--r-pill);
  border: 1px solid rgba(255,255,255,0.18);
  background: transparent; color: rgba(255,255,255,0.62);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  cursor: pointer;
  transition: all var(--t-fast) ease;
}
.ai-share-tab:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
.ai-share-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.ai-share-copy {
  position: relative;
  background: rgba(0,0,0,0.32);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--r-md);
  padding: 18px 18px 48px;
  font-size: 14px; line-height: 1.6;
  color: rgba(255,255,255,0.85);
  white-space: pre-wrap;
  min-height: 80px;
}
.ai-share-copy-btn {
  position: absolute; bottom: 10px; right: 10px;
  padding: 6px 16px;
  border-radius: var(--r-pill);
  background: var(--accent); color: #fff;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.04em;
  transition: background var(--t-fast) ease, transform 100ms ease;
}
.ai-share-copy-btn:hover { background: var(--accent-deep); }
.ai-share-copy-btn:active { transform: scale(0.96); }

/* ── Confirmation scene ───────────────────────────────────── */
.page-confirm { background: #06060B; color: #fff; min-height: 100vh; min-height: 100dvh; }
.confirm {
  position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden;
  padding: 64px var(--section-pad-x);
}
.confirm-bg { position: absolute; inset: 0; z-index: 0; }
.confirm-bg img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.5); }
.confirm-bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(7,50,247,0.40), transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(200,16,46,0.22), transparent 60%),
    linear-gradient(180deg, rgba(6,6,11,0.55), rgba(6,6,11,0.85));
}
.confirm-inner {
  position: relative; z-index: 2;
  max-width: 1320px; margin: 0 auto;
}
.confirm-reveal {
  text-align: center; max-width: 760px; margin: 0 auto;
  transition: opacity var(--t-slow) ease, transform var(--t-slow) var(--ease-out);
  animation: confirmIn 800ms var(--ease-out) both;
}
@keyframes confirmIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.confirm-reveal.compact { padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,0.10); }
.confirm-eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 14px;
}
.confirm-h {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(38px, 5vw, 72px); line-height: 1.04; letter-spacing: -0.03em;
  margin: 0 0 18px;
}
.confirm-h em { font-style: italic; font-weight: 400; color: var(--accent); }
.confirm-sub {
  font-size: 16px; line-height: 1.55; color: rgba(255,255,255,0.75);
  max-width: 560px; margin: 0 auto 28px;
}
.confirm-meta {
  display: flex; justify-content: center; gap: 28px;
  flex-wrap: wrap; padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.10);
}
.confirm-meta div { display: flex; flex-direction: column; gap: 4px; text-align: left; }
.confirm-meta dt {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.55);
}
.confirm-meta dd { margin: 0; font-family: var(--font-display); font-size: 16px; letter-spacing: -0.005em; }
.confirm-stage-2 {
  opacity: 0; transform: translateY(20px);
  transition: opacity 700ms ease 200ms, transform 700ms var(--ease-out) 200ms;
}
.confirm-stage-2.visible { opacity: 1; transform: translateY(0); }
.confirm-grid {
  display: grid; grid-template-columns: 1fr 1.3fr; gap: 36px;
  margin-top: 48px;
}
.confirm-card-wrap { display: flex; flex-direction: column; gap: 16px; }
.deliverables {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}
.deliverable {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r-md);
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color var(--t-fast) ease, background var(--t-fast) ease;
  cursor: pointer;
}
.deliverable:hover { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); }
.deliverable-ix {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
}
.deliverable-t {
  font-family: var(--font-display); font-weight: 500;
  font-size: 16px; letter-spacing: -0.012em; color: #fff;
}
.deliverable-d { font-size: 12.5px; color: rgba(255,255,255,0.65); line-height: 1.5; }
.deliverable-cta {
  margin-top: auto; padding-top: 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--accent); letter-spacing: 0.05em;
}
.confirm-actions {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 48px; padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.10);
  gap: 16px; flex-wrap: wrap;
}

/* ── How It Works modal ──────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(10,10,15,0.7);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-med) ease;
}
.modal-backdrop.open { opacity: 1; pointer-events: auto; }
.modal-panel {
  background: var(--surface); color: var(--ink);
  border-radius: var(--r-xl);
  max-width: 660px; width: 100%;
  max-height: calc(100vh - 48px); overflow-y: auto;
  padding: 36px 40px;
  box-shadow: var(--shadow-deep);
  transform: scale(0.96) translateY(10px);
  transition: transform 320ms var(--ease-out);
}
.modal-backdrop.open .modal-panel { transform: scale(1) translateY(0); }
.modal-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  margin-bottom: 24px;
}
.modal-eyebrow {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);
}
.modal-title {
  font-family: var(--font-display); font-weight: 400;
  font-size: 30px; letter-spacing: -0.025em; line-height: 1.1;
  margin: 8px 0 0;
}
.modal-title em { font-style: italic; color: var(--accent); }
.modal-close {
  background: var(--bg-sunken);
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 14px;
  flex-shrink: 0;
  transition: background var(--t-fast) ease;
}
.modal-close:hover { background: var(--hairline-strong); }
.modal-steps { display: flex; flex-direction: column; gap: 18px; }
.modal-step {
  display: flex; gap: 18px; align-items: flex-start;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--hairline);
}
.modal-step:last-child { border-bottom: 0; padding-bottom: 0; }
.modal-step-num {
  flex-shrink: 0;
  width: 36px; height: 36px;
  background: var(--accent-tint); color: var(--accent-deep);
  border-radius: 10px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 500; font-size: 16px;
}
.modal-step-title {
  font-family: var(--font-display); font-weight: 500;
  font-size: 17px; letter-spacing: -0.01em; margin: 0 0 6px;
}
.modal-step-desc { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0; }
.modal-foot {
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px; flex-wrap: wrap;
  margin-top: 28px; padding-top: 22px;
  border-top: 1px solid var(--hairline);
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase;
}
.modal-foot-cta {
  background: var(--ink); color: #fff;
  padding: 12px 20px;
  border-radius: var(--r-pill);
  font-family: var(--font-body); font-weight: 500; font-size: 14px;
  text-transform: none; letter-spacing: -0.005em;
  display: inline-flex; align-items: center; gap: 8px;
  transition: background var(--t-fast) ease, transform 100ms ease;
}
.modal-foot-cta:hover { background: var(--accent); }
.modal-foot-cta:active { transform: scale(0.98); }

/* ── PARENT ROW + FOOTER (from source codebase) ──────────── */
.parent-row {
  background: var(--surface);
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
}
.parent-row-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px var(--section-pad-x);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}
.parent-row-lead {
  display: flex; align-items: center; gap: 14px;
  font-size: 13px; color: var(--muted);
}
.parent-row-lead .av-mark {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--hairline-strong);
  border-radius: 4px;
  font-family: var(--font-display-2);
  font-weight: 700; font-size: 12px;
  letter-spacing: 0.06em; color: var(--ink);
  text-transform: uppercase;
}
.parent-row-cta {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--ink);
  transition: color var(--t-fast) ease;
}
.parent-row-cta:hover { color: var(--blue); }

.footer-site {
  padding: 80px var(--section-pad-x) 32px;
  background: var(--bg);
}
.footer-site-inner { max-width: 1440px; margin: 0 auto; }
.footer-cols {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1.2fr;
  gap: 48px;
  padding-bottom: 56px;
  border-bottom: 1px solid var(--hairline);
}
.footer-col h4 {
  font-family: var(--font-display-2); font-size: 12px;
  font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink);
  margin: 0 0 16px;
}
.footer-col ul { display: flex; flex-direction: column; gap: 10px; }
.footer-col a { color: var(--muted); font-size: 14px; transition: color var(--t-fast) ease; }
.footer-col a:hover { color: var(--blue); }
.footer-brand-block { display: flex; flex-direction: column; gap: 16px; }
.footer-brand-block .brand { gap: 12px; }
.footer-brand-block .brand-mark { width: 32px; height: 32px; font-size: 15px; border-radius: 7px; }
.footer-brand-block .brand-name { font-size: 16px; }
.footer-description {
  color: var(--muted); font-size: 13px;
  line-height: 1.55; max-width: 300px;
  margin: 0;
}
.footer-social-row {
  margin-top: 20px;
  display: flex; gap: 14px;
}
.footer-social-row a {
  font-size: 13px; color: var(--muted);
  transition: color var(--t-fast) ease;
}
.footer-social-row a:hover { color: var(--blue); }
.footer-newsletter-form {
  display: flex; gap: 8px;
  margin-top: 14px;
}
.footer-newsletter-form input {
  flex: 1; min-width: 0;
  height: 40px; padding: 0 14px;
  border: 1px solid var(--hairline);
  background: var(--surface);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color var(--t-fast) ease;
}
.footer-newsletter-form input:focus { border-color: var(--blue); }
.footer-newsletter-form button {
  height: 40px; padding: 0 16px;
  border-radius: 8px;
  background: var(--ink); color: #fff;
  font-weight: 600; font-size: 13px;
  transition: background var(--t-fast) ease, opacity var(--t-fast) ease;
}
.footer-newsletter-form button:hover:not(:disabled) { background: var(--blue); }
.footer-newsletter-form button:disabled { opacity: 0.5; cursor: not-allowed; }
.footer-newsletter-foot {
  margin-top: 10px;
  font-size: 11px; color: var(--muted);
}
.footer-newsletter-foot.ok  { color: var(--success); }
.footer-newsletter-foot.err { color: var(--error); }
.footer-bottom {
  padding-top: 24px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--muted);
  gap: 16px; flex-wrap: wrap;
}
.footer-bottom-links {
  display: flex; gap: 24px; flex-wrap: wrap;
}
.footer-bottom-links a { color: var(--muted); transition: color var(--t-fast) ease; }
.footer-bottom-links a:hover { color: var(--ink); }

/* ── Back to top ─────────────────────────────────────────── */
.back-to-top {
  position: fixed; right: 24px; bottom: 24px; z-index: 90;
  width: 44px; height: 44px;
  background: var(--ink); color: #fff;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 16px;
  box-shadow: var(--shadow-soft);
  opacity: 0; transform: translateY(20px) scale(0.85);
  transition: opacity var(--t-med) ease, transform var(--t-med) var(--ease-out), background var(--t-fast) ease;
  pointer-events: none;
}
.back-to-top.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.back-to-top:hover { background: var(--accent); }
.back-to-top:active { transform: scale(0.92); }

/* ── Toast notifications ─────────────────────────────────── */
.toast-container {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 250;
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.toast {
  background: var(--ink); color: #fff;
  padding: 14px 18px;
  border-radius: var(--r-md);
  font-size: 14px;
  box-shadow: var(--shadow-deep);
  max-width: 380px;
  display: flex; align-items: center; gap: 10px;
  pointer-events: auto;
  animation: toastIn 320ms var(--ease-out);
}
.toast.error { background: var(--crimson); }
.toast.success { background: var(--success); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Mobile bottom bar + preview sheet ───────────────────── */
.mob-bar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
  background: rgba(255,255,255,0.96);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  border-top: 1px solid var(--hairline);
  padding: 10px 16px max(10px, env(safe-area-inset-bottom));
  align-items: center; gap: 10px;
}
.mob-preview-btn {
  flex: 1;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px 8px 8px;
  background: var(--bg-sunken);
  border-radius: var(--r-md);
  text-align: left;
  min-width: 0;
  transition: background var(--t-fast) ease;
}
.mob-preview-btn:active { background: var(--hairline); }
.mob-preview-init {
  flex-shrink: 0;
  width: 32px; height: 32px;
  background: var(--ink); color: #fff;
  border-radius: 8px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 500; font-size: 12px;
}
.mob-preview-meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.mob-preview-meta strong { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mob-preview-meta small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

// ─── Helpers ─────────────────────────────────────────────────────────
function cn(...x) { return x.filter(Boolean).join(" "); }
function initialsFrom(name) {
  const parts = (name || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "—";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
function splitHonorific(raw) {
  if (!raw) return [null, raw || ""];
  const trimmed = raw.trimStart();
  for (const h of HONORIFICS) {
    const re = new RegExp("^(" + h.replace(".", "\\.") + ")\\s+", "i");
    if (re.test(trimmed)) return [h, trimmed.replace(re, "")];
  }
  return [null, raw];
}
function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test((v || "").trim()); }
function titleCase(s) { return (s || "").replace(/\b([\p{L}])([\p{L}''\-]*)/gu, (_, a, b) => a.toUpperCase() + b.toLowerCase()); }
function formatPhone(v) {
  if (!v) return "";
  let digits = String(v).replace(/[^\d+]/g, "");
  if (digits.startsWith("00")) digits = "+" + digits.slice(2);
  if (digits.startsWith("0")) digits = "+234 " + digits.slice(1);
  if (!digits.startsWith("+")) digits = "+" + digits;
  const m = digits.match(/^\+?(\d{1,3})(\d{0,3})(\d{0,3})(\d{0,4})/);
  if (!m) return digits;
  return ["+" + m[1], m[2], m[3], m[4]].filter(Boolean).join(" ");
}
function computeCountdown() {
  const target = new Date("2026-08-01T09:00:00+01:00").getTime();
  const diff = Math.max(0, target - Date.now());
  return {
    days:  Math.floor(diff / 86400000),
    hours: Math.floor((diff % 86400000) / 3600000),
  };
}

// ─── Backend client (PHP → AppsScript → Sheets) ──────────────────────
const API_BASE = "./api";

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const txt = await res.text().catch(() => "");
    let parsed = null; try { parsed = JSON.parse(txt); } catch {}
    throw new Error((parsed && parsed.error) || ("HTTP " + res.status));
  }
  return res.json();
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// AI engine with in-flight promise dedupe + result cache
const AI = (() => {
  const cache = new Map();
  function call(action, data) {
    const key = action + ":" + JSON.stringify(data);
    if (cache.has(key)) return cache.get(key);
    const p = (async () => {
      try {
        const json = await postJSON(API_BASE + "/ai.php", { action, data });
        if (!json.ok) throw new Error(json.error || "AI error");
        let parsed = json.data;
        if (typeof parsed === "string") { try { parsed = JSON.parse(parsed); } catch {} }
        return parsed;
      } catch (err) {
        console.warn("[AI] " + action, err.message);
        cache.delete(key);
        return null;
      }
    })();
    cache.set(key, p);
    return p;
  }
  return {
    centreMatch:  (d) => call("centre_match",  d),
    sessionBrief: (d) => call("session_brief", d),
    shareCopy:    (d) => call("share_copy",    d),
    noteSuggest:  (d) => call("note_suggest",  d),
    clearCache:   () => cache.clear(),
  };
})();

}

}

// ─── Toast notifications ─────────────────────────────────────────────
let _toastCounter = 0;
const _toastListeners = new Set();
function showToast(message, type = "info", duration = 4000) {
  const id = ++_toastCounter;
  _toastListeners.forEach((fn) => fn({ type: "add", id, message, kind: type }));
  setTimeout(() => _toastListeners.forEach((fn) => fn({ type: "remove", id })), duration);
}
function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    const handler = (ev) => {
      if (ev.type === "add") setToasts((t) => [...t, { id: ev.id, message: ev.message, kind: ev.kind }]);
      else if (ev.type === "remove") setToasts((t) => t.filter((x) => x.id !== ev.id));
    };
    _toastListeners.add(handler);
    return () => _toastListeners.delete(handler);
  }, []);
  return (
    <div className="toast-container" aria-live="polite" aria-atomic="true">
      {toasts.map((t) => (
        <div key={t.id} className={cn("toast", t.kind)} role="status">{t.message}</div>
      ))}
    </div>
  );
}

// ─── CountUp ─────────────────────────────────────────────────────────
function CountUp({ to, duration = 1100, suffix = "" }) {
  const [v, setV] = useState(0);
  useEffect(() => {
    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (prefersReduced) { setV(to); return; }
    let raf, start;
    const ease = (p) => 1 - Math.pow(1 - p, 3);
    const tick = (t) => {
      if (!start) start = t;
      const p = Math.min((t - start) / duration, 1);
      setV(Math.floor(ease(p) * to));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [to, duration]);
  return <>{v.toLocaleString()}{suffix}</>;
}

// ─── Field primitive ─────────────────────────────────────────────────
function Field({ label, opt, hint, error, valid, children, full, col, fieldId }) {
  const errId = fieldId ? fieldId + "-err" : undefined;
  const hintId = fieldId ? fieldId + "-hint" : undefined;
  return (
    <div className={cn("field", full && "full", col && "col-" + col, error && "err", valid && "ok")}>
      <label htmlFor={fieldId}>
        <span>
          {label}
          {opt && <span className="opt"> · {opt}</span>}
        </span>
        {valid && <span className="ok-check" aria-label="valid">✓</span>}
      </label>
      {React.cloneElement(children, {
        id: fieldId,
        "aria-invalid": error ? "true" : undefined,
        "aria-describedby": error ? errId : (hint ? hintId : undefined),
      })}
      {error ? (
        <div className="err-text" id={errId} role="alert">{error}</div>
      ) : hint ? (
        <div className="field-hint" id={hintId}>{hint}</div>
      ) : null}
    </div>
  );
}

// ─── Stepper ─────────────────────────────────────────────────────────
function Stepper({ step, onJump }) {
  return (
    <div className="stepper" role="tablist" aria-label="Form progress">
      {STEPS.map((s, i) => {
        const state = i === step ? "on" : i < step ? "done" : "todo";
        return (
          <button
            type="button"
            key={s.ix}
            className={cn("step", state)}
            role="tab"
            aria-selected={state === "on"}
            aria-controls={`scene-${s.ix}`}
            disabled={state === "todo"}
            onClick={() => state !== "todo" && onJump && onJump(i)}
          >
            <div className="ix">
              <span>{s.scene}</span>
              <span className="ix-bar" aria-hidden="true"></span>
              <span>{state === "done" ? "Done" : state === "on" ? "Now" : "Up next"}</span>
            </div>
            <div className="ttl">{s.title}</div>
            <div className="kicker">{s.kicker}</div>
          </button>
        );

    </div>
  );
}

// ─── Hero ────────────────────────────────────────────────────────────
function Hero({ onBegin, hasSavedProgress, onHowItWorks, reservations }) {
  const [countdown, setCountdown] = useState(() => computeCountdown());
  useEffect(() => {
    const id = setInterval(() => setCountdown(computeCountdown()), 60000);
    return () => clearInterval(id);
  }, []);

  const allDays = useMemo(() => WEEKS.flatMap((w) => w.days.map((d) => ({ ...d, week: w.n }))), []);
  const reservedIds = new Set(reservations.map((r) => r.dateId));
  const reservedCount = allDays.filter((d) => reservedIds.has(d.id)).length;
  const openCount = allDays.length - reservedCount;

  return (

// ─── Step 1 · Identity ───────────────────────────────────────────────
function StepIdentity({ form, setForm, errors, aiNoteSuggest }) {

    }
    setForm({ ...form, name: titleCase(val) });
  };
  const onPhone = (e) => setForm({ ...form, whatsapp: formatPhone(e.target.value) });
  const emailValid = isEmail(form.email);
  const nameValid = form.name.trim().split(/\s+/).length >= 2;

  return (
    <div className="scene" id="scene-01">
      <div className="step-head">
        <div className="step-kicker">Scene I · Identity</div>

          <input type="text" list="honorifics" value={form.honorific} onChange={(e) => setForm({ ...form, honorific: e.target.value })} placeholder="Dr." autoComplete="honorific-prefix" />
        </Field>

        </Field>
        <Field label="Role · Position" full fieldId="f-role" error={errors.role && "Required — used in your introduction on the day."} valid={!errors.role && form.role.trim().length > 2} hint="e.g. Chief Executive Officer · Founder · Commissioner">
          <input type="text" value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} placeholder="Chief Executive Officer" autoComplete="organization-title" required />
        </Field>
        <Field label="Organisation" full fieldId="f-org" error={errors.org && "Required — appears under your name on the archive."} valid={!errors.org && form.org.trim().length > 2}>
          <input type="text" value={form.org} onChange={(e) => setForm({ ...form, org: e.target.value })} placeholder="Your organisation" autoComplete="organization" required />
        </Field>
        <Field label="Email" col="7" fieldId="f-email" error={errors.email && "A valid email is required for confirmation."} valid={emailValid}>
          <input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="your@email.com" autoComplete="email" inputMode="email" required />
        </Field>
        <Field label="WhatsApp" col="5" opt="private brief" fieldId="f-whatsapp" hint="Auto-formats Nigerian numbers." valid={form.whatsapp.replace(/\D/g, "").length >= 10}>
          <input type="tel" value={form.whatsapp} onChange={onPhone} placeholder="+234 ___ ___ ____" autoComplete="tel" inputMode="tel" />
        </Field>
        <Field label="A note to the producer" opt="optional · 1–2 lines" full fieldId="f-notes">
          <textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="e.g. I'm happy to speak across two dates; I have a slight preference for sessions on the discipline of focus…" />

// ─── Legacy Card (right rail) ────────────────────────────────────────
function LegacyCard({ form, computed, confirmed, large }) {
  const ref = useRef(null);
  const [tilt, setTilt] = useState({ rx: 0, ry: 0 });
  const reduceMotion = useRef(false);

  useEffect(() => {
    reduceMotion.current = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }, []);

  const onMove = (e) => {
    if (!ref.current || large || reduceMotion.current) return;
    const r = ref.current.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width  - 0.5;
    const y = (e.clientY - r.top)  / r.height - 0.5;
    setTilt({ rx: -y * 5, ry: x * 5 });
  };
  const onLeave = () => setTilt({ rx: 0, ry: 0 });

  const displayName = [form.honorific, form.name].filter(Boolean).join(" ").trim();
  const displayTitle = [form.role, form.org].filter(Boolean).join(", ").trim();

  return (
    <article
      ref={ref}
      onMouseMove={onMove}
      onMouseLeave={onLeave}
      className={cn("legacy", large && "legacy-large", confirmed && "legacy-confirmed")}
      style={{ transform: `perspective(1200px) rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)` }}
      aria-label="Live preview of your archive card"
    >
      <div className="legacy-bg" aria-hidden="true" />
      <div className="legacy-inner">
        <div className="legacy-header">
          <div className="legacy-eyebrow">STREET-TO-STARDOM · <strong>2026 ARCHIVE</strong></div>
          <div className={cn("legacy-status", confirmed && "confirmed")}>
            <span className="sdot" aria-hidden="true"></span>
            {confirmed ? "Confirmed" : "Pending"}
          </div>
        </div>

        <div className="legacy-portrait" aria-hidden="true">
          <span className="portrait-init">{displayName ? initialsFrom(displayName) : "—"}</span>
        </div>

        <h3 className={cn("legacy-name", !displayName && "pending")}>
          {displayName || "Your name appears here"}
        </h3>
        <div className={cn("legacy-title", !displayTitle && "pending")}>
          {displayTitle || "Role · Organisation"}
        </div>

        <div className="legacy-grid">
          <div className="lf">
            <span className="lf-key">Will speak at</span>
            <span className={cn("lf-val", !computed.centre && "pending")}>
              {computed.centre?.name || "Centre pending"}
              {computed.centre && <small>{computed.centre.focus}</small>}
            </span>
          </div>
          <div className="lf">
            <span className="lf-key">Session</span>
            <span className={cn("lf-val", !computed.day && "pending")}>
              {computed.day?.date || "Date pending"}
              {computed.day && <small>{computed.day.dow} · Theme · {computed.day.theme}</small>}
            </span>
          </div>
          <div className="lf">
            <span className="lf-key">Children present</span>
            <span className={cn("lf-val", !computed.centre && "pending")}>
              {computed.centre ? computed.centre.children : "—"}
              {computed.centre && <small>of 900 cohort</small>}
            </span>
          </div>
          <div className="lf">
            <span className="lf-key">Time</span>
            <span className="lf-val">9:00 — 10:00 AM<small>+ 30 min mentorship</small></span>
          </div>
        </div>

        <p className="legacy-quote">
          {confirmed
            ? <>"One of six leaders who built <em>a generation.</em>"</>
            : <>"{TONE.legacyQuote}"</>}
        </p>

        <div className="legacy-seal">
          <span>Cohort 2026 · Vol. I</span>
          <div className="crest" aria-hidden="true">S</div>
          <span>{confirmed ? "Archived ✓" : "Catalogue Pending"}</span>

// ─── AI · Centre Insight panel ───────────────────────────────────────
function AICentreInsight({ form, onSelectCentre }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(false);
  const requested = useRef(false);

  const profileReady = form.name.trim().split(/\s+/).length >= 2 && form.role.trim() && form.org.trim();

  useEffect(() => {
    if (!profileReady || requested.current) return;
    requested.current = true;
    setLoading(true);
    AI.centreMatch({ name: form.name, role: form.role, org: form.org })
      .then((d) => { if (d) setData(d); else setError(true); })
      .catch(() => setError(true))
      .finally(() => setLoading(false));
  }, [profileReady]);

  if (!profileReady || error) return null;
  if (loading) {
    return (
      <div className="ai-panel" role="status">
        <div className="ai-header"><span className="ai-spark" aria-hidden="true">✦</span> AI Centre Advisor</div>
        <div className="ai-loading"><div className="ai-dots" aria-hidden="true"><span></span><span></span><span></span></div>Analysing your profile…</div>
      </div>
    );
  }
  if (!data) return null;

  const topCentre = CENTRES.find((c) => c.id === data.top_pick?.id);
  const runnerCentre = CENTRES.find((c) => c.id === data.runner_up?.id);

  return (
    <div className="ai-panel" role="region" aria-label="AI centre recommendations">
      <div className="ai-header"><span className="ai-spark" aria-hidden="true">✦</span> AI Centre Advisor · based on your profile</div>
      <div className="ai-rec">
        {topCentre && (
          <button type="button" className="ai-rec-item" onClick={() => onSelectCentre(topCentre.id)}>
            <div className="ai-rec-rank" aria-hidden="true">1</div>
            <div className="ai-rec-body">
              <div className="ai-rec-centre">{topCentre.name}</div>
              <div className="ai-rec-reason">{data.top_pick.reason}</div>
              <div className="ai-rec-select">Select this centre →</div>
            </div>
          </button>
        )}
        {runnerCentre && (

function AINoteSuggest({ form, onSelect }) {
  const [suggestions, setSuggestions] = useState(null);
  const [loading, setLoading] = useState(false);
  const [requested, setRequested] = useState(false);

  const profileReady = form.name.trim().split(/\s+/).length >= 2 && form.role.trim();

  const doFetch = useCallback(() => {
    if (loading || suggestions) return;
    setLoading(true); setRequested(true);
    const centreObj = CENTRES.find((c) => c.id === form.centre);
    AI.noteSuggest({ name: form.name, role: form.role, centre: centreObj?.name || "", focus: centreObj?.focus || "" })
      .then((d) => { if (d?.suggestions) setSuggestions(d.suggestions); })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [form.name, form.role, form.centre, loading, suggestions]);

  if (!profileReady) return null;
  if (suggestions) {
    return (
      <div className="ai-note-chips" role="group" aria-label="AI note suggestions">
        {suggestions.map((s, i) => (
          <button key={i} type="button" className="ai-note-chip" onClick={() => onSelect(s)}>
            ✦ {s}
          </button>
        ))}
      </div>
    );
  }
  if (loading) {
    return (
      <div className="ai-loading" role="status" style={{paddingBottom: 0}}>
        <div className="ai-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        Writing suggestions…
      </div>
    );
  }
  if (!requested) {
    return (
      <button type="button" className="ai-note-chip" onClick={doFetch} style={{marginTop: 8}}>
        ✦ Suggest a note with AI
      </button>
    );
  }
  return null;
}

  const [tab, setTab] = useState("linkedin");

      name: form.name, honorific: form.honorific,

function HowItWorksModal({ open, onClose, onBegin }) {
  const firstFocusable = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      if (e.key === "Tab") {
        // Simple focus trap
        const focusables = document.querySelectorAll(".modal-panel button, .modal-panel a, .modal-panel input");
        if (!focusables.length) return;
        const first = focusables[0], last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey);
    setTimeout(() => firstFocusable.current?.focus(), 60);
    document.body.style.overflow = "hidden";
    return () => {
      document.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    };
  }, [open, onClose]);

  return (
    <div
      className={cn("modal-backdrop", open && "open")}
      onClick={(e) => e.target.classList.contains("modal-backdrop") && onClose()}
      role="dialog"
      aria-modal="true"
