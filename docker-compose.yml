# Local / single-VM deployment. `docker compose up --build` serves the site on
# http://localhost:8080. Uncomment the `db` service (and the AV_DB_* vars) to run
# against MySQL instead of the bundled SQLite — the same switch you'd use to move
# to a managed cloud database (Cloud SQL, RDS, etc.). See DEPLOY.md.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SITE_URL: "http://localhost:8080"
      AV_ORG_DOMAIN: "afrovanguard.org.ng"
      # Required: `docker compose up` stops here until APP_KEY is set (32+ random characters).
      APP_KEY: "${APP_KEY:?Set APP_KEY to 32+ random characters before starting}"
      # The databases live on the data volume, not in db/. db/ holds the schema and
      # seed files that each new image brings, so it must never be a volume.
      AV_DB_PATH: "/var/lib/afrovanguard/diary.sqlite"
      AV_NGV_DB_PATH: "/var/lib/afrovanguard/ngv.sqlite"
      # ── Email (see config.example.php) ─────────────────────────────
      # SMTP_HOST: "smtp.gmail.com"
      # SMTP_USERNAME: "donations@afrovanguard.org.ng"
      # AV_SMTP_PASSWORD: "app-password"
      # AV_RESEND_KEY: "re_..."          # HTTPS fallback when SMTP ports are blocked
      # ── AI (either key enables goal-planning + Catch me up) ────────
      # ANTHROPIC_API_KEY: "sk-ant-..."
      # AV_GEMINI_API_KEY: "..."
      # ── Web-cron key (point a scheduler at /tasks/cron.php?key=...) ─
      # AV_CRON_KEY: "a-long-random-string"
      # ── Database: default is SQLite on the volume below. To use MySQL,
      #    uncomment these + the `db` service, and `depends_on` below. ──
      # AV_DB_HOST: "db"
      # AV_DB_NAME: "afrovanguard"
      # AV_DB_USER: "afro"
      # AV_DB_PASS: "afro"
      # AV_DB_STRICT: "1"                # fail loudly instead of falling back to SQLite
    volumes:
      # Data only. db/ used to be the volume, so the schema and seed files baked
      # into a new image were hidden behind the old volume's copies and a deploy
      # never received a new table or column.
      - app-data:/var/lib/afrovanguard               # SQLite databases
      - app-private:/var/www/html/db/private         # runtime records the app writes
      - app-cache:/var/www/html/db/cache             # rate limits, locks
      - app-uploads:/var/www/html/uploads
      # An install that ran with the old `app-db` volume: mount it here once and
      # the entrypoint copies its databases across (then this line can go).
      # - app-db:/var/www/html/db-legacy:ro
    # depends_on: [db]
    restart: unless-stopped

  # db:
  #   image: mysql:8
  #   environment:
  #     MYSQL_DATABASE: afrovanguard
  #     MYSQL_USER: afro
  #     MYSQL_PASSWORD: afro
  #     MYSQL_ROOT_PASSWORD: rootpw
  #   volumes:
  #     - db-data:/var/lib/mysql
  #   restart: unless-stopped

volumes:
  app-data:
  app-private:
  app-cache:
  app-uploads:
  # app-db:           # the old whole-db/ volume, only while moving off it
  # db-data:
