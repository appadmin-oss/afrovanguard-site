<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Page Not Found — Afrovanguard</title>
<meta name="description" content="The page you're looking for doesn't exist. Return to Afrovanguard."/>
<meta name="theme-color" content="#f3b416"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --gold:#f3b416;--gd:#d49a0e;--gdp:#b07e08;
  --g10:rgba(243,180,22,.10);
  --ink:#111827;--ink-b:#374151;--ink-m:#6B7280;
  --dk:#0d1220;--dk2:#111827;--foot:#0A0F1A;
  --white:#fff;--div-dk:rgba(255,255,255,.07);
  --fh:'Cormorant SC',Georgia,serif;--fb:'Montserrat',-apple-system,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --tf:.18s;--rf:9999px;
  --W:1280px;
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--dk);color:rgba(255,255,255,.7);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--gold);text-decoration:none;transition:color var(--tf)}
::selection{background:var(--gold);color:#fff}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:99px}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:3px;border-radius:4px}
.W{width:100%;max-width:var(--W);margin:0 auto;padding:0 24px}
@media(max-width:640px){.W{padding:0 16px}}

/* NAV */
.site-header{background:var(--dk);border-bottom:1px solid var(--div-dk);padding:0}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
.nav-logo-mark{font-family:var(--fb);font-size:17px;font-weight:800;letter-spacing:-.01em}
.nav-logo-mark .afro{color:#fff}.nav-logo-mark .van{color:var(--gold)}
.nav-badge{font-family:var(--fb);font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dk);background:var(--gold);padding:2px 8px;border-radius:99px;position:relative;top:-1px;margin-left:8px}

/* 404 BODY */
.err-body{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 24px;position:relative;overflow:hidden}
.err-body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(243,180,22,.05) 0%,transparent 60%);pointer-events:none}
.err-inner{position:relative;z-index:1;max-width:560px}
.err-num{font-family:var(--fh);font-size:clamp(80px,18vw,160px);font-weight:700;color:var(--gold);line-height:1;opacity:.15;user-select:none;margin-bottom:-20px}
.err-title{font-family:var(--fh);font-size:clamp(26px,4vw,42px);font-weight:600;color:#fff;margin-bottom:14px}
.err-desc{font-size:14px;color:rgba(255,255,255,.42);line-height:1.75;margin-bottom:36px;max-width:40ch;margin-left:auto;margin-right:auto}
.err-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-p{font-family:var(--fb);font-size:13px;font-weight:700;padding:12px 24px;border-radius:var(--rf);background:var(--gold);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .18s;box-shadow:0 3px 14px rgba(243,180,22,.3)}
.btn-p:hover{background:var(--gd);transform:translateY(-1px);color:var(--ink)}
.btn-o{font-family:var(--fb);font-size:13px;font-weight:700;padding:11px 22px;border-radius:var(--rf);background:transparent;color:rgba(255,255,255,.6);border:1.5px solid rgba(255,255,255,.18);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .18s}
.btn-o:hover{border-color:rgba(255,255,255,.35);color:#fff}

/* FOOTER */
.err-footer{background:var(--foot);border-top:1px solid rgba(255,255,255,.05);padding:20px 0}
.err-footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.f-brand{font-family:var(--fb);font-size:14px;font-weight:800}
.f-brand .a{color:#fff}.f-brand .v{color:var(--gold)}
.f-legal{font-size:11.5px;color:rgba(255,255,255,.22)}
</style>
</head>
<body>

<header class="site-header" role="banner">
  <div class="W">
    <div class="nav-inner">
      <a href="https://afrovanguard.org.ng/" aria-label="Afrovanguard Home" style="display:flex;align-items:center;">
        <span class="nav-logo-mark"><span class="afro">AFRO</span><span class="van">VANGUARD</span></span>
        <span class="nav-badge">.ORG.NG</span>
      </a>
      <a href="https://afrovanguard.org.ng/about/" style="font-family:var(--fb);font-size:13px;font-weight:700;color:rgba(255,255,255,.55);padding:8px 16px;border:1.5px solid rgba(255,255,255,.1);border-radius:var(--rf);display:inline-flex;align-items:center;gap:6px;transition:all .18s">
        ← Back to About
      </a>
    </div>
  </div>
</header>

<main class="err-body">
  <div class="err-inner">
    <div class="err-num" aria-hidden="true">404</div>
    <h1 class="err-title">Page Not Found</h1>
    <p class="err-desc">This page doesn't exist or may have been moved. Let's get you back on track.</p>
    <div class="err-btns">
      <a href="https://afrovanguard.org.ng/" class="btn-p">Go Home</a>
      <a href="https://afrovanguard.org.ng/about/#our-people" class="btn-o">View Our Team</a>
    </div>
  </div>
</main>

<footer class="err-footer" role="contentinfo">
  <div class="W">
    <div class="err-footer-inner">
      <span class="f-brand"><span class="a">AFRO</span><span class="v">VANGUARD</span></span>
      <span class="f-legal">© <span id="copy-year">2026</span> Afrovanguard. Raising 1 Million Incorruptible Leaders.</span>
    </div>
  </div>
</footer>

<script>
  /* Fix M-04: replace deprecated document.write() — CSP-safe, no-JS fallback shows 2026 */
  var y = document.getElementById('copy-year');
  if (y) y.textContent = new Date().getFullYear();
</script>
</body>
</html>
