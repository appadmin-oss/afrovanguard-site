<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — Afrovanguard</title>
  <meta name="theme-color" content="#0B1120" />
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#0B1120;color:#f5f6f7;
      font-family:'Montserrat',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-align:center;padding:24px}
    .o{max-width:380px}
    .o img{width:88px;height:88px;border-radius:22px;margin:0 0 22px}
    .o h1{font-family:'Cormorant',Georgia,serif;font-size:32px;margin:0 0 10px;color:#fff}
    .o p{color:rgba(255,255,255,.6);line-height:1.6;font-size:15px;margin:0 0 24px}
    .o button{background:#f3b416;color:#111827;border:0;border-radius:9999px;padding:13px 28px;
      font:700 14px/1 'Montserrat',sans-serif;cursor:pointer}
  </style>
</head>
<body>
  <div class="o">
    <img src="/assets/site/icon-192.png" alt="Afrovanguard" />
    <h1>You’re offline</h1>
    <p>We couldn’t reach Afrovanguard. Check your connection and try again — your installed app will pick right back up.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
