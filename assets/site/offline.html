<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — Afrovanguard</title>
  <meta name="theme-color" content="#0B1120" />
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#0B1120;color:#f5f6f7;
      font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-align:center;padding:24px}
    .o{max-width:380px}
    .o img{width:88px;height:88px;border-radius:22px;margin:0 0 22px}
    .o h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;margin:0 0 10px;color:#fff}
    .o p{color:rgba(255,255,255,.6);line-height:1.6;font-size:15px;margin:0 0 24px}
    .o button{background:#f3b416;color:#111827;border:0;border-radius:9999px;padding:13px 28px;
      font:700 14px/1 'Source Sans 3',sans-serif;cursor:pointer;min-height:44px}
    .o button:focus-visible,.skip:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .skip{position:absolute;left:16px;top:-100px;padding:10px 16px;border-radius:8px;background:#fff;color:#111827;font-weight:600}
    .skip:focus{top:16px}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <main class="o" id="main" tabindex="-1">
    <img src="/assets/site/icon-192.png" alt="Afrovanguard" />
    <h1>You’re offline</h1>
    <p>We couldn’t reach Afrovanguard. Check your connection and try again — your installed app will pick right back up.</p>
    <!-- A plain form reloads the page: no script, no inline handler. -->
    <form method="get"><button type="submit">Try again</button></form>
  </main>
</body>
</html>
